name: MY SHOP V-19 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP V-19 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout V-19 project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify V-19 project
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "V-19 project structure OK."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e

          grep -q "com.android.application" build.gradle
          grep -q "8.7.3" build.gradle
          grep -q "compileSdk 35" app/build.gradle
          grep -q "targetSdk 35" app/build.gradle
          grep -q "appcompat:appcompat:1.7.0" app/build.gradle

          echo "Gradle configuration OK."

      - name: Check duplicate source classes
        shell: bash
        run: |
          set -e

          echo "Checking Java source files..."

          DUPLICATES=$(find app/src/main/java -type f -name "*.java" \
            -printf "%f\n" | sort | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "ERROR: Duplicate Java source files found:"
            echo "$DUPLICATES"
            exit 1
          fi

          echo "No duplicate Java source files."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --refresh-dependencies \
            clean \
            :app:assembleDebug \
            --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          mkdir -p artifacts

          cp "$DEBUG_APK" \
            "artifacts/V-19 MY SHOP-debug.apk"

          cp "$RELEASE_APK" \
            "artifacts/V-19 MY SHOP-release-unsigned.apk"

          sha256sum artifacts/*.apk \
            > artifacts/SHA256SUMS.txt

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-19-MY-SHOP-APK
          path: artifacts/
          if-no-files-found: error
