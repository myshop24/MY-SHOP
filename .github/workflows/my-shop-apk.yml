name: V-94 MY SHOP FINAL STABLE BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-v94-final
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  VERSION_NUMBER: "94"
  VERSION_NAME: "2.9.94"

  PACKAGE_NAME: "com.myshop.app"

  SOURCE_ZIP: "MY-SHOP-V94-FULL-PROJECT-FINAL.zip"
  SOURCE_DIR: "v94_source"
  RELEASE_DIR: "release"

jobs:
  build:

    name: V-94 - VERIFIED APK

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify V-94 source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::V-94 source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::V-94 source ZIP is empty."
            exit 1
          fi

          echo "========================================"
          echo "V-94 SOURCE VERIFIED"
          echo "========================================"

          ls -lh "$SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract V-94 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          rm -rf "$RELEASE_DIR"

          mkdir -p "$SOURCE_DIR"
          mkdir -p "$RELEASE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "V-94 PROJECT EXTRACTED"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SETTINGS < <(
            find "$SOURCE_DIR" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "${#SETTINGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE Android project."

            printf '%s\n' "${SETTINGS[@]}"

            exit 1
          fi

          ROOT="$(dirname "${SETTINGS[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          if [ ! -s "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

          echo "ANDROID ROOT:"
          echo "$ROOT"

      - name: Repair AccountStore SHA-256
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' FILES < <(
            find app/src/main/java \
              -type f \
              -name "AccountStore.java" \
              -print0
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE AccountStore.java."

            printf '%s\n' "${FILES[@]}"

            exit 1
          fi

          ACCOUNT_STORE="${FILES[0]}"

          echo "AccountStore:"
          echo "$ACCOUNT_STORE"

          python3 - "$ACCOUNT_STORE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          old_call = 'MessageDigest.getInstance("SHA-256")'
          new_call = 'v94Sha256Digest()'

          count = text.count(old_call)

          print(f"SHA-256 calls found: {count}")

          if count == 0:
              print("No direct SHA-256 call found.")

          else:
              text = text.replace(old_call, new_call)

          helper = r'''
          /*
           * V-94 SHA-256 compatibility helper.
           *
           * MessageDigest.getInstance() throws NoSuchAlgorithmException.
           * SHA-256 is required by the Android runtime, so the exception
           * is converted into a clear runtime error here.
           */
          private static java.security.MessageDigest v94Sha256Digest() {
              try {
                  return java.security.MessageDigest.getInstance("SHA-256");
              } catch (java.security.NoSuchAlgorithmException e) {
                  throw new IllegalStateException(
                      "SHA-256 algorithm is unavailable",
                      e
                  );
              }
          }
          '''

          marker = "V-94 SHA-256 compatibility helper."

          if marker not in text:

              last = text.rfind("}")

              if last == -1:
                  raise SystemExit(
                      "ERROR: AccountStore.java closing brace not found."
                  )

              text = (
                  text[:last]
                  + helper
                  + "\n"
                  + text[last:]
              )

          path.write_text(text, encoding="utf-8")

          print("========================================")
          print("V-94 AccountStore SHA-256 FIX APPLIED")
          print("========================================")
          PY

      - name: Verify AccountStore repair
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' FILES < <(
            find app/src/main/java \
              -type f \
              -name "AccountStore.java" \
              -print0
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::AccountStore.java verification failed."
            exit 1
          fi

          ACCOUNT_STORE="${FILES[0]}"

          if ! grep -Fq "v94Sha256Digest()" "$ACCOUNT_STORE"; then
            echo "::error::V-94 SHA-256 helper not found."
            exit 1
          fi

          echo "V-94 ACCOUNTSTORE FIX VERIFIED"

      - name: Fix dashboard reference
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          BAD="app/src/main/res/drawable/myshop_dashboard_reference.png"
          GOOD="app/src/main/res/drawable/myshop_dashboard_header.png"

          if [ -f "$BAD" ]; then

            if [ ! -s "$GOOD" ]; then
              echo "::error::Dashboard header image not found."
              exit 1
            fi

            cp -f "$GOOD" "$BAD"

            echo "Dashboard reference repaired."

          else
            echo "Dashboard reference does not exist."
          fi

      - name: Verify package and launcher
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"
          MANIFEST="${{ steps.project.outputs.manifest }}"

          if ! grep -Eq \
            "applicationId[[:space:]]*(=)?[[:space:]]*['\"]com\.myshop\.app['\"]" \
            "$APP_GRADLE"; then

            echo "::error::Package com.myshop.app not found."
            exit 1
          fi

          if ! grep -Fq "android.intent.action.MAIN" "$MANIFEST"; then
            echo "::error::MAIN launcher not found."
            exit 1
          fi

          if ! grep -Fq "android.intent.category.LAUNCHER" "$MANIFEST"; then
            echo "::error::LAUNCHER category not found."
            exit 1
          fi

          echo "PACKAGE VERIFIED"
          echo "LAUNCHER VERIFIED"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply V-94 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          text, code_count = re.subn(
              r'(\bversionCode\s*(?:=|\s+)?)\d+',
              r'\g<1>94',
              text,
              count=1
          )

          text, name_count = re.subn(
              r'(\bversionName\s*(?:=|\s+)?)[\'"][^\'"]*[\'"]',
              r'\g<1>"2.9.94"',
              text,
              count=1
          )

          if code_count != 1:
              raise SystemExit(
                  "ERROR: versionCode could not be updated."
              )

          if name_count != 1:
              raise SystemExit(
                  "ERROR: versionName could not be updated."
              )

          path.write_text(text, encoding="utf-8")

          print("VERSION CODE: 94")
          print("VERSION NAME: 2.9.94")
          PY

      - name: Verify V-94 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          grep -Eq \
            'versionCode[[:space:]]*(=)?[[:space:]]*94' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*(=)?[[:space:]]*["'\'']2\.9\.94["'\'']' \
            "$APP_GRADLE"

          echo "V-94 VERSION VERIFIED"

      - name: Build release APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app/build

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              :app:assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          else

            gradle \
              clean \
              :app:assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          fi

          mapfile -d '' APKS < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print0
          )

          if [ "${#APKS[@]}" -ne 1 ]; then

            echo "::error::Expected exactly ONE release APK."

            printf '%s\n' "${APKS[@]}"

            exit 1

          fi

          echo "APK FOUND:"
          echo "${APKS[0]}"

          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Require permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MY_SHOP_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::MY_SHOP_RELEASE_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::MY_SHOP_RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::MY_SHOP_RELEASE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::MY_SHOP_RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/myshop-release.jks"

          if [ ! -s "$RUNNER_TEMP/myshop-release.jks" ]; then
            echo "::error::Release keystore is invalid."
            exit 1
          fi

          echo "PERMANENT SIGNING KEY READY"

      - name: Sign V-94 APK
        id: signed
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          UNSIGNED="${{ steps.apk.outputs.path }}"

          ALIGNED="$RUNNER_TEMP/V-94_ALIGNED.apk"

          SIGNED="$RUNNER_TEMP/V-94_MY_SHOP_FINAL.apk"

          "$BT/zipalign" \
            -f \
            -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/myshop-release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo "signed_path=$SIGNED" >> "$GITHUB_OUTPUT"

          echo "V-94 APK SIGNED"

      - name: Verify final APK identity
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          APK="${{ steps.signed.outputs.signed_path }}"

          BADGING="$("$BT/aapt2" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq "package: name='com.myshop.app'"

          echo "$BADGING" \
            | grep -Fq "versionName='2.9.94'"

          echo "$BADGING" \
            | grep -Fq "versionCode='94'"

          echo "========================================"
          echo "V-94 FINAL APK VERIFIED"
          echo "Package: com.myshop.app"
          echo "Version: 2.9.94"
          echo "Version Code: 94"
          echo "========================================"

      - name: Prepare exactly one final APK
        shell: bash
        run: |
          set -euo pipefail

          FINAL="$GITHUB_WORKSPACE/$RELEASE_DIR/V-94_MY_SHOP_FINAL_APK.apk"

          SHA="$GITHUB_WORKSPACE/$RELEASE_DIR/V-94_MY_SHOP_FINAL_APK.sha256"

          rm -f "$RELEASE_DIR"/*.apk
          rm -f "$RELEASE_DIR"/*.sha256

          cp \
            "${{ steps.signed.outputs.signed_path }}" \
            "$FINAL"

          sha256sum "$FINAL" > "$SHA"

          COUNT="$(
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected ONE final APK. Found: $COUNT"
            exit 1
          fi

          test -s "$FINAL"
          test -s "$SHA"

          echo "========================================"
          echo "V-94 FINAL RELEASE READY"
          echo "APK COUNT: 1"
          echo "APK: V-94_MY_SHOP_FINAL_APK.apk"
          echo "========================================"

          ls -lh "$RELEASE_DIR"

          cat "$SHA"

      - name: Upload V-94 final APK
        uses: actions/upload-artifact@v4
        with:
          name: V-94_MY_SHOP_FINAL_APK
          path: |
            release/V-94_MY_SHOP_FINAL_APK.apk
            release/V-94_MY_SHOP_FINAL_APK.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final V-94 guard
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release/V-94_MY_SHOP_FINAL_APK.apk"

          SHA="$GITHUB_WORKSPACE/release/V-94_MY_SHOP_FINAL_APK.sha256"

          test -s "$APK"
          test -s "$SHA"

          COUNT="$(
            find "$GITHUB_WORKSPACE/release" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Final APK count is $COUNT. Expected 1."
            exit 1
          fi

          echo "========================================"
          echo "V-94 SUCCESS"
          echo "Version: 2.9.94"
          echo "Package: com.myshop.app"
          echo "APK COUNT: 1"
          echo "========================================"
