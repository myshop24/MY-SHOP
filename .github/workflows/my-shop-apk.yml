name: V-96 MY SHOP APK BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-v96-build
  cancel-in-progress: true

env:
  VERSION_NUMBER: "96"
  VERSION_NAME: "2.9.96"
  PACKAGE_NAME: "com.myshop.app"

jobs:
  build:

    name: V-96 Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. DOWNLOAD REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. FIND V-96 SOURCE
      # ============================================================

      - name: Find V-96 project source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR V-96 SOURCE"
          echo "========================================"

          mapfile -d '' FILES < <(
            find . \
              -type f \
              \( -iname "*V-96*.zip" -o -iname "*V96*.zip" \) \
              -print0
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::V-96 ZIP file was not found."
            echo ""
            echo "Upload the V-96 full project ZIP to repository root."
            exit 1
          fi

          if [ "${#FILES[@]}" -gt 1 ]; then
            echo "::error::More than one V-96 ZIP was found."
            echo ""
            printf '%s\n' "${FILES[@]}"
            echo ""
            echo "Keep only ONE V-96 source ZIP."
            exit 1
          fi

          SOURCE_ZIP="${FILES[0]}"

          echo "V-96 SOURCE:"
          echo "$SOURCE_ZIP"

          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"

          echo ""
          echo "SHA256:"
          sha256sum "$SOURCE_ZIP"

      # ============================================================
      # 3. EXTRACT PROJECT
      # ============================================================

      - name: Extract V-96 project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v96_project
          mkdir -p v96_project

          unzip -q "${{ steps.source.outputs.source_zip }}" \
            -d v96_project

          echo "========================================"
          echo "V-96 SOURCE EXTRACTED"
          echo "========================================"

          find v96_project -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            | sort

      # ============================================================
      # 4. LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SETTINGS < <(
            find v96_project \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "${#SETTINGS[@]}" -eq 0 ]; then
            echo "::error::No Android settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          if [ "${#SETTINGS[@]}" -gt 1 ]; then
            echo "::error::Multiple Android projects found."
            echo ""
            printf '%s\n' "${SETTINGS[@]}"
            echo ""
            echo "V-96 must contain ONE Android project."
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS[0]}"
          ROOT="$(dirname "$SETTINGS_FILE")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "========================================"
          echo "ROOT:"
          echo "$ROOT"
          echo ""
          echo "APP GRADLE:"
          echo "$APP_GRADLE"
          echo ""
          echo "MANIFEST:"
          echo "$MANIFEST"

      # ============================================================
      # 5. VERIFY PACKAGE
      # ============================================================

      - name: Verify package and launcher
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"
          MANIFEST="${{ steps.project.outputs.manifest }}"

          echo "========================================"
          echo "CHECKING PACKAGE"
          echo "========================================"

          if ! grep -Eq \
            "applicationId[[:space:]]*(=)?[[:space:]]*['\"]${PACKAGE_NAME}['\"]" \
            "$APP_GRADLE"; then

            echo "::error::Expected package ${PACKAGE_NAME} was not found."
            echo ""
            echo "Found applicationId lines:"
            grep -n "applicationId" "$APP_GRADLE" || true
            exit 1
          fi

          if ! grep -Fq "android.intent.action.MAIN" "$MANIFEST"; then
            echo "::error::MAIN launcher activity not found."
            exit 1
          fi

          if ! grep -Fq "android.intent.category.LAUNCHER" "$MANIFEST"; then
            echo "::error::LAUNCHER category not found."
            exit 1
          fi

          echo "PACKAGE VERIFIED:"
          echo "$PACKAGE_NAME"

          echo "LAUNCHER VERIFIED"

      # ============================================================
      # 6. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 7. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "========================================"
          echo "ANDROID SDK READY"
          echo "========================================"

      # ============================================================
      # 8. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ============================================================
      # 9. CHECK GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GRADLE PROJECT CHECK"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "System Gradle will be used."
            gradle --version
          fi

      # ============================================================
      # 10. BUILD DEBUG APK
      #
      # DEBUG APK IS INTENTIONALLY BUILT FIRST.
      #
      # This avoids the previous problem where an unsigned release
      # APK could be generated and Android would reject installation.
      # ============================================================

      - name: Build V-96 APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING V-96 APK"
          echo "========================================"

          rm -rf app/build

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              :app:assembleDebug \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          else

            gradle \
              clean \
              :app:assembleDebug \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          fi

          mapfile -d '' APKS < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print0
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "APK FILES FOUND:"
          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          mkdir -p "$GITHUB_WORKSPACE/release"

          FINAL_APK="$GITHUB_WORKSPACE/release/V-96_MY_SHOP_DEBUG.apk"

          cp -f "$APK" "$FINAL_APK"

          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "FINAL APK:"
          echo "$FINAL_APK"

      # ============================================================
      # 11. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk_path }}"

          if [ ! -f "$APK" ]; then
            echo "::error::Final APK does not exist."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::Final APK is empty."
            exit 1
          fi

          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK TYPE:"
          file "$APK"

          echo ""
          echo "APK SIZE:"
          du -h "$APK"

      # ============================================================
      # 12. COPY SOURCE FOR BACKUP
      # ============================================================

      - name: Prepare V-96 backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/V-96_SOURCE_BACKUP

          cp -f \
            "${{ steps.source.outputs.source_zip }}" \
            release/V-96_SOURCE_BACKUP/

          cat > release/V-96_SOURCE_BACKUP/V-96-BUILD-INFO.txt <<'EOF'
          MY SHOP
          V-96 BUILD

          Version Number: 96
          Version Name: 2.9.96
          Package: com.myshop.app

          Build Type:
          Debug APK

          Purpose:
          Install/test verification build.

          IMPORTANT:
          Keep this V-96 source backup.
          Do not delete previous stable versions.
          EOF

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================

      - name: Upload V-96 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-96-MY-SHOP-APK
          path: release/V-96_MY_SHOP_DEBUG.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 14. UPLOAD SOURCE BACKUP
      # ============================================================

      - name: Upload V-96 source backup
        uses: actions/upload-artifact@v4
        with:
          name: V-96-MY-SHOP-SOURCE-BACKUP
          path: release/V-96_SOURCE_BACKUP
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 15. FINAL BUILD REPORT
      # ============================================================

      - name: V-96 final report
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "        V-96 MY SHOP BUILD COMPLETE"
          echo "================================================"
          echo ""
          echo "Version:"
          echo "2.9.96"
          echo ""
          echo "Package:"
          echo "com.myshop.app"
          echo ""
          echo "APK:"
          echo "V-96_MY_SHOP_DEBUG.apk"
          echo ""
          echo "Artifacts:"
          echo "V-96-MY-SHOP-APK"
          echo "V-96-MY-SHOP-SOURCE-BACKUP"
          echo ""
          echo "================================================"
