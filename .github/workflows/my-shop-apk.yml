name: MY SHOP V-58 VERIFIED APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_ZIP: V-57_MY_SHOP_CORRECTED_SOURCE_FIXED.zip
  SOURCE_DIR: v57_source

jobs:
  build:
    name: MY SHOP V-58 VERIFIED APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY EXACT V57 SOURCE ZIP
      # ============================================================
      - name: Locate exact V57 fixed source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MY SHOP V-58 SOURCE CHECK"
          echo "=========================================="

          if [ ! -f "./${SOURCE_ZIP}" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "./${SOURCE_ZIP}"
            echo ""
            echo "Repository root ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print | sort || true
            exit 1
          fi

          echo "Selected source:"
          echo "./${SOURCE_ZIP}"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "./${SOURCE_ZIP}" >/dev/null

          echo "ZIP integrity: PASSED"

          echo ""
          echo "Checking Android project files..."

          if ! unzip -Z1 "./${SOURCE_ZIP}" | grep -Eq '(^|/)gradlew$'; then
            echo "ERROR: gradlew not found inside V57 source."
            exit 1
          fi

          if ! unzip -Z1 "./${SOURCE_ZIP}" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if ! unzip -Z1 "./${SOURCE_ZIP}" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
            echo "ERROR: build.gradle/build.gradle.kts not found."
            exit 1
          fi

          echo "Android source structure: PASSED"

          echo "zip=${SOURCE_ZIP}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRACT V57 SOURCE
      # ============================================================
      - name: Extract V57 fixed source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "./${{ steps.source.outputs.zip }}" -d "$SOURCE_DIR"

          echo "V57 source extracted."

          echo ""
          echo "Top-level extracted files:"
          find "$SOURCE_DIR" -maxdepth 2 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print | sort


      # ============================================================
      # 4. LOCATE ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          project_root=""

          if [ -f "$SOURCE_DIR/gradlew" ]; then
            project_root="$SOURCE_DIR"
          else
            while IFS= read -r gradlew; do
              candidate="$(dirname "$gradlew")"

              if [ -f "$candidate/settings.gradle" ] || \
                 [ -f "$candidate/settings.gradle.kts" ]; then
                project_root="$candidate"
                break
              fi
            done < <(
              find "$SOURCE_DIR" \
                -type f \
                -name "gradlew" \
                -print
            )
          fi

          if [ -z "$project_root" ]; then
            echo "ERROR: Android Gradle project root not found."
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID PROJECT ROOT"
          echo "$project_root"
          echo "=========================================="

          echo "root=$project_root" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          cd "$ROOT"

          test -f gradlew

          if [ -f settings.gradle ]; then
            echo "settings.gradle: OK"
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts: OK"
          else
            echo "ERROR: settings file missing."
            exit 1
          fi

          if [ -f build.gradle ]; then
            echo "build.gradle: OK"
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts: OK"
          else
            echo "ERROR: build.gradle file missing."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper:"
          ./gradlew --version


      # ============================================================
      # 6. JAVA 17
      # IMPORTANT:
      # NO GRADLE CACHE HERE.
      # Source is not yet in repository root and setup-java cache
      # can fail while searching for Gradle files.
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK components installed."


      # ============================================================
      # 8. GENERATE UNIQUE V58 VERSION
      # ============================================================
      - name: Generate V58 application version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$((580000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="5.8.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "MY SHOP V-58 VERSION"
          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"
          echo "=========================================="


      # ============================================================
      # 9. APPLY VERSION TO APPLICATION MODULE
      # ============================================================
      - name: Apply V58 application version
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t gradle_files < <(
            find "$ROOT" -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
          )

          if [ "${#gradle_files[@]}" -eq 0 ]; then
            echo "ERROR: No Gradle build files found."
            exit 1
          fi

          python3 - "$VERSION_CODE" "$VERSION_NAME" "${gradle_files[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version_code = sys.argv[1]
          version_name = sys.argv[2]

          files = [Path(x) for x in sys.argv[3:]]

          code_pattern = re.compile(
              r'(\bversionCode\s*(?:=\s*)?)(\d+)'
          )

          name_pattern = re.compile(
              r'(\bversionName\s*(?:=\s*)?)(["\'])(.*?)(\2)'
          )

          patched_code = False
          patched_name = False

          for path in files:
              text = path.read_text(encoding="utf-8")

              is_app_module = (
                  "com.android.application" in text
                  or "applicationId" in text
              )

              if not is_app_module:
                  continue

              new_text = text

              new_text, code_count = code_pattern.subn(
                  lambda m: m.group(1) + version_code,
                  new_text,
                  count=1
              )

              new_text, name_count = name_pattern.subn(
                  lambda m:
                      m.group(1)
                      + m.group(2)
                      + version_name
                      + m.group(4),
                  new_text,
                  count=1
              )

              if code_count:
                  patched_code = True

              if name_count:
                  patched_name = True

              if new_text != text:
                  path.write_text(
                      new_text,
                      encoding="utf-8"
                  )

              print(f"Checked: {path}")

          if not patched_code:
              raise SystemExit(
                  "ERROR: versionCode could not be updated."
              )

          if not patched_name:
              raise SystemExit(
                  "ERROR: versionName could not be updated."
              )

          print("")
          print("V58 version successfully applied.")
          print("versionName =", version_name)
          print("versionCode =", version_code)
          PY


      # ============================================================
      # 10. VERIFY IMPORTANT SOURCE BEFORE BUILD
      # ============================================================
      - name: Verify V57 source before build
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          echo "=========================================="
          echo "PRE-BUILD SOURCE CHECK"
          echo "=========================================="

          echo "Checking Java source files..."

          JAVA_COUNT="$(
            find "$ROOT" \
              -type f \
              -name "*.java" \
              | wc -l
          )"

          echo "Java files found: $JAVA_COUNT"

          if [ "$JAVA_COUNT" -eq 0 ]; then
            echo "WARNING: No Java files found."
          fi

          echo ""
          echo "Checking AccountStore.java if present..."

          ACCOUNT_STORE="$(
            find "$ROOT" \
              -type f \
              -name "AccountStore.java" \
              -print \
              | head -n 1
          )"

          if [ -n "$ACCOUNT_STORE" ]; then
            echo "AccountStore found:"
            echo "$ACCOUNT_STORE"

            grep -n "MessageDigest.getInstance" \
              "$ACCOUNT_STORE" \
              || true
          else
            echo "AccountStore.java not found."
          fi

          echo ""
          echo "Pre-build source check completed."


      # ============================================================
      # 11. CLEAN
      # ============================================================
      - name: Clean MY SHOP V58 project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          chmod +x gradlew

          ./gradlew clean --stacktrace


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build MY SHOP V58 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace --no-daemon


      # ============================================================
      # 13. LOCATE EXACTLY ONE RELEASE APK
      # ============================================================
      - name: Locate exactly one release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t apks < <(
            find "$ROOT" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -name "*.apk" \
              -print \
              | sort
          )

          echo "=========================================="
          echo "RELEASE APK SEARCH"
          echo "=========================================="

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: No release APK found."
            exit 1
          fi

          printf '%s\n' "${apks[@]}"

          if [ "${#apks[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Expected exactly ONE release APK."
            echo "Found: ${#apks[@]}"
            exit 1
          fi

          APK="${apks[0]}"

          echo ""
          echo "Selected APK:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 14. VERIFY APK FILE
      # ============================================================
      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          test -s "$APK"

          echo "=========================================="
          echo "APK FILE VERIFICATION"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          file "$APK"

          echo ""
          echo "Testing APK ZIP structure..."

          unzip -t "$APK" >/dev/null

          echo "APK ZIP TEST: PASSED"


      # ============================================================
      # 15. VERIFY APK PACKAGE NAME
      # Uses Android build-tools aapt.
      # Does NOT use apkanalyzer.
      # ============================================================
      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          echo "=========================================="
          echo "APK PACKAGE INFORMATION"
          echo "=========================================="

          "$AAPT" dump badging "$APK" | head -n 5

          echo ""
          echo "APK package verification: PASSED"


      # ============================================================
      # 16. VERIFY VERSION
      # ============================================================
      - name: Verify APK version
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep -q \
            "versionCode='${VERSION_CODE}'"

          echo "$BADGING" | grep -q \
            "versionName='${VERSION_NAME}'"

          echo ""
          echo "=========================================="
          echo "VERSION VERIFICATION PASSED"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "=========================================="


      # ============================================================
      # 17. PREPARE VERIFIED RELEASE
      # ============================================================
      - name: Prepare verified V58 release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "${{ steps.apk.outputs.path }}" \
            "release/MY_SHOP_V58_${VERSION_NAME}.apk"

          cp \
            "${{ steps.source.outputs.zip }}" \
            "release/MY_SHOP_V57_SOURCE_USED_FOR_V58.zip"

          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release/


      # ============================================================
      # 18. UPLOAD VERIFIED RELEASE
      # ============================================================
      - name: Upload verified V58 release
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V58-VERIFIED
          path: release/
          if-no-files-found: error


      # ============================================================
      # 19. COMPLETE
      # ============================================================
      - name: Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "MY SHOP V-58 BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "APK          : VERIFIED"
          echo "=========================================="
