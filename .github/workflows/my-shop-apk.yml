name: MY SHOP - BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'V-*.zip' | sort | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No V-*.zip file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          set -e
          rm -rf source
          mkdir source
          unzip -q "$SOURCE_ZIP" -d source

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find source -type f -name 'settings.gradle' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e

          mkdir -p release-apk

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          cp "$APK" release-apk/MY-SHOP-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-APK
          path: release-apk/MY-SHOP-release.apk
