name: MY SHOP AUTO BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP BUILD
    runs-on: ubuntu-latest

    env:
      MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest V ZIP
        shell: bash
        run: |
          set -euo pipefail

          best=""
          ver=-1

          shopt -s nullglob
          for f in V-*.zip V_*.zip; do
            if [[ "$f" =~ ^V[-_]([0-9]+)-.*\.zip$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))

              if (( n > ver )); then
                ver="$n"
                best="$f"
              fi
            fi
          done

          if [ -z "$best" ]; then
            echo "ERROR: No V-numbered source ZIP found."
            exit 1
          fi

          echo "SOURCE_ZIP=$best" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$ver" >> "$GITHUB_ENV"

          echo "Using source: $best (V-$ver)"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source release
          mkdir -p source release

          unzip -q "$SOURCE_ZIP" -d source

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(
            find source -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit
          )

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found."
            echo "Files found in source:"
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT="$(dirname "$PROJECT_FILE")"

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: Android project found, but app module was not found: $PROJECT"
            find "$PROJECT" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Android project found at: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix BuildConfig and backend URL
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            FILE="$PROJECT/app/build.gradle.kts"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          python3 - "$FILE" "$MYSHOP_BACKEND_URL" <<'PY'
          import sys
          import re

          path = sys.argv[1]
          backend = sys.argv[2]

          s = open(path, encoding="utf-8").read()

          if path.endswith(".gradle"):

              if "buildFeatures" not in s or "buildConfig true" not in s:
                  s = re.sub(
                      r'(\bandroid\s*\{)',
                      r'\1\n    buildFeatures { buildConfig true }',
                      s,
                      count=1
                  )

              field = (
                  "        buildConfigField 'String', "
                  "'MYSHOP_BACKEND_URL', '\"%s\"'\n"
                  % backend.replace("\\", "\\\\").replace('"', '\\"')
              )

              s = re.sub(
                  r'^[ \t]*buildConfigField\s+.*MYSHOP_BACKEND_URL.*\n?',
                  '',
                  s,
                  flags=re.MULTILINE
              )

              m = re.search(r'(\bdefaultConfig\s*\{)', s)

              if not m:
                  raise SystemExit(
                      "defaultConfig block not found in app/build.gradle"
                  )

              insert_at = m.end()

              s = (
                  s[:insert_at]
                  + "\n"
                  + field
                  + s[insert_at:]
              )

          else:

              if "buildFeatures" not in s or "buildConfig = true" not in s:
                  s = re.sub(
                      r'(\bandroid\s*\{)',
                      r'\1\n    buildFeatures { buildConfig = true }',
                      s,
                      count=1
                  )

              escaped = (
                  backend
                  .replace("\\", "\\\\")
                  .replace('"', '\\"')
              )

              field = (
                  '        buildConfigField('
                  '"String", "MYSHOP_BACKEND_URL", "\\"%s\\""'
                  ')\n'
                  % escaped
              )

              s = re.sub(
                  r'^[ \t]*buildConfigField\s*\(\s*"String"\s*,\s*"MYSHOP_BACKEND_URL".*\n?',
                  '',
                  s,
                  flags=re.MULTILINE
              )

              m = re.search(r'(\bdefaultConfig\s*\{)', s)

              if not m:
                  raise SystemExit(
                      "defaultConfig block not found in app/build.gradle.kts"
                  )

              insert_at = m.end()

              s = (
                  s[:insert_at]
                  + "\n"
                  + field
                  + s[insert_at:]
              )

          open(path, "w", encoding="utf-8").write(s)

          print("BuildConfig/backend URL prepared:", path)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable MY SHOP signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: my-shop-release-signing-v1

      - name: Prepare stable MY SHOP signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .signing

          if [ ! -f .signing/myshop-release.jks ]; then

            keytool -genkeypair -v \
              -keystore .signing/myshop-release.jks \
              -storepass myshop-release-2026 \
              -keypass myshop-release-2026 \
              -alias myshop \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MY SHOP, OU=App, O=MY SHOP, L=Satkania, ST=Chattogram, C=BD"

          fi

          keytool -list \
            -keystore .signing/myshop-release.jks \
            -storepass myshop-release-2026 \
            -alias myshop >/dev/null

      - name: Build unsigned release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean :app:assembleRelease \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks

          mapfile -t APKs < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APKs[@]}" -ne 1 ]; then
            echo "ERROR: source build produced ${#APKs[@]} APK files."

            printf '%s\n' "${APKs[@]}"

            exit 1
          fi

          echo "UNSIGNED_APK=${APKs[0]}" >> "$GITHUB_ENV"

          echo "Unsigned APK: ${APKs[0]}"

      - name: Zipalign and sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then

            echo "ERROR: zipalign/apksigner not found."

            ls -la "$BUILD_TOOLS" || true

            exit 1
          fi

          APK="V-${SOURCE_VERSION}-MY-SHOP.apk"

          ALIGNED="$GITHUB_WORKSPACE/release/aligned.apk"
          FINAL="$GITHUB_WORKSPACE/release/$APK"

          "$ZIPALIGN" -p -f 4 \
            "$PROJECT/$UNSIGNED_APK" \
            "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/.signing/myshop-release.jks" \
            --ks-pass pass:myshop-release-2026 \
            --key-pass pass:myshop-release-2026 \
            --ks-key-alias myshop \
            --out "$FINAL" \
            "$ALIGNED"

          rm -f "$ALIGNED"

          "$APKSIGNER" verify --verbose "$FINAL"

          "$ZIPALIGN" -c -v 4 "$FINAL"

          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "SIGNED APK: $FINAL"

      - name: Final single-APK guard
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FINAL_APKS < <(
            find "$GITHUB_WORKSPACE/release" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#FINAL_APKS[@]}" -ne 1 ]; then

            echo "ERROR: Final release must contain exactly one APK."

            printf '%s\n' "${FINAL_APKS[@]}"

            exit 1
          fi

          BASENAME="$(basename "${FINAL_APKS[0]}")"

          if [ "$BASENAME" != "$APK" ]; then

            echo "ERROR: APK name mismatch."

            echo "Expected: $APK"
            echo "Found:    $BASENAME"

            exit 1
          fi

          echo "FINAL APK OK: $BASENAME"

      - name: Upload exactly one APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V-${{ env.SOURCE_VERSION }}

          path: |
            release/${{ env.APK }}
            release/${{ env.APK }}.sha256

          if-no-files-found: error

          retention-days: 30
