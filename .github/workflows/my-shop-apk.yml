name: MY SHOP V-58 VERIFIED APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_ZIP: V-57_MY_SHOP_CORRECTED_SOURCE_FIXED.zip
  SOURCE_DIR: v57_source

jobs:
  build:
    name: MY SHOP V-58 VERIFIED APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL ANDROID SDK
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          echo "Android SDK installation completed."


      # ============================================================
      # 5. LOCATE EXACT V57 SOURCE
      # ============================================================
      - name: Locate exact V57 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MY SHOP V-57 SOURCE CHECK"
          echo "=========================================="

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          echo "Source ZIP:"
          echo "$SOURCE_ZIP"

          echo ""
          echo "Checking ZIP contents..."

          if ! unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)gradlew$'; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if ! unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if ! unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          echo "V57 source structure verified."

          echo "chosen=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. EXTRACT V57 SOURCE
      # ============================================================
      - name: Extract V57 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "V57 source extracted."


      # ============================================================
      # 7. LOCATE ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "$SOURCE_DIR/gradlew" ]; then
            PROJECT_ROOT="$SOURCE_DIR"
          else
            while IFS= read -r gradlew; do
              CANDIDATE="$(dirname "$gradlew")"

              if [ -f "$CANDIDATE/settings.gradle" ] || \
                 [ -f "$CANDIDATE/settings.gradle.kts" ]; then
                PROJECT_ROOT="$CANDIDATE"
                break
              fi
            done < <(
              find "$SOURCE_DIR" \
                -type f \
                -name "gradlew" \
                -print
            )
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          test -f "$ROOT/gradlew"

          if [ -f "$ROOT/settings.gradle" ]; then
            echo "settings.gradle verified."
          elif [ -f "$ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts verified."
          else
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ -f "$ROOT/build.gradle" ]; then
            echo "build.gradle verified."
          elif [ -f "$ROOT/build.gradle.kts" ]; then
            echo "build.gradle.kts verified."
          else
            echo "ERROR: Gradle build file not found."
            exit 1
          fi

          chmod +x "$ROOT/gradlew"

          echo ""
          echo "===== GRADLE VERSION ====="

          cd "$ROOT"
          ./gradlew --version


      # ============================================================
      # 9. GENERATE V58 VERSION
      # ============================================================
      - name: Generate V58 application version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="5.8.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "MY SHOP V-58 VERSION"
          echo "=========================================="
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"


      # ============================================================
      # 10. APPLY V58 VERSION
      # ============================================================
      - name: Apply V58 application version
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t GRADLE_FILES < <(
            find "$ROOT" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
          )

          if [ "${#GRADLE_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No Gradle build files found."
            exit 1
          fi

          python3 \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "${GRADLE_FILES[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version_code = sys.argv[1]
          version_name = sys.argv[2]

          files = [Path(x) for x in sys.argv[3:]]

          code_pattern = re.compile(
              r'(\bversionCode\s*(?:=\s*)?)(\d+)'
          )

          name_pattern = re.compile(
              r'(\bversionName\s*(?:=\s*)?)(["\'])(.*?)(\2)'
          )

          code_updated = False
          name_updated = False

          for path in files:
              text = path.read_text(encoding="utf-8")

              if (
                  "com.android.application" not in text
                  and "applicationId" not in text
              ):
                  continue

              new_text = text

              new_text, code_count = code_pattern.subn(
                  lambda m: m.group(1) + version_code,
                  new_text,
                  count=1
              )

              new_text, name_count = name_pattern.subn(
                  lambda m:
                  m.group(1)
                  + m.group(2)
                  + version_name
                  + m.group(4),
                  new_text,
                  count=1
              )

              if code_count > 0:
                  code_updated = True

              if name_count > 0:
                  name_updated = True

              if new_text != text:
                  path.write_text(
                      new_text,
                      encoding="utf-8"
                  )

          if not code_updated:
              raise SystemExit(
                  "ERROR: versionCode was not updated."
              )

          if not name_updated:
              raise SystemExit(
                  "ERROR: versionName was not updated."
              )

          print("Version update successful.")
          print("versionName =", version_name)
          print("versionCode =", version_code)
          PY


      # ============================================================
      # 11. CLEAN PROJECT
      # ============================================================
      - name: Clean MY SHOP project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          cd "$ROOT"

          chmod +x gradlew

          ./gradlew clean --stacktrace


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build MY SHOP V58 APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          cd "$ROOT"

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace


      # ============================================================
      # 13. LOCATE ONE RELEASE APK
      # ============================================================
      - name: Locate exactly one release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t APKS < <(
            find "$ROOT" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -name "*.apk" \
              -print | sort
          )

          COUNT="${#APKS[@]}"

          echo "Release APK count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No release APK found."
            exit 1
          fi

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: More than one release APK found:"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          APK="${APKS[0]}"

          echo "Selected APK:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 14. VERIFY APK FILE
      # ============================================================
      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          test -s "$APK"

          echo "APK file:"
          ls -lh "$APK"

          echo ""
          echo "Testing APK ZIP structure..."

          unzip -t "$APK" >/dev/null

          echo "APK ZIP structure: PASSED"


      # ============================================================
      # 15. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify "$APK"

          echo "APK signature verification: PASSED"


      # ============================================================
      # 16. VERIFY APK PACKAGE AND VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found."
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK")"

          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | \
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" | \
            head -n 1)"

          APK_VERSION_CODE="$(printf '%s\n' "$BADGING" | \
            sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | \
            head -n 1)"

          APK_VERSION_NAME="$(printf '%s\n' "$BADGING" | \
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | \
            head -n 1)"

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Package name could not be detected."
            exit 1
          fi

          if [ -z "$APK_VERSION_CODE" ]; then
            echo "ERROR: APK versionCode could not be detected."
            exit 1
          fi

          if [ -z "$APK_VERSION_NAME" ]; then
            echo "ERROR: APK versionName could not be detected."
            exit 1
          fi

          echo "Package Name : $PACKAGE_NAME"
          echo "APK Version  : $APK_VERSION_NAME"
          echo "APK Code     : $APK_VERSION_CODE"

          if [ "$APK_VERSION_NAME" != "$VERSION_NAME" ]; then
            echo "ERROR: APK versionName does not match."
            echo "Expected: $VERSION_NAME"
            echo "Actual  : $APK_VERSION_NAME"
            exit 1
          fi

          if [ "$APK_VERSION_CODE" != "$VERSION_CODE" ]; then
            echo "ERROR: APK versionCode does not match."
            echo "Expected: $VERSION_CODE"
            echo "Actual  : $APK_VERSION_CODE"
            exit 1
          fi

          echo ""
          echo "APK package and version verification: PASSED"


      # ============================================================
      # 17. PREPARE VERIFIED RELEASE
      # ============================================================
      - name: Prepare verified V58 release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "${{ steps.apk.outputs.path }}" \
            "release/MY_SHOP_V58_${VERSION_NAME}.apk"

          cp \
            "${{ steps.source.outputs.chosen }}" \
            "release/MY_SHOP_V57_SOURCE_BACKUP_USED_FOR_V58.zip"

          echo "=========================================="
          echo "VERIFIED RELEASE"
          echo "=========================================="

          ls -lh release/


      # ============================================================
      # 18. UPLOAD VERIFIED RELEASE
      # ============================================================
      - name: Upload verified V58 release
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V58-VERIFIED
          path: release/
          if-no-files-found: error


      # ============================================================
      # 19. COMPLETE
      # ============================================================
      - name: Complete
        shell: bash
        run: |
          echo "=========================================="
          echo "MY SHOP V-58 BUILD COMPLETED"
          echo "=========================================="
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "APK Status   : VERIFIED"
          echo "=========================================="
