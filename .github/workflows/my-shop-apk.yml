name: MY SHOP FINAL BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP FINAL RELEASE
    runs-on: ubuntu-latest

    env:
      MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest V ZIP
        shell: bash
        run: |
          set -euo pipefail

          BEST=""
          VERSION=-1

          shopt -s nullglob

          for FILE in V-*.zip V_*.zip; do
            if [[ "$FILE" =~ ^V[-_]([0-9]+)-.*\.zip$ ]]; then

              NUMBER=$((10#${BASH_REMATCH[1]}))

              if (( NUMBER > VERSION )); then
                VERSION="$NUMBER"
                BEST="$FILE"
              fi

            fi
          done

          if [ -z "$BEST" ]; then
            echo "ERROR: No V-numbered source ZIP found."
            exit 1
          fi

          echo "SOURCE_ZIP=$BEST" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SOURCE ZIP: $BEST"
          echo "SOURCE VERSION: V-$VERSION"
          echo "========================================"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          rm -rf release

          mkdir -p source
          mkdir -p release

          unzip -q "$SOURCE_ZIP" -d source

          echo "Source extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Files found:"
            find source -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT="$(dirname "$PROJECT_FILE")"

          echo "Android project: $PROJECT"

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: app module not found: $PROJECT"
            echo ""
            echo "Project files:"
            find "$PROJECT" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "PROJECT=$PROJECT"
          echo "========================================"

      - name: Fix BuildConfig backend URL and version
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            FILE="$PROJECT/app/build.gradle.kts"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          python3 - "$FILE" "$MYSHOP_BACKEND_URL" "$SOURCE_VERSION" <<'PY'
          import sys
          import re

          path = sys.argv[1]
          backend = sys.argv[2]
          version = int(sys.argv[3])

          with open(path, encoding="utf-8") as f:
              s = f.read()

          if path.endswith(".gradle"):

              if re.search(r'\bversionCode\s+\d+', s):
                  s = re.sub(
                      r'\bversionCode\s+\d+',
                      f'versionCode {version}',
                      s,
                      count=1
                  )
              else:
                  s = re.sub(
                      r'(\bdefaultConfig\s*\{)',
                      rf'\1\n        versionCode {version}',
                      s,
                      count=1
                  )

              if re.search(
                  r'\bversionName\s+[\'"][^\'"]+[\'"]',
                  s
              ):
                  s = re.sub(
                      r'\bversionName\s+[\'"][^\'"]+[\'"]',
                      f'versionName "2.9.{version}"',
                      s,
                      count=1
                  )
              else:
                  s = re.sub(
                      r'(\bdefaultConfig\s*\{)',
                      rf'\1\n        versionName "2.9.{version}"',
                      s,
                      count=1
                  )

              if "buildFeatures" not in s or "buildConfig true" not in s:
                  s = re.sub(
                      r'(\bandroid\s*\{)',
                      r'\1\n    buildFeatures { buildConfig true }',
                      s,
                      count=1
                  )

              s = re.sub(
                  r'^[ \t]*buildConfigField\s+.*MYSHOP_BACKEND_URL.*\n?',
                  '',
                  s,
                  flags=re.MULTILINE
              )

              m = re.search(
                  r'(\bdefaultConfig\s*\{)',
                  s
              )

              if not m:
                  raise SystemExit(
                      "ERROR: defaultConfig block not found"
                  )

              escaped = (
                  backend
                  .replace("\\", "\\\\")
                  .replace('"', '\\"')
              )

              field = (
                  "        buildConfigField 'String', "
                  "'MYSHOP_BACKEND_URL', '\""
                  + escaped
                  + "\"'\n"
              )

              s = (
                  s[:m.end()]
                  + "\n"
                  + field
                  + s[m.end():]
              )

          else:

              if re.search(
                  r'\bversionCode\s*=\s*\d+',
                  s
              ):
                  s = re.sub(
                      r'\bversionCode\s*=\s*\d+',
                      f'versionCode = {version}',
                      s,
                      count=1
                  )
              else:
                  s = re.sub(
                      r'(\bdefaultConfig\s*\{)',
                      rf'\1\n        versionCode = {version}',
                      s,
                      count=1
                  )

              if re.search(
                  r'\bversionName\s*=\s*[\'"][^\'"]+[\'"]',
                  s
              ):
                  s = re.sub(
                      r'\bversionName\s*=\s*[\'"][^\'"]+[\'"]',
                      f'versionName = "2.9.{version}"',
                      s,
                      count=1
                  )
              else:
                  s = re.sub(
                      r'(\bdefaultConfig\s*\{)',
                      rf'\1\n        versionName = "2.9.{version}"',
                      s,
                      count=1
                  )

              if (
                  "buildFeatures" not in s
                  or "buildConfig = true" not in s
              ):
                  s = re.sub(
                      r'(\bandroid\s*\{)',
                      r'\1\n    buildFeatures { buildConfig = true }',
                      s,
                      count=1
                  )

              s = re.sub(
                  r'^[ \t]*buildConfigField\s*\(\s*"String"\s*,\s*"MYSHOP_BACKEND_URL".*\n?',
                  '',
                  s,
                  flags=re.MULTILINE
              )

              m = re.search(
                  r'(\bdefaultConfig\s*\{)',
                  s
              )

              if not m:
                  raise SystemExit(
                      "ERROR: defaultConfig block not found"
                  )

              escaped = (
                  backend
                  .replace("\\", "\\\\")
                  .replace('"', '\\"')
              )

              field = (
                  '        buildConfigField('
                  '"String", '
                  '"MYSHOP_BACKEND_URL", '
                  '"\\"'
                  + escaped
                  + '\\""'
                  ')\n'
              )

              s = (
                  s[:m.end()]
                  + "\n"
                  + field
                  + s[m.end():]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print(
              f"Prepared {path}: "
              f"versionCode={version}, "
              f"versionName=2.9.{version}"
          )

          print("Backend URL prepared.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable MY SHOP signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: my-shop-release-signing-v1

      - name: Prepare stable MY SHOP signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .signing

          if [ ! -f ".signing/myshop-release.jks" ]; then

            echo "Creating MY SHOP signing key..."

            keytool -genkeypair -v \
              -keystore ".signing/myshop-release.jks" \
              -storepass "myshop-release-2026" \
              -keypass "myshop-release-2026" \
              -alias "myshop" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MY SHOP, OU=App, O=MY SHOP, L=Satkania, ST=Chattogram, C=BD"

          else

            echo "Existing MY SHOP signing key restored."

          fi

          keytool -list \
            -keystore ".signing/myshop-release.jks" \
            -storepass "myshop-release-2026" \
            -alias "myshop" \
            >/dev/null

          echo "Signing key is ready."

      - name: Build exactly one release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING MY SHOP V-$SOURCE_VERSION"
          echo "========================================"

          gradle clean :app:assembleRelease \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks

          mapfile -t APK_FILES < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then

            echo "ERROR: Build produced ${#APK_FILES[@]} APK files."

            printf '%s\n' "${APK_FILES[@]}"

            exit 1
          fi

          echo "UNSIGNED_APK=${APK_FILES[0]}" >> "$GITHUB_ENV"

          echo "Unsigned APK:"
          echo "${APK_FILES[0]}"

      - name: Zipalign and sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          APK_NAME="MY_SHOP_FINAL_RELEASE.apk"

          ALIGNED="$GITHUB_WORKSPACE/release/aligned.apk"
          FINAL="$GITHUB_WORKSPACE/release/$APK_NAME"

          "$ZIPALIGN" -p -f 4 \
            "$PROJECT/$UNSIGNED_APK" \
            "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/.signing/myshop-release.jks" \
            --ks-pass pass:myshop-release-2026 \
            --key-pass pass:myshop-release-2026 \
            --ks-key-alias myshop \
            --out "$FINAL" \
            "$ALIGNED"

          rm -f "$ALIGNED"

          "$APKSIGNER" verify \
            --verbose \
            "$FINAL"

          "$ZIPALIGN" -c -v 4 "$FINAL"

          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "APK=$APK_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SIGNED APK CREATED"
          echo "$FINAL"
          echo "========================================"

      - name: Final release guards
        shell: bash
        run: |
          set -euo pipefail

          FINAL="$GITHUB_WORKSPACE/release/$APK"

          if [ ! -f "$FINAL" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          mapfile -t APK_FILES < <(
            find "$GITHUB_WORKSPACE/release" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Final release must contain exactly ONE APK."

            printf '%s\n' "${APK_FILES[@]}"

            exit 1
          fi

          BASENAME="$(basename "${APK_FILES[0]}")"

          if [ "$BASENAME" != "$APK" ]; then
            echo "ERROR: APK name mismatch."
            echo "Expected: $APK"
            echo "Found: $BASENAME"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$FINAL"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -v 4 \
            "$FINAL"

          test -s "$FINAL.sha256"

          echo "========================================"
          echo "FINAL APK VERIFIED"
          echo "$APK"
          echo "========================================"

      - name: Upload final APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-FINAL-V-${{ env.SOURCE_VERSION }}

          path: |
            release/${{ env.APK }}
            release/${{ env.APK }}.sha256

          if-no-files-found: error

          retention-days: 30
