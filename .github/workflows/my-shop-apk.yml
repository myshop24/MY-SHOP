name: MY SHOP V-101 DASHBOARD TEST BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: my-shop-v101-build
  cancel-in-progress: true

env:
  VERSION_CODE: "101"
  VERSION_NAME: "2.9.101"
  PACKAGE_NAME: "com.myshop.app"
  SOURCE_ZIP: "V-101-MY-SHOP-FULL-MASTER.zip"

jobs:
  build:
    name: V-101 MY SHOP ZIP BUILD
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find EXACT V-101 ZIP
      # --------------------------------------------------
      - name: Find exact V-101 source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for exact source:"
          echo "${SOURCE_ZIP}"

          ZIP_PATH="$(find . -type f -name "${SOURCE_ZIP}" -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ${SOURCE_ZIP} was not found."
            echo ""
            echo "Available V-100/V-101 ZIP files:"
            find . -type f \( -name 'V-100*.zip' -o -name 'V-101*.zip' \) -print || true
            exit 1
          fi

          echo "FOUND:"
          echo "$ZIP_PATH"

          echo "SOURCE_ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Prepare clean build directory
      # --------------------------------------------------
      - name: Prepare V-101 source
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/v101_source"
          mkdir -p "$GITHUB_WORKSPACE/v101_source"

          echo "Extracting exact V-101 ZIP..."
          unzip -q "$SOURCE_ZIP_PATH" -d "$GITHUB_WORKSPACE/v101_source"

          echo "Checking extracted project..."

          test -f "$GITHUB_WORKSPACE/v101_source/settings.gradle" || {
            echo "ERROR: settings.gradle not found."
            find "$GITHUB_WORKSPACE/v101_source" -maxdepth 3 -type f | head -100
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/v101_source/app/build.gradle" || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/v101_source/app/src/main/java/com/myshop/app/MainActivity.java" || {
            echo "ERROR: V-101 MainActivity.java not found."
            exit 1
          }

          echo "V-101 source extraction OK."

      # --------------------------------------------------
      # 4. Verify exact version
      # --------------------------------------------------
      - name: Verify V-101 source integrity
        shell: bash
        working-directory: v101_source
        run: |
          set -e

          echo "Checking versionCode..."
          grep -q 'versionCode 101' app/build.gradle

          echo "Checking versionName..."
          grep -q 'versionName "2.9.101"' app/build.gradle

          echo "Checking applicationId..."
          grep -q 'applicationId "com.myshop.app"' app/build.gradle

          echo "Checking V-101 MainActivity..."
          grep -q 'class MainActivity' app/src/main/java/com/myshop/app/MainActivity.java

          echo "Checking V-101 master files..."
          test -f V-101_MASTER_MANIFEST.txt
          test -f V-101_RELEASE_NOTES.md
          test -f V-101_SOURCE_INTEGRITY.txt

          echo "Checking dashboard banner limit..."
          grep -R -q '"maxBannersPerSection"[[:space:]]*:[[:space:]]*6' backend app/src/main/assets 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "V-101 SOURCE VERIFICATION SUCCESS"
          echo "VERSION CODE : 101"
          echo "VERSION NAME : 2.9.101"
          echo "PACKAGE      : com.myshop.app"
          echo "======================================"

      # --------------------------------------------------
      # 5. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      # --------------------------------------------------
      # 7. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # --------------------------------------------------
      # 8. Show build environment
      # --------------------------------------------------
      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # --------------------------------------------------
      # 9. Build EXACTLY ONE APK
      # --------------------------------------------------
      - name: Build V-101 APK
        working-directory: v101_source
        shell: bash
        run: |
          set -e

          rm -rf app/build

          echo "Starting V-101 clean build..."

          gradle clean :app:assembleDebug --no-daemon --stacktrace

          echo ""
          echo "Searching for generated APK..."

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          echo "APK COUNT = $APK_COUNT"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE APK."
            find app/build/outputs/apk -type f -name "*.apk" -print || true
            exit 1
          fi

          APK_SOURCE=$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
             "$GITHUB_WORKSPACE/release/V-101-MY-SHOP-DASHBOARD-TEST.apk"

          echo "APK created:"
          ls -lh "$GITHUB_WORKSPACE/release/V-101-MY-SHOP-DASHBOARD-TEST.apk"

      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/V-101-MY-SHOP-DASHBOARD-TEST.apk"

          test -f "$APK"

          echo "APK SHA256:"
          sha256sum "$APK" | tee release/V-101-MY-SHOP-DASHBOARD-TEST.sha256

          echo ""
          echo "APK information:"
          ls -lh "$APK"

          echo ""
          echo "V-101 APK verification SUCCESS."

      # --------------------------------------------------
      # 11. Create full V-101 master backup
      # --------------------------------------------------
      - name: Create V-101 full master backup
        shell: bash
        run: |
          set -e

          mkdir -p backup_package

          cp -r v101_source backup_package/MY_SHOP_V101_SOURCE

          cp release/V-101-MY-SHOP-DASHBOARD-TEST.apk \
             backup_package/

          cp release/V-101-MY-SHOP-DASHBOARD-TEST.sha256 \
             backup_package/

          cat > backup_package/V-101_BUILD_INFO.txt <<EOF
          MY SHOP V-101 BUILD

          Version Code: 101
          Version Name: 2.9.101
          Package Name: com.myshop.app

          Source ZIP:
          ${SOURCE_ZIP}

          Build Type:
          DEBUG TEST BUILD

          APK:
          V-101-MY-SHOP-DASHBOARD-TEST.apk
          EOF

          cd backup_package

          zip -qr \
            "$GITHUB_WORKSPACE/release/V-101-MY-SHOP-FULL-BUILD-BACKUP.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          echo "Full backup created:"
          ls -lh release/V-101-MY-SHOP-FULL-BUILD-BACKUP.zip

      # --------------------------------------------------
      # 12. Upload ONLY required APK
      # --------------------------------------------------
      - name: Upload V-101 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-101-MY-SHOP-DASHBOARD-TEST
          path: release/V-101-MY-SHOP-DASHBOARD-TEST.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 13. Upload complete backup
      # --------------------------------------------------
      - name: Upload V-101 full backup
        uses: actions/upload-artifact@v4
        with:
          name: V-101-MY-SHOP-FULL-BUILD-BACKUP
          path: |
            release/V-101-MY-SHOP-FULL-BUILD-BACKUP.zip
            release/V-101-MY-SHOP-DASHBOARD-TEST.sha256
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 14. Final success message
      # --------------------------------------------------
      - name: V-101 BUILD SUCCESS
        run: |
          echo ""
          echo "=============================================="
          echo "       MY SHOP V-101 BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Version Code : 101"
          echo "Version Name : 2.9.101"
          echo "Package      : com.myshop.app"
          echo ""
          echo "APK:"
          echo "V-101-MY-SHOP-DASHBOARD-TEST.apk"
          echo ""
          echo "The build used EXACTLY:"
          echo "${SOURCE_ZIP}"
          echo ""
          echo "No older V-XX ZIP was selected."
          echo "=============================================="
