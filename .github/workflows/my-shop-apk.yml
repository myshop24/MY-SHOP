name: MY SHOP V-59 ONE RELEASE APK — FIXED SOURCE SELECTION

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_DIR: v59_source

jobs:
  build:
    name: MY SHOP V-59 - SINGLE VERIFIED RELEASE APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1. SOURCE: exactly ONE valid V57/V58-era Android source ZIP
      # ------------------------------------------------------------
      - name: Locate exactly one valid MY SHOP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # The repository currently contains two V-57 source archives:
          #   V-57_MY_SHOP_CORRECTED_SOURCE.zip
          #   V-57_MY_SHOP_CORRECTED_SOURCE_FIXED.zip
          # They are both structurally valid, so a raw "exactly one" scan is
          # ambiguous.  Use the FIXED archive as the authoritative source.
          preferred=(
            "./V-57_MY_SHOP_CORRECTED_SOURCE_FIXED.zip"
            "./V-57_MY_SHOP_CORRECTED_SOURCE.zip"
          )

          chosen=""
          for zip in "${preferred[@]}"; do
            if [ -f "$zip" ]; then
              if unzip -Z1 "$zip" | grep -Eq '(^|/)gradlew$' \
                && unzip -Z1 "$zip" | grep -Eq '(^|/)settings\.gradle(\.kts)?$' \
                && unzip -Z1 "$zip" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
                chosen="$zip"
                break
              fi
            fi
          done

          if [ -z "$chosen" ]; then
            echo "::error::No complete V-57 MY SHOP Android source archive was found."
            echo "Expected one of:"
            printf '  %s\n' "${preferred[@]}"
            exit 1
          fi

          echo "Selected authoritative source: $chosen"
          echo "chosen=$chosen" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q "${{ steps.source.outputs.chosen }}" -d "$SOURCE_DIR"

      # ------------------------------------------------------------
      # 2. Locate exactly one Android project
      # ------------------------------------------------------------
      - name: Locate exactly one Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t settings_files < <(
            find "$SOURCE_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print | sort
          )

          if [ "${#settings_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one settings.gradle(.kts). Found ${#settings_files[@]}."
            printf '%s\n' "${settings_files[@]:-<none>}"
            exit 1
          fi

          root="$(dirname "${settings_files[0]}")"

          test -f "$root/gradlew"
          test -f "$root/build.gradle" || test -f "$root/build.gradle.kts"

          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Android project root: $root"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 3. Automatic V-59 version
      # ------------------------------------------------------------
      - name: Generate V-59 version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$((590000 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="5.9.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "V-59 VERSION_NAME=$VERSION_NAME"
          echo "V-59 VERSION_CODE=$VERSION_CODE"

      - name: Apply version to Android app
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t gradle_files < <(
            find "$ROOT" -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
          )

          python3 - "$VERSION_CODE" "$VERSION_NAME" "${gradle_files[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version_code = sys.argv[1]
          version_name = sys.argv[2]
          files = [Path(x) for x in sys.argv[3:]]

          code_re = re.compile(r'(\bversionCode\s*(?:=\s*)?)\d+')
          name_re = re.compile(r'(\bversionName\s*(?:=\s*)?)(["\'])(.*?)(\2)')

          patched_code = False
          patched_name = False

          for path in files:
              text = path.read_text(encoding="utf-8")
              if "com.android.application" not in text and "applicationId" not in text:
                  continue

              new, n1 = code_re.subn(r'\g<1>' + version_code, text, count=1)
              new, n2 = name_re.subn(
                  r'\g<1>\g<2>' + version_name + r'\g<4>',
                  new,
                  count=1
              )

              if n1:
                  patched_code = True
              if n2:
                  patched_name = True

              if new != text:
                  path.write_text(new, encoding="utf-8")

          if not patched_code or not patched_name:
              raise SystemExit(
                  "ERROR: Could not update both versionCode and versionName."
              )

          print(f"Applied versionName={version_name}, versionCode={version_code}")
          PY

      # ------------------------------------------------------------
      # 4. Clean release build
      # ------------------------------------------------------------
      - name: Clean previous APK outputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          rm -rf "$ROOT/app/build/outputs/apk"
          rm -rf release

      - name: Build V-59 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      # ------------------------------------------------------------
      # 5. HARD STOP if more than ONE APK exists
      # ------------------------------------------------------------
      - name: Locate exactly one release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t apks < <(
            find "$ROOT" -type f \
              -path '*/build/outputs/apk/*.apk' \
              -name '*.apk' | sort
          )

          echo "APK files produced:"
          printf '%s\n' "${apks[@]:-<none>}"

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::BUILD REJECTED: exactly ONE release APK is required."
            echo "Found ${#apks[@]} APK file(s)."
            exit 1
          fi

          case "${apks[0]}" in
            */build/outputs/apk/release/*.apk) ;;
            *)
              echo "::error::BUILD REJECTED: APK is not from release output."
              exit 1
              ;;
          esac

          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. REAL APK verification - not only unzip -t
      # ------------------------------------------------------------
      - name: Verify APK integrity, signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"

          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found."
            exit 1
          fi

          echo "===== APK SIGNATURE ====="
          "$APKSIGNER" verify --verbose "$APK"

          echo "===== APK BADGING ====="
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING"

          echo "$BADGING" | grep -Fq "package: name='com.myshop.app'" || {
            echo "::error::Unexpected applicationId."
            exit 1
          }

          echo "$BADGING" | grep -Fq "versionCode='$VERSION_CODE'" || {
            echo "::error::versionCode mismatch."
            exit 1
          }

          echo "$BADGING" | grep -Fq "versionName='$VERSION_NAME'" || {
            echo "::error::versionName mismatch."
            exit 1
          }

          echo "APK integrity/signature/identity verification PASSED."

      # ------------------------------------------------------------
      # 7. Create ONLY ONE release APK + checksum
      # ------------------------------------------------------------
      - name: Prepare single release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          FINAL="release/MY_SHOP_V59_RELEASE.apk"
          cp "${{ steps.apk.outputs.path }}" "$FINAL"

          test -s "$FINAL"

          sha256sum "$FINAL" > release/MY_SHOP_V59_RELEASE.sha256

          # HARD GUARD: release folder may contain only one APK.
          APK_COUNT="$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Final release must contain exactly ONE APK."
            exit 1
          fi

          echo "===== FINAL RELEASE ====="
          ls -lh release
          echo
          cat release/MY_SHOP_V59_RELEASE.sha256

      - name: Upload ONE V-59 release APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V59-ONE-RELEASE
          path: |
            release/MY_SHOP_V59_RELEASE.apk
            release/MY_SHOP_V59_RELEASE.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final success guard
        shell: bash
        run: |
          set -euo pipefail
          APK_COUNT="$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$APK_COUNT" -eq 1
          test -s release/MY_SHOP_V59_RELEASE.apk
          test -s release/MY_SHOP_V59_RELEASE.sha256
          echo "MY SHOP V-59: ONE VALID RELEASE APK READY."
