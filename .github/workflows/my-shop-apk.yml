name: V-84 MY SHOP - SINGLE VERIFIED APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: V-84 - SINGLE VERIFIED APK
    runs-on: ubuntu-latest

    env:
      APP_VERSION_NAME: "8.4.0"
      APP_VERSION_CODE: "84"
      SOURCE_ZIP: "V-77_MY_SHOP_FULL_SOURCE.zip"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select official source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking official source ZIP..."

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Official source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          echo "Using:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/build_source"

          echo "Source extracted successfully."

      - name: Locate exactly one Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PROJECTS < <(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print
          )

          COUNT="${#PROJECTS[@]}"

          echo "Android projects found: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE Android project."
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT="${PROJECTS[0]}"
          ANDROID_ROOT="$(dirname "$PROJECT")"

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.9"

          curl -fL \
            -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "/opt/gradle-${GRADLE_VERSION}"

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Apply V-84 version
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version_name = os.environ["APP_VERSION_NAME"]
          version_code = os.environ["APP_VERSION_CODE"]

          files = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
              Path("build.gradle"),
              Path("build.gradle.kts")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(errors="ignore")

              text = re.sub(
                  r'versionCode\s*[=:]?\s*\d+',
                  f'versionCode {version_code}',
                  text
              )

              text = re.sub(
                  r'versionName\s*[=:]?\s*["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text
              )

              path.write_text(text)

              print("Checked:", path)

          print("V-84 version applied.")
          print("versionCode:", version_code)
          print("versionName:", version_name)
          PY

      - name: Repair AccountStore SHA-256 exception
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          FILE="$(
            find . \
              -type f \
              -path "*/src/main/java/*" \
              -name "AccountStore.java" \
              -print -quit
          )"

          if [ -z "$FILE" ]; then
            echo "AccountStore.java not found."
            echo "No AccountStore repair required."
            exit 0
          fi

          echo "AccountStore:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(errors="ignore")

          if "NoSuchAlgorithmException" not in text:
              print("NoSuchAlgorithmException found.")
              raise SystemExit(0)

          if "import java.security.NoSuchAlgorithmException;" not in text:
              match = re.search(
                  r'(^package\s+[^;]+;)',
                  text,
                  flags=re.MULTILINE
              )

              if match:
                  text = text[:match.end()] + \
                      "\n\nimport java.security.NoSuchAlgorithmException;" + \
                      text[match.end():]

          old = 'return "sha256:" + sha256(canonicalAnswer(answer));'

          if old in text:
              new = '''try {
              return "sha256:" + sha256(canonicalAnswer(answer));
          } catch (NoSuchAlgorithmException e) {
              throw new IllegalStateException(
                  "SHA-256 is unavailable",
                  e
              );
          }'''

              text = text.replace(old, new, 1)

          path.write_text(text)

          print("AccountStore SHA-256 repair completed.")
          PY

      - name: Find Gradle launcher
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Using Gradle wrapper."
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Using installed Gradle."
          fi

      - name: Verify launcher manifest
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          MANIFEST="$(
            find . \
              -type f \
              -path "*/src/main/AndroidManifest.xml" \
              -print -quit
          )"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest:"
          echo "$MANIFEST"

          grep -q "android.intent.action.MAIN" "$MANIFEST"

          grep -q "android.intent.category.LAUNCHER" "$MANIFEST"

          echo "Launcher manifest verified."

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            --version

      - name: Clean project
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build DEBUG APK
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find exactly one APK
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final_apk"

          mapfile -t APKS < <(
            find . \
              -type f \
              -path "*/build/outputs/apk/**/*.apk" \
              -print
          )

          COUNT="${#APKS[@]}"

          echo "APK files found: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE APK."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" \
            "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk"

          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk"

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk"

          echo "APK exists."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk"

          echo "APK signature verified."

      - name: Verify package name
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk" \
            | head -n 1

      - name: Verify launcher activity
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/final_apk/MY-SHOP-V84.apk" \
            | grep -q "launchable-activity"

          echo "Launcher activity verified."

      - name: Verify exactly one final APK
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find "$GITHUB_WORKSPACE/final_apk" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo "Final APK count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Final APK count is not exactly 1."
            exit 1
          fi

      - name: Upload V-84 final APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V84-FINAL-APK
          path: final_apk/MY-SHOP-V84.apk
          if-no-files-found: error

      - name: Final ONE APK guard
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find "$GITHUB_WORKSPACE/final_apk" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Final output must contain exactly ONE APK."
            exit 1
          fi

          echo "SUCCESS: Exactly ONE verified APK prepared."
