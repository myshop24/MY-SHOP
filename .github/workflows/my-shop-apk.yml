name: MY SHOP V-20 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  V20_ZIP: V-20_MY_SHOP_RUNTIME_FIXED_SOURCE.zip

jobs:
  build:
    name: MY SHOP V-20 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. VERIFY EXACT V-20 SOURCE ZIP
      # ============================================================
      - name: Verify exact V-20 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected V-20 source:"
          echo "$V20_ZIP"

          if [ ! -f "$V20_ZIP" ]; then
            echo "ERROR: Exact V-20 ZIP not found."
            echo
            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name "*.zip" \
              -print | sort

            exit 1
          fi

          echo
          echo "V-20 ZIP FOUND:"
          ls -lh "$V20_ZIP"

      # ============================================================
      # 5. EXTRACT V-20 SOURCE
      # ============================================================
      - name: Extract V-20 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$V20_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "V-20 source extracted successfully."

      # ============================================================
      # 6. LOCATE EXACTLY ONE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            echo
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 7. PROJECT STRUCTURE CHECK
      # ============================================================
      - name: Verify V-20 Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f settings.gradle ]; then
            echo "settings.gradle found."
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts found."
          else
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ -f build.gradle ]; then
            echo "build.gradle found."
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts found."
          else
            echo "ERROR: Root build.gradle(.kts) missing."
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            echo "app/build.gradle found."
          elif [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts found."
          else
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          test -f app/src/main/AndroidManifest.xml

          MAIN_ACTIVITY="$(
            find app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY=$PROJECT_DIR/$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo
          echo "PROJECT STRUCTURE CHECK PASSED."

      # ============================================================
      # 8. VERSION + PACKAGE CHECK
      # ============================================================
      - name: Verify V-20 version and package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f app/build.gradle ]; then
            BUILD_FILE="app/build.gradle"
          else
            BUILD_FILE="app/build.gradle.kts"
          fi

          echo "Using:"
          echo "$BUILD_FILE"

          grep -Eq \
            'versionCode[[:space:]]+(=[[:space:]]*)?20([[:space:]]|$)' \
            "$BUILD_FILE"

          grep -Eq \
            'versionName[[:space:]]+(=[[:space:]]*)?["'\'']2\.9\.0["'\'']' \
            "$BUILD_FILE"

          grep -Eq \
            'applicationId[[:space:]]+["'\'']com\.myshop\.app["'\'']' \
            "$BUILD_FILE"

          if grep -q 'applicationIdSuffix' "$BUILD_FILE"; then
            echo "ERROR: applicationIdSuffix must NOT be present."
            exit 1
          fi

          echo
          echo "V-20 VERSION/PACKAGE CHECK PASSED."

      # ============================================================
      # 9. SEARCHBOX FIX CHECK
      # ============================================================
      - name: Verify MainActivity searchBox fix
        shell: bash
        run: |
          set -euo pipefail

          test -s "$MAIN_ACTIVITY"

          grep -Eq \
            'searchBox[[:space:]]*=[[:space:]]*findViewById\(R\.id\.searchBox\)' \
            "$MAIN_ACTIVITY"

          grep -Eq \
            'searchBox\.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"

          if grep -Eq \
            'findViewById\(R\.id\.searchBox\)\.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Unsafe searchBox listener still exists."
            exit 1
          fi

          echo "SEARCHBOX FIX CHECK PASSED."

      # ============================================================
      # 10. V-20 VALIDATOR
      # ============================================================
      - name: Run V-20 validator
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f tools/validate_v20.py ]; then
            echo "ERROR: tools/validate_v20.py is missing."
            exit 1
          fi

          python3 tools/validate_v20.py

          echo
          echo "V-20 VALIDATOR PASSED."

      # ============================================================
      # 11. GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      # ============================================================
      # 12. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew

            ./gradlew --version

            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            gradle --version

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 13. CLEAN
      # ============================================================
      - name: Clean V-20 project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf \
            .gradle \
            build \
            app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "CLEAN PASSED."

      # ============================================================
      # 14. DUPLICATE CLASS CHECK
      # ============================================================
      - name: Check duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "DUPLICATE CLASS CHECK PASSED."

      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP V-20 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "BUILDING MY SHOP V-20 APK"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

          echo
          echo "GRADLE BUILD PASSED."

      # ============================================================
      # 16. VERIFY EXACTLY ONE DEBUG APK
      # ============================================================
      - name: Verify exactly one V-20 APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APK_FILES < <(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print | sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE debug APK."
            echo "Found: ${#APK_FILES[@]}"
            echo

            printf '%s\n' "${APK_FILES[@]}"

            exit 1
          fi

          APK_FILE="${APK_FILES[0]}"

          echo "APK FOUND:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 17. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify V-20 APK package and version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found:"
            echo "$AAPT2"

            echo
            echo "Installed build-tools:"
            ls -la \
              "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
              || true

            exit 1
          fi

          echo "Using aapt2:"
          "$AAPT2" version

          BADGING="$(
            "$AAPT2" dump badging "$APK_FILE"
          )"

          echo
          echo "APK BADGING:"
          echo "$BADGING"

          echo "$BADGING" | grep -q \
            "package: name='com.myshop.app' versionCode='20' versionName='2.9.0'"

          echo
          echo "V-20 APK PACKAGE/VERSION CHECK PASSED."

      # ============================================================
      # 18. CREATE FINAL RELEASE FILE
      # ============================================================
      - name: Prepare final V-20 APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.apk"

          test -s \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.apk"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.apk"

      # ============================================================
      # 19. APK INTEGRITY CHECK
      # ============================================================
      - name: Verify final APK integrity
        shell: bash
        run: |
          set -euo pipefail

          FINAL_APK="$GITHUB_WORKSPACE/release/V-20-MY-SHOP.apk"

          unzip -t "$FINAL_APK" >/dev/null

          sha256sum "$FINAL_APK" \
            > "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.sha256"

          test -s \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.sha256"

          echo
          echo "SHA256:"
          cat "$GITHUB_WORKSPACE/release/V-20-MY-SHOP.sha256"

          echo
          echo "FINAL APK INTEGRITY CHECK PASSED."

      # ============================================================
      # 20. UPLOAD ONLY APK
      # ============================================================
      - name: Upload MY SHOP V-20 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-20-MY-SHOP-APK
          path: release/V-20-MY-SHOP.apk
          if-no-files-found: error
          retention-days: 30
