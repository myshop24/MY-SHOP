name: MY SHOP - V51 Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: my-shop-main-build
  cancel-in-progress: true

env:
  SOURCE_ZIP: "V-51_MY_SHOP_FINAL_SOURCE.zip"
  EXPECTED_APPLICATION_ID: "com.myshop.app"

jobs:
  build:
    name: MY SHOP APK - V51 SOURCE
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. VERIFY SELECTED SOURCE ZIP
      # ==========================================================
      - name: Verify selected source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Selected source ZIP not found: $SOURCE_ZIP"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname "*.zip" -printf '%f\n' | sort || true
            exit 1
          fi

          echo "Selected source: $SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP" >/dev/null

          echo "ZIP integrity check: PASSED"

      # ==========================================================
      # 3. EXTRACT SELECTED SOURCE TO ISOLATED WORKSPACE
      # ==========================================================
      - name: Extract selected source to isolated workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$SOURCE_ZIP" -d build-source

          echo "Searching extracted source for Android project..."

          mapfile -t ROOTS < <(
            find build-source \
              -type f \
              -name gradlew \
              -printf '%h\n' |
              sort -u
          )

          if [ "${#ROOTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android project containing gradlew; found ${#ROOTS[@]}."
            printf '%s\n' "${ROOTS[@]:-}"
            exit 1
          fi

          SOURCE_DIR="${ROOTS[0]}"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Android source directory:"
          echo "$SOURCE_DIR"

      # ==========================================================
      # 4. VERIFY ANDROID SOURCE STRUCTURE
      # ==========================================================
      - name: Verify Android source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew missing."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] &&
             [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::settings.gradle or settings.gradle.kts missing."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "::error::app/ directory missing."
            exit 1
          fi

          if [ ! -f "./app/build.gradle" ] &&
             [ ! -f "./app/build.gradle.kts" ]; then
            echo "::error::app Gradle file missing."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Android source structure: PASSED"

      # ==========================================================
      # 5. JAVA 17
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ env.SOURCE_DIR }}/**/*.gradle*
            ${{ env.SOURCE_DIR }}/gradle/wrapper/gradle-wrapper.properties

      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================================
      # 7. GENERATE UNIQUE VERSION
      # ==========================================================
      - name: Generate unique application version
        shell: bash
        run: |
          set -euo pipefail

          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"

          if [ "$RUN_NUMBER" -lt 1 ] ||
             [ "$RUN_ATTEMPT" -lt 1 ]; then
            echo "::error::Invalid GitHub run number or attempt."
            exit 1
          fi

          VERSION_CODE=$((29000000 + RUN_NUMBER * 100 + RUN_ATTEMPT))
          VERSION_NAME="2.9.${RUN_NUMBER}.${RUN_ATTEMPT}"

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated versionCode is too large."
            exit 1
          fi

          echo "BUILD_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "versionCode=$VERSION_CODE"
          echo "versionName=$VERSION_NAME"

      # ==========================================================
      # 8. APPLY GENERATED VERSION
      # ==========================================================
      - name: Apply generated version
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
            FILE_TYPE="groovy"
          elif [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
            FILE_TYPE="kotlin"
          else
            echo "::error::Application Gradle file not found."
            exit 1
          fi

          export BUILD_FILE
          export FILE_TYPE

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["BUILD_FILE"])
          file_type = os.environ["FILE_TYPE"]

          code = os.environ["BUILD_VERSION_CODE"]
          name = os.environ["BUILD_VERSION_NAME"]

          text = path.read_text(encoding="utf-8")

          if file_type == "groovy":
              code_pattern = (
                  r"(?m)^(\s*versionCode\s+)\d+(\s*)$"
              )

              name_pattern = (
                  r"(?m)^(\s*versionName\s+)"
                  r"[\"'][^\"']*[\"'](\s*)$"
              )

          else:
              code_pattern = (
                  r"(?m)^(\s*versionCode\s*=\s*)"
                  r"\d+(\s*)$"
              )

              name_pattern = (
                  r"(?m)^(\s*versionName\s*=\s*)"
                  r"[\"'][^\"']*[\"'](\s*)$"
              )

          new_text, code_count = re.subn(
              code_pattern,
              lambda m: (
                  f"{m.group(1)}"
                  f"{code}"
                  f"{m.group(2)}"
              ),
              text,
          )

          new_text, name_count = re.subn(
              name_pattern,
              lambda m: (
                  f'{m.group(1)}'
                  f'"{name}"'
                  f'{m.group(2)}'
              ),
              new_text,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  f"Expected exactly one versionCode and "
                  f"one versionName in {path}; "
                  f"found versionCode={code_count}, "
                  f"versionName={name_count}."
              )

          path.write_text(
              new_text,
              encoding="utf-8"
          )

          print(f"Updated {path}")
          PY

          echo "===== FINAL VERSION ====="

          grep -nE \
            'versionCode|versionName' \
            "$BUILD_FILE"

      # ==========================================================
      # 9. CLEAN
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 10. BUILD CURRENT SOURCE
      # ==========================================================
      - name: Build current APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 11. LOCATE EXACTLY ONE APK
      # ==========================================================
      - name: Locate exactly one APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find \
              "$SOURCE_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" |
            sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK; found ${#APKS[@]}."

            printf '%s\n' "${APKS[@]:-}"

            exit 1
          fi

          echo "APK_PATH=${APKS[0]}" >> "$GITHUB_ENV"

          echo "Generated APK:"
          echo "${APKS[0]}"

      # ==========================================================
      # 12. VERIFY APK IDENTITY
      # ==========================================================
      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          APKANALYZER="$(
            find "$ANDROID_HOME" \
              -type f \
              -name apkanalyzer \
              -print -quit
          )"

          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer was not found."
            exit 1
          fi

          PACKAGE="$(
            "$APKANALYZER" \
              manifest application-id \
              "$APK" |
            tail -1 |
            tr -d '\r'
          )"

          VERSION_OUTPUT="$(
            "$APKANALYZER" \
              manifest version \
              "$APK" |
            tr '\n' ' '
          )"

          echo "APK package : $PACKAGE"
          echo "APK version : $VERSION_OUTPUT"
          echo "Expected code: $BUILD_VERSION_CODE"
          echo "Expected name: $BUILD_VERSION_NAME"

          if [ "$PACKAGE" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "::error::Unexpected applicationId: $PACKAGE"
            exit 1
          fi

          if ! echo "$VERSION_OUTPUT" |
               grep -Fq "$BUILD_VERSION_CODE"; then
            echo "::error::APK versionCode does not match this build."
            exit 1
          fi

          if ! echo "$VERSION_OUTPUT" |
               grep -Fq "$BUILD_VERSION_NAME"; then
            echo "::error::APK versionName does not match this build."
            exit 1
          fi

          echo "APK identity verification: PASSED"

      # ==========================================================
      # 13. PREPARE VERIFIED RELEASE
      # ==========================================================
      - name: Prepare verified release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.apk"

          sha256sum \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.apk" \
            > \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.sha256"

          echo "===== VERIFIED RELEASE ====="

          ls -lh release

          cat \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.sha256"

      # ==========================================================
      # 14. UPLOAD VERIFIED APK
      # ==========================================================
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-${{ env.BUILD_VERSION_NAME }}-APK
          path: |
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.apk
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
