name: MY SHOP VERSIONED FINAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_DIR: current_source

jobs:
  build:
    name: MY SHOP - SINGLE VERIFIED VERSIONED RELEASE APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select highest V-number source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | while read -r f; do
            if [[ "$f" =~ (^|[^0-9])V[-_[:space:]]*([0-9]+)([^0-9]|$) ]]; then
              echo "${BASH_REMATCH[2]}|$f"
            fi
          done | sort -t'|' -k1,1n -k2,2)

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No versioned V-XX source ZIP found in repository root."
            exit 1
          fi

          MAX_VERSION="${candidates[${#candidates[@]}-1]%%|*}"
          mapfile -t latest < <(printf '%s\n' "${candidates[@]}" | awk -F'|' -v v="$MAX_VERSION" '$1 == v {print $2}')

          if [ "${#latest[@]}" -ne 1 ]; then
            echo "::error::Exactly ONE source ZIP is required for V-$MAX_VERSION; found ${#latest[@]}."
            printf '%s\n' "${latest[@]}"
            exit 1
          fi

          SOURCE_ZIP="${latest[0]}"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=$MAX_VERSION" >> "$GITHUB_ENV"
          echo "Selected authoritative source: $SOURCE_ZIP"

      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)gradlew$'
          unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'
          unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^|/)build\.gradle(\.kts)?$'
          echo "VERIFIED SOURCE: $SOURCE_ZIP"

      - name: Extract selected source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR" release
          mkdir -p "$SOURCE_DIR"
          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

      - name: Locate exactly one Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t settings_files < <(
            find "$SOURCE_DIR" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print | sort
          )
          if [ "${#settings_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE Android project; found ${#settings_files[@]}."
            printf '%s\n' "${settings_files[@]:-<none>}"
            exit 1
          fi
          ROOT="$(dirname "${settings_files[0]}")"
          test -f "$ROOT/gradlew"
          test -f "$ROOT/build.gradle" || test -f "$ROOT/build.gradle.kts"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "ANDROID PROJECT: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate unique version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$((VERSION_NUMBER * 10000 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="2.9.${VERSION_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MY SHOP V-$VERSION_NUMBER VERSION_NAME=$VERSION_NAME"
          echo "MY SHOP V-$VERSION_NUMBER VERSION_CODE=$VERSION_CODE"

      - name: Apply selected version
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          mapfile -t gradle_files < <(find "$ROOT" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort)
          python3 - "$VERSION_CODE" "$VERSION_NAME" "${gradle_files[@]}" <<'PY'
          import re, sys
          from pathlib import Path
          code, name = sys.argv[1], sys.argv[2]
          files = [Path(x) for x in sys.argv[3:]]
          code_re = re.compile(r'(\bversionCode\s*(?:=\s*)?)\d+')
          name_re = re.compile(r'(\bversionName\s*(?:=\s*)?)(["\'])(.*?)(\2)')
          changed_code = changed_name = False
          for p in files:
              text = p.read_text(encoding='utf-8')
              if 'com.android.application' not in text and 'applicationId' not in text:
                  continue
              new, n1 = code_re.subn(r'\g<1>'+code, text, count=1)
              new, n2 = name_re.subn(r'\g<1>\g<2>'+name+r'\g<4>', new, count=1)
              changed_code |= bool(n1)
              changed_name |= bool(n2)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          if not changed_code or not changed_name:
              raise SystemExit('ERROR: Could not update versionCode and versionName.')
          print(f'Applied versionName={name}, versionCode={code}')
          PY

      - name: Clean build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.project.outputs.root }}/app/build/outputs/apk" release

      - name: Build exactly one release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace

          mapfile -t apks < <(find "$GITHUB_WORKSPACE" -type f -path '*/build/outputs/apk/release/*.apk' -name '*.apk' -print 2>/dev/null | sort)
          echo "Release APK files found:"
          printf '%s\n' "${apks[@]:-<none>}"
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Exactly ONE release APK required; found ${#apks[@]}."
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print 2>/dev/null | sort || true
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify APK
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="${{ steps.apk.outputs.path }}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/my-shop-v${VERSION_NUMBER}-release.jks"
          ALIGNED="$RUNNER_TEMP/my-shop-v${VERSION_NUMBER}-aligned.apk"
          SIGNED="$RUNNER_TEMP/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.apk"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias "myshopv${VERSION_NUMBER}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MY SHOP V${VERSION_NUMBER}, OU=Release, O=MY SHOP, C=US" \
            >/dev/null 2>&1

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias "myshopv${VERSION_NUMBER}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose --min-sdk-version 23 "$SIGNED"
          BADGING="$("$BT/aapt2" dump badging "$SIGNED")"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "versionName='$VERSION_NAME'"
          echo "$BADGING" | grep -Fq "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -Fq "package: name='com.myshop.app'"

          echo "signed_path=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "V-$VERSION_NUMBER signature/version/applicationId verification PASSED"

      - name: Prepare ONE final APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp "${{ steps.signed.outputs.signed_path }}" "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.apk"
          sha256sum "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.apk" > "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.sha256"

          APK_COUNT="$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$APK_COUNT" -eq 1
          test -s "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.apk"

          echo "===== FINAL V-$VERSION_NUMBER RELEASE ====="
          ls -lh release
          cat "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.sha256"

      - name: Upload ONE final release
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V${{ env.VERSION_NUMBER }}-FINAL-RELEASE
          path: |
            release/MY_SHOP_V${{ env.VERSION_NUMBER }}_FINAL_RELEASE.apk
            release/MY_SHOP_V${{ env.VERSION_NUMBER }}_FINAL_RELEASE.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final success guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 1
          test -s "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.apk"
          test -s "release/MY_SHOP_V${VERSION_NUMBER}_FINAL_RELEASE.sha256"
          echo "MY SHOP V-$VERSION_NUMBER FINAL RELEASE: ONE VERIFIED APK READY"
