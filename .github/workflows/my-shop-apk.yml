name: MY SHOP AUTO BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: MY SHOP BUILD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest V ZIP
        shell: bash
        run: |
          set -e

          best=""
          bestver=-1

          for f in V-*.zip V_*.zip; do
            [ -f "$f" ] || continue

            if [[ "$f" =~ ^V[-_]([0-9]+)-.*\.zip$ ]]; then
              v=$((10#${BASH_REMATCH[1]}))

              if [ "$v" -gt "$bestver" ]; then
                bestver=$v
                best="$f"
              fi
            fi
          done

          [ -n "$best" ] || {
            echo "ERROR: No V-XX ZIP found."
            exit 1
          }

          echo "SOURCE_ZIP=$best" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$bestver" >> "$GITHUB_ENV"

          echo "Selected: $best"
          echo "Version: V-$bestver"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir source
          unzip -q "$SOURCE_ZIP" -d source

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1 | xargs -r dirname)

          [ -n "$PROJECT" ] || {
            echo "ERROR: Android project not found."
            exit 1
          }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Verify version
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT/app/build.gradle"

          [ -f "$GRADLE" ] || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          CODE=$(sed -n 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/p' "$GRADLE" | head -1)
          NAME=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" "$GRADLE" | head -1)

          echo "ZIP Version : V-$SOURCE_VERSION"
          echo "Code        : $CODE"
          echo "Name        : $NAME"

          [ "$CODE" = "$SOURCE_VERSION" ] || {
            echo "ERROR: ZIP version and versionCode do not match."
            exit 1
          }

          [ -n "$NAME" ] || {
            echo "ERROR: versionName not found."
            exit 1
          }

      - name: Prepare Android build
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT/app/build.gradle"

          if ! grep -q "buildFeatures" "$GRADLE"; then
            sed -i '0,/android[[:space:]]*{/s//android {\n    buildFeatures { buildConfig true }/' "$GRADLE"
          fi

          echo "BuildConfig enabled."

          grep -n "buildFeatures" "$GRADLE" || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          rm -rf app/build

          gradle clean :app:assembleDebug --no-daemon

          mapfile -t APKs < <(
            find app/build/outputs/apk \
            -type f -name "*.apk"
          )

          [ "${#APKs[@]}" -eq 1 ] || {
            echo "ERROR: Expected exactly ONE APK."
            printf '%s\n' "${APKs[@]}"
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK="V-${SOURCE_VERSION}-MY-SHOP.apk"

          cp "${APKs[0]}" \
            "$GITHUB_WORKSPACE/release/$APK"

          sha256sum \
            "$GITHUB_WORKSPACE/release/$APK" \
            > "$GITHUB_WORKSPACE/release/$APK.sha256"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V-${{ env.SOURCE_VERSION }}
          path: |
            release/${{ env.APK }}
            release/${{ env.APK }}.sha256
