name: MY SHOP - BUILD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: BUILD → RELEASE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find newest V-numbered source ZIP
        shell: bash
        run: |
          set -euo pipefail

          BEST_FILE=""
          BEST_VERSION=-1

          while IFS= read -r FILE; do
            NAME="$(basename "$FILE")"

            if [[ "$NAME" =~ ^V-([0-9]+)-.+\.zip$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              VERSION=$((10#$VERSION))

              if (( VERSION > BEST_VERSION )); then
                BEST_VERSION="$VERSION"
                BEST_FILE="$NAME"
              fi
            fi
          done < <(find . -maxdepth 1 -type f -name 'V-*.zip' | sort)

          if [ -z "$BEST_FILE" ]; then
            echo "ERROR: No V-*.zip file found in repository root."
            exit 1
          fi

          echo "SOURCE_ZIP=$BEST_FILE" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$BEST_VERSION" >> "$GITHUB_ENV"

          echo "Selected source:"
          echo "$BEST_FILE"
          echo "Version: V-$BEST_VERSION"

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Extracted:"
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find source -type f \
            -name 'settings.gradle' \
            -o \
            -name 'settings.gradle.kts' \
          -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in Android project."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix callback context safely
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "WARNING: UserMenuActivity.java not found."
            echo "Skipping callback-context correction."
            exit 0
          fi

          echo "Checking callback context..."

          sed -i \
            's/LanguageManager\.showPicker(this/LanguageManager.showPicker(UserMenuActivity.this/g'
