name: MY SHOP AUTO VERSION APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_ID: com.myshop.app
  BASE_VERSION_NAME: "2.9"

jobs:
  build:
    name: MY SHOP AUTO VERSION APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. AUTOMATIC VERSION
      # ============================================================
      - name: Generate automatic version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="${BASE_VERSION_NAME}.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "============================================"
          echo "MY SHOP AUTOMATIC VERSION"
          echo "============================================"
          echo "Version Code : $VERSION_CODE"
          echo "Version Name : $VERSION_NAME"
          echo "Run Number   : $GITHUB_RUN_NUMBER"
          echo "============================================"

      # ============================================================
      # 5. FIND LATEST MY SHOP SOURCE ZIP
      # ============================================================
      - name: Find latest MY SHOP source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for MY SHOP V-XX source ZIP..."

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \
                -iname "V-*.zip" \
                -o \
                -iname "V_*.zip" \
                -o \
                -iname "V*.zip" \
              \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              -printf '%p\n' |
            sort -V
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No MY SHOP source ZIP found."
            echo
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              -print | sort
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[${#ZIP_FILES[@]}-1]}"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Selected source ZIP does not exist:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo
          echo "Detected source ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          echo
          echo "============================================"
          echo "SELECTED SOURCE ZIP"
          echo "============================================"
          echo "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract MY SHOP source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Source extracted successfully."

          echo
          echo "Top-level extracted files:"
          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 7. LOCATE EXACTLY ONE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -print \
              | sort
          )

          echo "Android settings files found:"
          printf '%s\n' "${SETTINGS_FILES[@]}"

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly ONE settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "============================================"
          echo "ANDROID PROJECT"
          echo "============================================"
          echo "$PROJECT_DIR"

      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          # --------------------------------------------------------
          # Root Gradle
          # --------------------------------------------------------
          if [ -f build.gradle ]; then
            echo "Root build.gradle found."
          elif [ -f build.gradle.kts ]; then
            echo "Root build.gradle.kts found."
          else
            echo "ERROR: Root build.gradle(.kts) missing."
            exit 1
          fi

          # --------------------------------------------------------
          # App Gradle
          # --------------------------------------------------------
          if [ -f app/build.gradle ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Android Manifest
          # --------------------------------------------------------
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          # --------------------------------------------------------
          # MainActivity
          # --------------------------------------------------------
          MAIN_ACTIVITY="$(
            find app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"
          echo "MAIN_ACTIVITY=$PROJECT_DIR/$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo
          echo "============================================"
          echo "ANDROID PROJECT CHECK PASSED"
          echo "============================================"
          echo "Project : $PROJECT_DIR"
          echo "Gradle  : $BUILD_FILE"
          echo "Activity: $MAIN_ACTIVITY"

      # ============================================================
      # 9. APPLY VERSION + FIX APPLICATION ID SUFFIX
      # ============================================================
      - name: Apply automatic version and normalize package
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            "$BUILD_FILE" \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$APP_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          build_file = Path(sys.argv[1])
          version_code = sys.argv[2]
          version_name = sys.argv[3]
          app_id = sys.argv[4]

          text = build_file.read_text(encoding="utf-8")

          # ========================================================
          # REMOVE applicationIdSuffix
          # ========================================================
          # This is the exact problem from the failed build.
          #
          # Examples removed:
          # applicationIdSuffix ".debug"
          # applicationIdSuffix = ".debug"
          # applicationIdSuffix = someVariable
          #
          # The source ZIP itself is NOT changed.
          # Only the extracted build copy is changed.
          # ========================================================

          suffix_pattern = re.compile(
              r'(?m)^[ \t]*applicationIdSuffix\b.*\r?\n?'
          )

          text, suffix
