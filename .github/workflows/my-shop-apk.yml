name: MY SHOP STABLE PERMANENT D1 R2 RELEASE

on:
  push:
    branches: [main]
    paths:
      - 'V-*.zip'
      - '.github/workflows/my-shop-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev
  WORKER_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev

jobs:
  verify-deploy-build:
    name: VERIFY → WORKER → APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Master workflow safety guard
        shell: bash
        run: |
          set -euo pipefail

          F1="$(printf '%b' '\x67\x6f\x6f\x67\x6c\x65[[:space:]]*\x64\x72\x69\x76\x65')"
          F2="$(printf '%b' '\x62\x61\x63\x6b\x75\x70[[:space:]]+\x73\x6f\x75\x72\x63\x65[[:space:]]+\x7a\x69\x70')"
          F3="$(printf '%b' '\x65\x78\x74\x65\x72\x6e\x61\x6c-\x62\x61\x63\x6b\x75\x70')"
          F4="$(printf '%b' '\x47\x44\x52\x49\x56\x45_')"

          if grep -RniE "$F1|$F2|$F3|$F4" \
            .github/workflows \
            --include='*.yml' \
            --include='*.yaml'; then
            echo 'ERROR: Forbidden external backup logic exists in the repository. BUILD STOP.'
            exit 1
          fi

          test -f .github/workflows/my-shop-apk.yml
          ! grep -nE '^[[:space:]]*printf .*MYSHOP_HEALTH_PROBE_KEY.*wrangler.*secret[[:space:]]+put|^[[:space:]]*npx .*wrangler[^\n]*[[:space:]]+secret[[:space:]]+put' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow still contains deprecated wrangler secret put deployment logic. BUILD STOP'; exit 1; }
          grep -Fq 'versions upload' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing versions upload. BUILD STOP'; exit 1; }
          grep -Fq -- '--secrets-file' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing same-version secret deployment. BUILD STOP'; exit 1; }
          grep -Fq 'versions deploy' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing versions deploy. BUILD STOP'; exit 1; }
          grep -Fq 'WORKER_VERSION_ID' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing immutable Version-ID promotion. BUILD STOP'; exit 1; }
          echo 'MASTER WORKFLOW SAFETY GUARD PASSED'

      - name: Select newest V-numbered source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name 'V-*.zip' -printf '%f\n' | sort)
          test "${#ZIPS[@]}" -gt 0 || {
            echo 'ERROR: No root V-*.zip source package found.'
            exit 1
          }

          # Old V files are allowed to remain. Only the highest V is eligible.
          # If the highest V exists more than once, choose the most recently
          # committed/uploaded file; never fail merely because an older copy remains.
          BEST_VERSION=-1
          BEST_NAME=''
          BEST_TIME=-1

          for FILE in "${ZIPS[@]}"; do
            [[ "$FILE" =~ ^V-([0-9]+)-.+\.zip$ ]] || continue
            N=$((10#${BASH_REMATCH[1]}))
            T="$(git log -1 --format=%ct -- "$FILE" 2>/dev/null || true)"
            [[ "$T" =~ ^[0-9]+$ ]] || T=0

            if (( N > BEST_VERSION )) || \
               (( N == BEST_VERSION && T > BEST_TIME )) || \
               { (( N == BEST_VERSION && T == BEST_TIME )) && [[ "$FILE" > "$BEST_NAME" ]]; }; then
              BEST_VERSION="$N"
              BEST_NAME="$FILE"
              BEST_TIME="$T"
            fi
          done

          test "$BEST_VERSION" -ge 207 || {
            echo "ERROR: Highest source is V-$BEST_VERSION; V-207 or newer is required."
            exit 1
          }

          test -n "$BEST_NAME" || {
            echo 'ERROR: Could not select a V-numbered source ZIP.'
            exit 1
          }

          SOURCE_ZIP="$BEST_NAME"
          SOURCE_VERSION="$BEST_VERSION"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"
          echo "Selected current source: $SOURCE_ZIP (V-$SOURCE_VERSION, commit=$BEST_TIME)"

      - name: Extract exact source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source release
          mkdir -p source release
          unzip -q "$SOURCE_ZIP" -d source
          BUILD_ID_FILE="$(find source -type f -name SOURCE_BUILD_ID.txt -print -quit)"
          test -n "$BUILD_ID_FILE" || { echo 'ERROR: SOURCE_BUILD_ID.txt not found'; exit 1; }
          grep -Fqx "MY SHOP V-$SOURCE_VERSION" "$BUILD_ID_FILE"
          ROOT_SOURCE="$(dirname "$BUILD_ID_FILE")"
          test -f "$ROOT_SOURCE/app/build.gradle" || test -f "$ROOT_SOURCE/app/build.gradle.kts" || { echo 'ERROR: Source root has no app Gradle file'; exit 1; }
          test -f "$ROOT_SOURCE/backend/worker/src/index.js" || { echo 'ERROR: Source root has no Worker source'; exit 1; }
          APP_GRADLE="$(find "$ROOT_SOURCE/app" -maxdepth 1 -type f -name 'build.gradle*' -print -quit)"
          python3 - "$APP_GRADLE" "$SOURCE_VERSION" <<'PY'
          import re,sys
          p,ver=sys.argv[1],int(sys.argv[2]); s=open(p,encoding='utf-8').read()
          m=re.search(r'\bversionCode\s+(\d+)',s); assert m and int(m.group(1))==ver, 'ERROR: Source versionCode mismatch; BUILD STOP'
          m=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]",s); assert m and m.group(1)==f'2.9.{ver}', 'ERROR: Source versionName mismatch; BUILD STOP'
          PY
          echo "SOURCE_ROOT=$ROOT_SOURCE" >> "$GITHUB_ENV"

      - name: Validate selected source master workflow (NO AUTO-PUSH)
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE="$(find source -type f -path '*/.github/workflows/my-shop-apk.yml' -print -quit)"
          test -n "$CANDIDATE" || { echo 'ERROR: Source ZIP does not contain the master workflow. BUILD STOP'; exit 1; }

          F1="$(printf '%b' '\x67\x6f\x6f\x67\x6c\x65[[:space:]]*\x64\x72\x69\x76\x65')"
          F2="$(printf '%b' '\x62\x61\x63\x6b\x75\x70[[:space:]]+\x73\x6f\x75\x72\x63\x65[[:space:]]+\x7a\x69\x70')"
          F3="$(printf '%b' '\x65\x78\x74\x65\x72\x6e\x61\x6c-\x62\x61\x63\x6b\x75\x70')"
          F4="$(printf '%b' '\x47\x44\x52\x49\x56\x45_')"

          ! grep -niE "$F1|$F2|$F3|$F4" "$CANDIDATE" || { echo 'ERROR: Candidate workflow contains forbidden external backup logic. BUILD STOP'; exit 1; }
          grep -Fq 'Master workflow safety guard' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing the permanent master safety guard. BUILD STOP'; exit 1; }
          grep -Fq 'Select newest V-numbered source ZIP' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing source locking. BUILD STOP'; exit 1; }
          grep -Fq 'Run ACTIVE Worker content write suite (RELEASE BLOCKING)' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing the release-blocking Cloudflare write suite. BUILD STOP'; exit 1; }
          ! grep -nE '^[[:space:]]*printf .*MYSHOP_HEALTH_PROBE_KEY.*wrangler.*secret[[:space:]]+put|^[[:space:]]*npx .*wrangler[^\n]*[[:space:]]+secret[[:space:]]+put' "$CANDIDATE" || { echo 'ERROR: Candidate workflow contains deprecated wrangler secret put deployment logic. BUILD STOP'; exit 1; }
          grep -Fq 'versions upload' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing versions upload. BUILD STOP'; exit 1; }
          grep -Fq -- '--secrets-file' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing same-version secret deployment. BUILD STOP'; exit 1; }
          grep -Fq 'versions deploy' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing versions deploy. BUILD STOP'; exit 1; }
          grep -Fq 'WORKER_VERSION_ID' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing exact immutable Version-ID promotion. BUILD STOP'; exit 1; }
          grep -Fq 'EXACT UPLOADED WORKER VERSION ID:' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing immutable Worker version-ID promotion guard. BUILD STOP'; exit 1; }
          grep -Fq 'CLOUDFLARE ACTIVE DEPLOYMENT VERIFIED:' "$CANDIDATE" || { echo 'ERROR: Candidate workflow is missing active deployment verification. BUILD STOP'; exit 1; }
          ! grep -nE '^[[:space:]]*git[[:space:]]+(push|commit)[[:space:]].*workflow|^[[:space:]]*git[[:space:]]+push[[:space:]]+origin[[:space:]]+HEAD:main' "$CANDIDATE" || { echo 'ERROR: Candidate workflow attempts to self-push workflow files. BUILD STOP'; exit 1; }
          echo 'Selected source master workflow validated. No workflow self-push will be attempted.'

      - name: Locate Android + Worker project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find source -type f -name settings.gradle -o -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS" || { echo 'ERROR: Android settings file not found.'; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || test -f "$PROJECT/app/build.gradle.kts" || { echo 'ERROR: app Gradle file not found.'; exit 1; }
          test -f "$PROJECT/backend/worker/wrangler.toml" || { echo 'ERROR: Worker wrangler.toml not found.'; exit 1; }
          test -f "$PROJECT/backend/worker/src/index.js" || { echo 'ERROR: Worker source not found.'; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Lock app version, backend version, URL and permanent bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT/app/build.gradle" "$SOURCE_VERSION" "$MYSHOP_BACKEND_URL" <<'PY'
          import re,sys
          path,ver,url=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=open(path,encoding='utf-8').read()
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {ver}',s,count=1)
          s=re.sub(r'\bversionName\s+["\'][^"\']+["\']',f"versionName '2.9.{ver}'",s,count=1)
          s=re.sub(r'^[ \t]*buildConfigField\s+.*MYSHOP_BACKEND_URL.*\n?','',s,flags=re.M)
          m=re.search(r'\bdefaultConfig\s*\{',s); assert m,'defaultConfig not found'
          field=f"        buildConfigField 'String', 'MYSHOP_BACKEND_URL', '\"{url}\"'\n"
          s=s[:m.end()]+'\n'+field+s[m.end():]
          open(path,'w',encoding='utf-8').write(s)
          PY
          python3 - "$PROJECT/backend/worker/src/index.js" "$SOURCE_VERSION" <<'PY'
          import re,sys
          path,ver=sys.argv[1],int(sys.argv[2])
          s=open(path,encoding='utf-8').read()
          s,n=re.subn(r"version:'2\.9\.\d+',build:'V-\d+'",f"version:'2.9.{ver}',build:'V-{ver}'",s,count=1)
          assert n==1,'Worker /health version marker not found'
          open(path,'w',encoding='utf-8').write(s)
          PY
          TOML="$PROJECT/backend/worker/wrangler.toml"
          grep -Fq 'name = "rapid-bush-62ea"' "$TOML"
          grep -Fq 'database_name = "my-shop-db"' "$TOML"
          grep -Fq 'database_id = "15b6acd2-0e82-4bd8-95fb-bee6fc08936c"' "$TOML"
          grep -Fq 'binding = "MEDIA"' "$TOML"
          grep -Fq 'bucket_name = "my-shop-media"' "$TOML"
          grep -Fq '"/v1/feed"' "$PROJECT/backend/worker/src/index.js" || grep -Fq "'/v1/feed'" "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'avatar_object_key' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'PROFILE_UPDATE_FAILED' "$PROJECT/backend/worker/src/index.js"
          node --check "$PROJECT/backend/worker/src/index.js"
          BUILD_ID_FILE="$(find "$PROJECT" -type f -name SOURCE_BUILD_ID.txt -print -quit)"
          test -n "$BUILD_ID_FILE" || { echo 'ERROR: SOURCE_BUILD_ID.txt not found after source extraction'; exit 1; }
          grep -Fqx "MY SHOP V-$SOURCE_VERSION" "$BUILD_ID_FILE"
          echo "SOURCE_VERSION=$SOURCE_VERSION locked"
          echo "SOURCE BUILD LOCK PASSED: ZIP=$SOURCE_ZIP | SOURCE_BUILD_ID=V-$SOURCE_VERSION | Android=2.9.$SOURCE_VERSION | Worker=V-$SOURCE_VERSION"

      - name: Verify MY SHOP instruction safety before deploy
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'AdminSectionActivity' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'getBooleanExtra("admin_context",false)' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'putExtra("admin_context",true)' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'putExtra("admin_context",true)' "$PROJECT/app/src/main/java/com/myshop/app/AdminHubActivity.java"
          grep -Fq 'SOCIAL MEDIA' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SHARE APP' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'CUSTOMER SUPPORT' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SHARE APP' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'HELP & SUPPORT' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SOCIAL MEDIA' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'Search' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq '🌎' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          ! grep -Fq 'globe.setBackground(round(RED' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'openSupport' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'threeLineMenu' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'SAVE / EDIT' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'extTitle' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'normalizePlatformTarget' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'menu_language' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'R.drawable.nav_home' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_store' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_live' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_support' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_more' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'ACTION_GET_CONTENT' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'ensureSchemasOnce(env)' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'normalizeWhatsApp' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'renderMore' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'R2_VERIFY_FAILED' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'adminBannerUpload' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'notificationsList' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'notificationsReadAll' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'ensureNotificationSchema' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'createUserNotification' "$PROJECT/backend/worker/src/index.js"
