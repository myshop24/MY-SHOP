name: V-93 MY SHOP FINAL STABLE BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-v93-final
  cancel-in-progress: true

env:
  VERSION_NUMBER: "93"
  VERSION_NAME: "2.9.93"
  PACKAGE_NAME: "com.myshop.app"

  SOURCE_ZIP: "V-91_MY_SHOP_FULL_PROJECT_SOURCE.zip"
  SOURCE_DIR: "v93_source"
  RELEASE_DIR: "release"

jobs:

  build:

    name: V-93 - FINAL VERIFIED APK

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY ORIGINAL SOURCE
      # ============================================================

      - name: Verify original source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP"
          test -s "$SOURCE_ZIP"

          echo "SOURCE ZIP VERIFIED"
          ls -lh "$SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"


      # ============================================================
      # 3. EXTRACT COPY ONLY
      # ============================================================

      - name: Extract source copy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          rm -rf "$RELEASE_DIR"

          mkdir -p "$SOURCE_DIR"
          mkdir -p "$RELEASE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "SOURCE COPIED TO:"
          echo "$SOURCE_DIR"


      # ============================================================
      # 4. FIND EXACTLY ONE ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SETTINGS < <(
            find "$SOURCE_DIR" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "${#SETTINGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android project."
            printf '%s\n' "${SETTINGS[@]}"
            exit 1
          fi

          ROOT="$(dirname "${SETTINGS[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::App Gradle file not found."
            exit 1
          fi

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

          echo "ANDROID PROJECT:"
          echo "$ROOT"


      # ============================================================
      # 5. VERIFY PACKAGE
      # ============================================================

      - name: Verify package and launcher
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"
          MANIFEST="${{ steps.project.outputs.manifest }}"

          grep -Eq \
            "applicationId[[:space:]]*(=)?[[:space:]]*['\"]com\.myshop\.app['\"]" \
            "$APP_GRADLE"

          grep -Fq \
            "android.intent.action.MAIN" \
            "$MANIFEST"

          grep -Fq \
            "android.intent.category.LAUNCHER" \
            "$MANIFEST"

          echo "PACKAGE VERIFIED"
          echo "LAUNCHER VERIFIED"


      # ============================================================
      # 6. FIX KNOWN BAD DASHBOARD PNG
      # ============================================================

      - name: Fix dashboard reference image
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          BAD="app/src/main/res/drawable/myshop_dashboard_reference.png"
          GOOD="app/src/main/res/drawable/myshop_dashboard_header.png"

          if [ -f "$BAD" ] && [ -f "$GOOD" ]; then
            cp -f "$GOOD" "$BAD"
            echo "Dashboard reference image repaired."
          else
            echo "Dashboard image replacement not required."
          fi


      # ============================================================
      # 7. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"


      # ============================================================
      # 9. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 10. APPLY V-93 VERSION
      # ============================================================

      - name: Apply V-93 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          code_pattern = r'(\bversionCode\s*(?:=|\s+)?)\d+'
          name_pattern = r'(\bversionName\s*(?:=|\s+)?)[\'"][^\'"]*[\'"]'

          text, c1 = re.subn(
              code_pattern,
              r'\g<1>93',
              text,
              count=1
          )

          text, c2 = re.subn(
              name_pattern,
              r'\g<1>"2.9.93"',
              text,
              count=1
          )

          if c1 != 1:
              raise SystemExit(
                  "ERROR: versionCode was not updated."
              )

          if c2 != 1:
              raise SystemExit(
                  "ERROR: versionName was not updated."
              )

          path.write_text(text, encoding="utf-8")

          print("VERSION CODE: 93")
          print("VERSION NAME: 2.9.93")
          PY


      # ============================================================
      # 11. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app/build

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              :app:assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          else

            gradle \
              clean \
              :app:assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

          fi

          mapfile -d '' APKS < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print0
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE release APK."

            printf '%s\n' "${APKS[@]}"

            exit 1
          fi

          echo "APK FOUND:"
          echo "${APKS[0]}"

          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. REQUIRE PERMANENT SIGNING KEY
      # ============================================================

      - name: Require permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MY_SHOP_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::MY_SHOP_RELEASE_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::MY_SHOP_RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::MY_SHOP_RELEASE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::MY_SHOP_RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/myshop-release.jks"

          test -s "$RUNNER_TEMP/myshop-release.jks"

          echo "PERMANENT SIGNING KEY READY"


      # ============================================================
      # 13. SIGN APK
      # ============================================================

      - name: Sign V-93 APK
        id: signed
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          UNSIGNED="${{ steps.apk.outputs.path }}"

          ALIGNED="$RUNNER_TEMP/V-93_ALIGNED.apk"
          SIGNED="$RUNNER_TEMP/V-93_MY_SHOP_FINAL.apk"

          "$BT/zipalign" \
            -f \
            -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/myshop-release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify \
            --verbose \
            "$SIGNED"

          test -s "$SIGNED"

          echo "signed_path=$SIGNED" >> "$GITHUB_OUTPUT"

          echo "SIGNED APK READY"


      # ============================================================
      # 14. VERIFY APK IDENTITY
      # ============================================================

      - name: Verify final APK identity
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          APK="${{ steps.signed.outputs.signed_path }}"

          BADGING="$("$BT/aapt2" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq "package: name='com.myshop.app'"

          echo "$BADGING" \
            | grep -Fq "versionName='2.9.93'"

          echo "$BADGING" \
            | grep -Fq "versionCode='93'"

          echo "FINAL APK IDENTITY VERIFIED"


      # ============================================================
      # 15. PREPARE FINAL APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          FINAL="$GITHUB_WORKSPACE/$RELEASE_DIR/V-93_MY_SHOP_FINAL_APK.apk"
          SHA="$GITHUB_WORKSPACE/$RELEASE_DIR/V-93_MY_SHOP_FINAL_APK.sha256"

          rm -f "$RELEASE_DIR"/*.apk
          rm -f "$RELEASE_DIR"/*.sha256

          cp \
            "${{ steps.signed.outputs.signed_path }}" \
            "$FINAL"

          sha256sum "$FINAL" > "$SHA"

          test -s "$FINAL"
          test -s "$SHA"

          COUNT="$(
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly ONE final APK."
            exit 1
          fi

          echo "FINAL APK:"
          ls -lh "$FINAL"

          echo "SHA256:"
          cat "$SHA"


      # ============================================================
      # 16. UPLOAD FINAL APK
      # ============================================================

      - name: Upload V-93 final APK
        uses: actions/upload-artifact@v4
        with:
          name: V-93_MY_SHOP_FINAL_APK
          path: |
            release/V-93_MY_SHOP_FINAL_APK.apk
            release/V-93_MY_SHOP_FINAL_APK.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 17. FINAL GUARD
      # ============================================================

      - name: Final V-93 guard
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release/V-93_MY_SHOP_FINAL_APK.apk"
          SHA="$GITHUB_WORKSPACE/release/V-93_MY_SHOP_FINAL_APK.sha256"

          test -s "$APK"
          test -s "$SHA"

          COUNT="$(
            find "$GITHUB_WORKSPACE/release" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d ' '
          )"

          test "$COUNT" -eq 1

          echo "========================================"
          echo "V-93 SUCCESS"
          echo "========================================"
          echo "Version Name: 2.9.93"
          echo "Version Code: 93"
          echo "Package: com.myshop.app"
          echo "APK COUNT: 1"
          echo "APK: V-93_MY_SHOP_FINAL_APK.apk"
          echo "========================================"
