name: MY SHOP V-19 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP V-19 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      # ============================================================
      # 5. FIND V-19 ZIP
      # ============================================================
      - name: Find V-19 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="V-19 MY SHOP.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "V-19 ZIP found:"
          ls -lh "$ZIP_FILE"

      # ============================================================
      # 6. EXTRACT V-19
      # ============================================================
      - name: Extract V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "V-19 MY SHOP.zip" \
            -d "$GITHUB_WORKSPACE/source"

          echo "V-19 source extracted."

      # ============================================================
      # 7. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 8 \
              -type f \
              -print | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 8. VERIFY PROJECT
      # ============================================================
      - name: Verify V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] &&
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo "V-19 Android project structure OK."

      # ============================================================
      # 9. CREATE KOTLIN DUPLICATE-CLASS FIX
      #
      # IMPORTANT:
      # The previous error was:
      #
      # kotlin.collections.jdk8.CollectionsJDK8Kt
      # kotlin.internal.JDK7PlatformImplementations
      # kotlin.internal.JDK8PlatformImplementations
      #
      # coming from different Kotlin stdlib versions.
      #
      # We remove the old jdk7/jdk8 split modules and force
      # Kotlin stdlib to ONE compatible version.
      # ============================================================
      - name: Create Kotlin dependency compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle" <<'EOF'
          allprojects {

              configurations.configureEach {

                  // Remove old split Kotlin JDK modules.
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {

                      // Keep all Kotlin stdlib components on one version.
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"

                      // Prevent accidental old versions.
                      eachDependency { details ->
                          if (details.requested.group ==
                              "org.jetbrains.kotlin") {

                              if (details.requested.name ==
                                  "kotlin-stdlib-jdk7" ||
                                  details.requested.name ==
                                  "kotlin-stdlib-jdk8") {

                                  details.useTarget(
                                      "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                                  )

                              } else if (
                                  details.requested.name ==
                                  "kotlin-stdlib" ||
                                  details.requested.name ==
                                  "kotlin-stdlib-common"
                              ) {

                                  details.useVersion("1.8.22")
                              }
                          }
                      }
                  }
              }
          }
          EOF

          echo "Kotlin compatibility fix created:"
          cat "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle"

      # ============================================================
      # 10. CREATE GRADLE PROPERTIES
      # ============================================================
      - name: Configure Gradle and AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            echo \
              "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
              >> gradle.properties
          fi

          echo "gradle.properties:"
          cat gradle.properties

      # ============================================================
      # 11. GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            echo "Gradle Wrapper not found."
            gradle --version
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 12. SHOW KOTLIN DEPENDENCIES
      #
      # This lets us catch old Kotlin versions BEFORE APK build.
      # ============================================================
      - name: Check Kotlin dependency graph
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_COMMAND" \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle" \
            > "$GITHUB_WORKSPACE/kotlin-dependencies.txt" || true

          echo "Kotlin dependency check completed."

          grep -E \
            "kotlin-stdlib|kotlin-stdlib-jdk7|kotlin-stdlib-jdk8" \
            "$GITHUB_WORKSPACE/kotlin-dependencies.txt" \
            | head -100 || true

      # ============================================================
      # 13. CLEAN EVERYTHING
      # ============================================================
      - name: Clean V-19 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies \
            --init-script "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle"

      # ============================================================
      # 14. CHECK DUPLICATE CLASSES BEFORE APK
      # ============================================================
      - name: Check Gradle duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking duplicate classes..."

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies \
            --stacktrace \
            --init-script "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle"

          echo
          echo "============================================"
          echo "DUPLICATE CLASS CHECK PASSED"
          echo "============================================"

      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP V-19 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo
          echo "============================================"
          echo "BUILDING MY SHOP V-19 APK"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --refresh-dependencies \
            --stacktrace \
            --init-script "$GITHUB_WORKSPACE/kotlin-duplicate-fix.gradle"

      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify V-19 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V-19 APK was not generated."

            echo
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk" \
            > "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.sha256"

          echo
          echo "============================================"
          echo "V-19 APK SUCCESSFULLY CREATED"
          echo "============================================"

          ls -lh "$GITHUB_WORKSPACE/release/"

      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload MY SHOP V-19 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-19-MY-SHOP-APK
          path: |
            release/V-19-MY-SHOP-debug.apk
            release/V-19-MY-SHOP-debug.sha256
          if-no-files-found: error
          retention-days: 30
