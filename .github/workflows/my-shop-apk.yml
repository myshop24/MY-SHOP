name: V-78 MY SHOP FINAL RELEASE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_SOURCE_ZIP: V-77_MY_SHOP_FULL_SOURCE.zip
  VERSION_NUMBER: "78"
  VERSION_NAME: "2.9.78"
  PACKAGE_NAME: com.myshop.app
  SOURCE_DIR: v78_source

jobs:
  build:
    name: V-78 - SINGLE VERIFIED APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require V-77 source only
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PRIMARY_SOURCE_ZIP" || {
            echo "::error::Missing source ZIP: $PRIMARY_SOURCE_ZIP"
            exit 1
          }

      - name: Extract V-77 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR" release
          mkdir -p "$SOURCE_DIR" release
          unzip -q "$PRIMARY_SOURCE_ZIP" -d "$SOURCE_DIR"

      - name: Locate exactly one Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t settings_files < <(
            find "$SOURCE_DIR" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" | sort
          )

          if [ "${#settings_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE Android project."
            echo "Found: ${#settings_files[@]}"
            printf '%s\n' "${settings_files[@]:-<none>}"
            exit 1
          fi

          ROOT="$(dirname "${settings_files[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::app Gradle file not found."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"

      - name: Remove invalid dashboard reference resource
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REFERENCE_FILE="app/src/main/res/drawable/myshop_dashboard_reference.png"

          if [ -f "$REFERENCE_FILE" ]; then
            rm -f "$REFERENCE_FILE"
          fi

          if [ -e "$REFERENCE_FILE" ]; then
            echo "::error::Dashboard reference resource could not be removed."
            exit 1
          fi

      - name: Fix AccountStore SHA-256 exception
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t ACCOUNT_FILES < <(
            find "$ROOT" -type f -name "AccountStore.java" -not -path '*/build/*' | sort
          )

          if [ "${#ACCOUNT_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE AccountStore.java"
            printf '%s\n' "${ACCOUNT_FILES[@]:-<none>}"
            exit 1
          fi

          ACCOUNT="${ACCOUNT_FILES[0]}"

          python3 - "$ACCOUNT" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = 'return "sha256:" + sha256(canonicalAnswer(answer));'
          new = (
              'try {\n'
              '              return "sha256:" + sha256(canonicalAnswer(answer));\n'
              '          } catch (java.security.NoSuchAlgorithmException e) {\n'
              '              throw new IllegalStateException("SHA-256 algorithm unavailable", e);\n'
              '          }'
          )

          count = s.count(old)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one AccountStore SHA-256 return statement; found {count}"
              )

          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print(f"FIXED: {p}")
          PY

          grep -n -A4 -B2 "SHA-256 algorithm unavailable" "$ACCOUNT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply V-78 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if path.name.endswith(".kts"):
              text = re.sub(r'versionCode\s*(?:=)?\s*\d+', 'versionCode = 78', text)
              text = re.sub(
                  r'versionName\s*(?:=)?\s*["\'][^"\']*["\']',
                  'versionName = "2.9.78"',
                  text
              )
          else:
              text = re.sub(r'versionCode\s*(?:=)?\s*\d+', 'versionCode 78', text)
              text = re.sub(
                  r'versionName\s*(?:=)?\s*["\'][^"\']*["\']',
                  'versionName "2.9.78"',
                  text
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify V-78 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          grep -n "versionCode" "$APP_GRADLE"
          grep -n "versionName" "$APP_GRADLE"

          grep -Eq 'versionCode[[:space:]]*(=)?[[:space:]]*78' "$APP_GRADLE"
          grep -Eq 'versionName[[:space:]]*(=)?[[:space:]]*"2\.9\.78"' "$APP_GRADLE"

          echo "V-78 VERSION CHECK PASSED"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean project
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Find exactly one APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APK_FILES < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" | sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE release APK."
            echo "Found: ${#APK_FILES[@]}"
            printf '%s\n' "${APK_FILES[@]:-<none>}"
            exit 1
          fi

          APK="${APK_FILES[0]}"
          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/MY_SHOP_V-78_FINAL.apk"

          echo "apk=$GITHUB_WORKSPACE/release/MY_SHOP_V-78_FINAL.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/MY_SHOP_V-78_FINAL.apk"
          test -s "$APK"

          APK_COUNT="$(
            find release -maxdepth 1 -type f -name "*.apk" | wc -l
          )"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Final APK count is $APK_COUNT. Expected exactly 1."
            exit 1
          fi

          echo "APK verification passed."
          ls -lh "$APK"

      - name: Upload V-78 final APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V-78-FINAL-APK
          path: |
            release/MY_SHOP_V-78_FINAL.apk
          if-no-files-found: error
          retention-days: 30

      - name: Final ONE APK guard
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find release -maxdepth 1 -type f -name "*.apk" | wc -l
          )"

          test "$COUNT" -eq 1
          test -s "release/MY_SHOP_V-78_FINAL.apk"

          echo "FINAL V-78 CHECK PASSED"
          echo "Exactly ONE APK exists."
