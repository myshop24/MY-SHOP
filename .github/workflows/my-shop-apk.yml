name: MY SHOP V-20 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  V20_ZIP: V-20_MY_SHOP_RUNTIME_FIXED_SOURCE.zip

jobs:
  build:
    name: MY SHOP V-20 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. VERIFY EXACT V-20 SOURCE ZIP
      # ============================================================
      - name: Verify exact V-20 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected:"
          echo "$V20_ZIP"

          if [ ! -f "$V20_ZIP" ]; then
            echo "ERROR: Exact V-20 ZIP not found."
            echo
            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name "*.zip" \
              -print | sort
            exit 1
          fi

          echo "V-20 ZIP FOUND:"
          ls -lh "$V20_ZIP"

      # ============================================================
      # 5. EXTRACT V-20
      # ============================================================
      - name: Extract V-20 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$V20_ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "V-20 source extracted."

      # ============================================================
      # 6. LOCATE EXACTLY ONE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 7. PROJECT STRUCTURE CHECK
      # ============================================================
      - name: Verify V-20 Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          MAIN_ACTIVITY="$(
            find app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY=$PROJECT_DIR/$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo "PROJECT STRUCTURE CHECK PASSED."

      # ============================================================
      # 8. VERSION + PACKAGE CHECK
      # ============================================================
      - name: Verify V-20 version and package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f app/build.gradle ]; then
            BUILD_FILE="app/build.gradle"
          else
            BUILD_FILE="app/build.gradle.kts"
          fi

          grep -Eq 'versionCode[[:space:]]+(=[[:space:]]*)?20([[:space:]]|$)' "$BUILD_FILE"
          grep -Eq 'versionName[[:space:]]+(=[[:space:]]*)?["'\'']2\.9\.0["'\'']' "$BUILD_FILE"
          grep -Eq 'applicationId[[:space:]]+["'\'']com\.myshop\.app["'\'']' "$BUILD_FILE"

          if grep -q 'applicationIdSuffix' "$BUILD_FILE"; then
            echo "ERROR: applicationIdSuffix must not be present."
            exit 1
          fi

          echo "V-20 VERSION/PACKAGE CHECK PASSED."

      # ============================================================
      # 9. KNOWN SEARCHBOX FIX CHECK
      # ============================================================
      - name: Verify MainActivity searchBox fix
        shell: bash
        run: |
          set -euo pipefail

          test -s "$MAIN_ACTIVITY"

          grep -q \
            'searchBox[[:space:]]*=[[:space:]]*findViewById(R.id.searchBox)' \
            "$MAIN_ACTIVITY"

          grep -q \
            'searchBox.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"

          if grep -q \
            'findViewById(R.id.searchBox).setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then
            echo "ERROR: unsafe searchBox listener still exists."
            exit 1
          fi

          echo "SEARCHBOX FIX CHECK PASSED."

      # ============================================================
      # 10. V-20 VALIDATOR
      # ============================================================
      - name: Run V-20 validator
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f tools/validate_v20.py ]; then
            python3 tools/validate_v20.py
          else
            echo "ERROR: tools/validate_v20.py is missing."
            exit 1
          fi

          echo "V-20 VALIDATOR PASSED."

      # ============================================================
      # 11. GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      # ============================================================
      # 12. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --version
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            gradle --version
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 13. CLEAN
      # ============================================================
      - name: Clean V-20 project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf .gradle build app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      # ============================================================
      # 14. DUPLICATE CLASS CHECK
      # ============================================================
      - name: Check duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "DUPLICATE CLASS CHECK PASSED."

      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP V-20 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "BUILDING MY SHOP V-20 APK"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

          echo "GRADLE BUILD PASSED."

      # ============================================================
      # 16. VERIFY APK FILE + VERSION + PACKAGE
      # ============================================================
      - name: Verify V-20 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V-20 APK was not generated."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK_FILE"

          # aapt2 is installed by the Android Build Tools package but is
          # not guaranteed to be on PATH. Resolve the exact installed binary.
          BUILD_TOOLS_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found at:"
            echo "$AAPT2"
            echo
            echo "Installed build-tools:"
            ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" || true
            exit 1
          fi

          echo "Using aapt2:"
          "$AAPT2" version

          BADGING="$("$AAPT2" dump badging "$APK_FILE")"

          echo "$BADGING" | grep -q \
            "package: name='com.myshop.app' versionCode='20' versionName='2.9.0'"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.apk" \
            > "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.sha256"

          unzip -t \
            "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.apk" \
            >/dev/null

          test -s "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.apk"
          test -s "$GITHUB_WORKSPACE/release/V-20-MY-SHOP-debug.sha256"

          echo "V-20 APK VERSION/PACKAGE CHECK PASSED."
          echo "V-20 APK VERIFIED SUCCESSFULLY."

      # ============================================================
      # 17. UPLOAD FINAL APK
      # ============================================================
      - name: Upload MY SHOP V-20 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-20-MY-SHOP-APK
          path: |
            release/V-20-MY-SHOP-debug.apk
            release/V-20-MY-SHOP-debug.sha256
          if-no-files-found: error
          retention-days: 30
