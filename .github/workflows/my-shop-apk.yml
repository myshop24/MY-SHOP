name: MY SHOP AUTO APK BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-auto-build
  cancel-in-progress: false

jobs:
  build:
    name: MY SHOP AUTO ANDROID APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find latest V-XX source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR MY SHOP SOURCE"
          echo "========================================"

          mapfile -d '' FILES < <(
            find . -type f \
              \( -iname "V-*.zip" -o -iname "V_*.zip" \) \
              -not -path "./.git/*" \
              -print0
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No V-XX project ZIP found."
            echo "Upload one full MY SHOP project ZIP."
            exit 1
          fi

          echo "ZIP FILES FOUND:"
          printf '%s\n' "${FILES[@]}"

          BEST=""
          BEST_NUM=-1

          for FILE in "${FILES[@]}"; do
            BASE="$(basename "$FILE")"

            if [[ "$BASE" =~ [Vv]-([0-9]+) ]]; then
              NUM="${BASH_REMATCH[1]}"

              if (( NUM > BEST_NUM )); then
                BEST_NUM="$NUM"
                BEST="$FILE"
              fi
            elif [[ "$BASE" =~ [Vv]_([0-9]+) ]]; then
              NUM="${BASH_REMATCH[1]}"

              if (( NUM > BEST_NUM )); then
                BEST_NUM="$NUM"
                BEST="$FILE"
              fi
            fi
          done

          if [ -z "$BEST" ]; then
            echo "::error::Could not detect V-XX version."
            exit 1
          fi

          VERSION_NUMBER="$BEST_NUM"
          VERSION_NAME="2.9.${VERSION_NUMBER}"

          echo "========================================"
          echo "LATEST SOURCE SELECTED"
          echo "========================================"
          echo "SOURCE: $BEST"
          echo "VERSION: V-$VERSION_NUMBER"
          echo "VERSION NAME: $VERSION_NAME"

          echo "source_zip=$BEST" >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "SOURCE SHA256:"
          sha256sum "$BEST"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.source.outputs.source_zip }}" -d project

          echo "========================================"
          echo "PROJECT EXTRACTED"
          echo "========================================"

          find project -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -not -path "*/build/*" \
            | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SETTINGS < <(
            find project -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "${#SETTINGS[@]}" -eq 0 ]; then
            echo "::error::No Android Gradle project found."
            exit 1
          fi

          if [ "${#SETTINGS[@]}" -gt 1 ]; then
            echo "::error::Multiple Android projects found."
            printf '%s\n' "${SETTINGS[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS[0]}"
          ROOT="$(dirname "$SETTINGS_FILE")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

          echo "ANDROID ROOT: $ROOT"
          echo "APP GRADLE: $APP_GRADLE"
          echo "MANIFEST: $MANIFEST"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app/build

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              clean \
              :app:assembleDebug \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          else
            gradle \
              clean \
              :app:assembleDebug \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          fi

          mapfile -d '' APKS < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print0
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK="${APKS[0]}"

          VERSION="${{ steps.source.outputs.version_number }}"

          FINAL_APK="$GITHUB_WORKSPACE/release/V-${VERSION}_MY_SHOP_DEBUG.apk"

          cp -f "$APK" "$FINAL_APK"

          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

          echo "FINAL APK:"
          echo "$FINAL_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk_path }}"

          if [ ! -f "$APK" ]; then
            echo "::error::APK does not exist."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty."
            exit 1
          fi

          echo "APK VERIFIED"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Create complete reproducible backup
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.source.outputs.version_number }}"

          mkdir -p backup_bundle

          cp -f "${{ steps.source.outputs.source_zip }}" \
            backup_bundle/

          if [ -f ".github/workflows/my-shop-apk.yml" ]; then
            mkdir -p backup_bundle/.github/workflows

            cp -f ".github/workflows/my-shop-apk.yml" \
              backup_bundle/.github/workflows/my-shop-apk.yml
          fi

          cat > backup_bundle/BUILD-INFO.txt <<EOF
          MY SHOP COMPLETE BUILD BACKUP

          Version: V-${VERSION}
          Version Name: ${{ steps.source.outputs.version_name }}

          This backup contains:
          1. Complete source ZIP
          2. Exact GitHub Actions YML
          3. Build information

          IMPORTANT:
          The source and YML must be kept together.
          Do not delete older stable versions.
          EOF

          cd backup_bundle

          zip -qr \
            "../V-${VERSION}_MY_SHOP_COMPLETE_BACKUP.zip" \
            .

          cd ..

          echo "COMPLETE BACKUP CREATED:"
          ls -lh "V-${VERSION}_MY_SHOP_COMPLETE_BACKUP.zip"

          echo "BACKUP SHA256:"
          sha256sum "V-${VERSION}_MY_SHOP_COMPLETE_BACKUP.zip"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-${{ steps.source.outputs.version_number }}-MY-SHOP-APK
          path: release/V-${{ steps.source.outputs.version_number }}_MY_SHOP_DEBUG.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Complete Project Backup
        uses: actions/upload-artifact@v4
        with:
          name: V-${{ steps.source.outputs.version_number }}-MY-SHOP-COMPLETE-BACKUP
          path: V-${{ steps.source.outputs.version_number }}_MY_SHOP_COMPLETE_BACKUP.zip
          if-no-files-found: error
          retention-days: 30

      - name: Final report
        shell: bash
        run: |
          echo "=========================================="
          echo "MY SHOP BUILD SUCCESS"
          echo "=========================================="
          echo "Version: V-${{ steps.source.outputs.version_number }}"
          echo "APK: V-${{ steps.source.outputs.version_number }}_MY_SHOP_DEBUG.apk"
          echo "Complete Backup:"
          echo "V-${{ steps.source.outputs.version_number }}_MY_SHOP_COMPLETE_BACKUP.zip"
          echo "=========================================="
