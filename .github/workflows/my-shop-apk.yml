name: MY SHOP V-58 APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_DIR: v57_source

jobs:
  build:
    name: MY SHOP V-58 VERIFIED APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND CORRECT V57 SOURCE
      # ============================================================
      - name: Locate V57 Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "===== V57 SOURCE ZIP SEARCH ====="

          mapfile -t candidates < <(
            find . -maxdepth 1 -type f \
              \( -iname 'V-57*MY_SHOP*.zip' -o -iname 'V57*MY_SHOP*.zip' \) \
              -print | sort
          )

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "ERROR: No V57 MY SHOP ZIP found."
            exit 1
          fi

          echo "Found V57 ZIP files:"
          printf '%s\n' "${candidates[@]}"

          echo ""
          echo "===== VALIDATING ZIP FILES ====="

          root_valid=()
          corrected_valid=()
          other_valid=()

          for zip in "${candidates[@]}"; do

            echo ""
            echo "Checking:"
            echo "$zip"

            has_gradlew=0
            has_settings=0
            has_build=0

            if unzip -Z1 "$zip" | grep -Eq '(^|/)gradlew$'; then
              has_gradlew=1
            fi

            if unzip -Z1 "$zip" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              has_settings=1
            fi

            if unzip -Z1 "$zip" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
              has_build=1
            fi

            echo "gradlew  : $has_gradlew"
            echo "settings : $has_settings"
            echo "build    : $has_build"

            if [ "$has_gradlew" -eq 1 ] &&
               [ "$has_settings" -eq 1 ] &&
               [ "$has_build" -eq 1 ]; then

              echo "VALID ANDROID SOURCE"

              filename="$(basename "$zip")"

              if [[ "$filename" == *CORRECTED_SOURCE_ROOT* ]]; then
                root_valid+=("$zip")

              elif [[ "$filename" == *CORRECTED_SOURCE* ]]; then
                corrected_valid+=("$zip")

              else
                other_valid+=("$zip")
              fi

            else
              echo "IGNORED: incomplete Android project"
            fi

          done


          # ========================================================
          # PRIORITY:
          # 1. CORRECTED_SOURCE_ROOT
          # 2. CORRECTED_SOURCE
          # 3. Other valid V57 source
          # ========================================================

          selected=""

          if [ "${#root_valid[@]}" -eq 1 ]; then
            selected="${root_valid[0]}"

          elif [ "${#root_valid[@]}" -gt 1 ]; then
            echo ""
            echo "ERROR: More than one CORRECTED_SOURCE_ROOT ZIP is valid."
            printf '%s\n' "${root_valid[@]}"
            exit 1

          elif [ "${#corrected_valid[@]}" -eq 1 ]; then
            selected="${corrected_valid[0]}"

          elif [ "${#corrected_valid[@]}" -gt 1 ]; then
            echo ""
            echo "ERROR: More than one CORRECTED_SOURCE ZIP is valid."
            printf '%s\n' "${corrected_valid[@]}"
            exit 1

          elif [ "${#other_valid[@]}" -eq 1 ]; then
            selected="${other_valid[0]}"

          elif [ "${#other_valid[@]}" -gt 1 ]; then
            echo ""
            echo "ERROR: More than one other valid V57 source ZIP exists."
            printf '%s\n' "${other_valid[@]}"
            exit 1
          fi


          if [ -z "$selected" ]; then
            echo ""
            echo "ERROR: No valid V57 Android source ZIP found."
            echo ""
            echo "A valid source must contain:"
            echo "  gradlew"
            echo "  settings.gradle or settings.gradle.kts"
            echo "  build.gradle or build.gradle.kts"
            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "SELECTED V57 SOURCE"
          echo "$selected"
          echo "=========================================="

          echo "chosen=$selected" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================
      - name: Extract selected V57 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "${{ steps.source.outputs.chosen }}" \
            -d "$SOURCE_DIR"

          echo "V57 source extracted successfully."


      # ============================================================
      # 4. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          project_root=""

          if [ -f "$SOURCE_DIR/gradlew" ]; then
            project_root="$SOURCE_DIR"

          else

            while IFS= read -r gradlew; do

              candidate="$(dirname "$gradlew")"

              if [ -f "$candidate/settings.gradle" ] ||
                 [ -f "$candidate/settings.gradle.kts" ]; then

                project_root="$candidate"
                break

              fi

            done < <(
              find "$SOURCE_DIR" \
                -type f \
                -name "gradlew" \
                -print
            )

          fi


          if [ -z "$project_root" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi


          echo "Android project root:"
          echo "$project_root"

          echo "root=$project_root" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. VERIFY ANDROID SOURCE
      # ============================================================
      - name: Verify Android source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          test -f gradlew

          if [ -f settings.gradle ]; then
            echo "settings.gradle found"
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts found"
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi


          if [ -f build.gradle ]; then
            echo "build.gradle found"
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts found"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi


          chmod +x gradlew

          echo ""
          echo "===== GRADLE VERSION ====="

          ./gradlew --version


      # ============================================================
      # 6. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 8. GENERATE NEW VERSION
      # ============================================================
      - name: Generate unique build version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="5.8.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "MY SHOP BUILD VERSION"
          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"
          echo "=========================================="


      # ============================================================
      # 9. APPLY VERSION
      # ============================================================
      - name: Apply generated app version
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t gradle_files < <(
            find "$ROOT" -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
          )

          if [ "${#gradle_files[@]}" -eq 0 ]; then
            echo "ERROR: No Gradle build file found."
            exit 1
          fi


          python3 - "$VERSION_CODE" "$VERSION_NAME" "${gradle_files[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version_code = sys.argv[1]
          version_name = sys.argv[2]

          files = [
              Path(value)
              for value in sys.argv[3:]
          ]

          code_pattern = re.compile(
              r'(\bversionCode\s*(?:=\s*)?)(\d+)'
          )

          name_pattern = re.compile(
              r'(\bversionName\s*(?:=\s*)?)(["\'])(.*?)(\2)'
          )

          patched_code = False
          patched_name = False

          for path in files:

              text = path.read_text(
                  encoding="utf-8"
              )

              if (
                  "com.android.application" not in text
                  and "applicationId" not in text
              ):
                  continue

              new_text = text

              new_text, code_count = code_pattern.subn(
                  lambda match:
                  match.group(1) + version_code,
                  new_text,
                  count=1
              )

              new_text, name_count = name_pattern.subn(
                  lambda match:
                  match.group(1)
                  + match.group(2)
                  + version_name
                  + match.group(4),
                  new_text,
                  count=1
              )

              if code_count:
                  patched_code = True

              if name_count:
                  patched_name = True

              if new_text != text:
                  path.write_text(
                      new_text,
                      encoding="utf-8"
                  )


          if not patched_code:
              raise SystemExit(
                  "ERROR: versionCode could not be updated."
              )

          if not patched_name:
              raise SystemExit(
                  "ERROR: versionName could not be updated."
              )


          print(
              "Version successfully applied:"
          )

          print(
              "versionName =",
              version_name
          )

          print(
              "versionCode =",
              version_code
          )
          PY


      # ============================================================
      # 10. BUILD APK
      # ============================================================
      - name: Build MY SHOP V58 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          chmod +x gradlew

          ./gradlew clean assembleRelease --stacktrace


      # ============================================================
      # 11. LOCATE EXACTLY ONE APK
      # ============================================================
      - name: Locate exactly one APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(
            find "${{ steps.project.outputs.root }}" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -name "*.apk" \
              -print | sort
          )


          echo "===== APK FILES ====="

          printf '%s\n' "${apks[@]:-<none>}"


          if [ "${#apks[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Expected exactly ONE release APK."
            echo "Found: ${#apks[@]}"
            exit 1
          fi


          echo ""
          echo "Selected APK:"
          echo "${apks[0]}"


          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          test -s "$APK"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo ""
          echo "===== APK TYPE ====="
          file "$APK"

          echo ""
          echo "===== APK ZIP TEST ====="

          unzip -t "$APK" >/dev/null

          echo ""
          echo "APK verification PASSED."


      # ============================================================
      # 13. PREPARE VERIFIED RELEASE
      # ============================================================
      - name: Prepare verified release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release


          cp "${{ steps.apk.outputs.path }}" \
            "release/MY_SHOP_V58_${VERSION_NAME}.apk"


          cp "${{ steps.source.outputs.chosen }}" \
            "release/MY_SHOP_V57_SOURCE_BACKUP_USED_FOR_V58.zip"


          echo ""
          echo "===== RELEASE FILES ====="

          ls -lh release/


      # ============================================================
      # 14. UPLOAD VERIFIED APK
      # ============================================================
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V58-VERIFIED
          path: release/
          if-no-files-found: error


      # ============================================================
      # 15. COMPLETE
      # ============================================================
      - name: Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "MY SHOP V-58 BUILD COMPLETED"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "=========================================="
