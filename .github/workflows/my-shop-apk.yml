name: MY SHOP - Auto Version Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP APK - CURRENT SOURCE ONLY
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. CHECKOUT CURRENT REPOSITORY SOURCE
      # ==========================================================
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. HARD SOURCE CHECK
      #    This workflow NEVER extracts or builds an old ZIP.
      # ==========================================================
      - name: Verify Android project is at repository root
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

          if ! find . -maxdepth 1 -type f \\( -name "settings.gradle" -o -name "settings.gradle.kts" \\) | grep -q .; then
            echo "::error::No settings.gradle/settings.gradle.kts found at repository root."
            echo "::error::Upload the CURRENT MY SHOP Android SOURCE files to the repository root."
            exit 1
          fi

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing from repository root."
            exit 1
          fi

          if find . -maxdepth 1 -type f -iname "*.zip" | grep -q .; then
            echo "::error::ZIP files found in repository root."
            echo "::error::This workflow refuses to build from ZIP archives."
            echo "::error::Remove/archive old ZIP files outside the build source before running this workflow."
            exit 1
          fi

          chmod +x ./gradlew

      # ==========================================================
      # 3. JAVA
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ==========================================================
      # 5. CREATE A UNIQUE VERSION FOR THIS BUILD
      #
      #    versionCode uses the current Unix timestamp, so every
      #    separately started build gets a new numeric version.
      #    versionName is also generated automatically.
      # ==========================================================
      - name: Set unique application version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_VERSION_CODE="$(date -u +%s)"
          BUILD_VERSION_NAME="2.9.${BUILD_VERSION_CODE}"

          if [ "$BUILD_VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large."
            exit 1
          fi

          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=$BUILD_VERSION_NAME" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          code = os.environ["BUILD_VERSION_CODE"]
          name = os.environ["BUILD_VERSION_NAME"]

          candidates = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
          ]

          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("ERROR: app/build.gradle or app/build.gradle.kts not found.")

          text = build_file.read_text(encoding="utf-8")

          if build_file.suffix == ".gradle":
              new_text, n1 = re.subn(r'(?m)^(\\s*versionCode\\s+)\\d+\\s*$', rf'\\g<1>{code}', text)
              new_text, n2 = re.subn(r'(?m)^(\\s*versionName\\s+)[\'"][^\'"]*[\'"]\\s*$', rf'\\g<1>"{name}"', new_text)

              if n1 != 1 or n2 != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one Groovy versionCode/versionName. "
                      f"Found versionCode={n1}, versionName={n2}."
                  )
          else:
              new_text, n1 = re.subn(r'(?m)^(\\s*versionCode\\s*=\\s*)\\d+\\s*$', rf'\\g<1>{code}', text)
              new_text, n2 = re.subn(r'(?m)^(\\s*versionName\\s*=\\s*)[\'"][^\'"]*[\'"]\\s*$', rf'\\g<1>"{name}"', new_text)

              if n1 != 1 or n2 != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one Kotlin versionCode/versionName. "
                      f"Found versionCode={n1}, versionName={n2}."
                  )

          build_file.write_text(new_text, encoding="utf-8")
          print(f"Updated {build_file}")
          print(f"versionCode={code}")
          print(f"versionName={name}")
          PY

          echo "===== FINAL VERSION LINES ====="
          grep -nE "versionCode|versionName" app/build.gradle app/build.gradle.kts 2>/dev/null || true

      # ==========================================================
      # 6. SOURCE INTEGRITY CHECK
      # ==========================================================
      - name: Confirm old V-45 source is not being used
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn --exclude-dir=.git \
            -E "V-45_MY_SHOP|V-45.*SOURCE|SOURCE_ZIP|2\\.9\\.45" .; then
            echo "::error::Old V-45/2.9.45 build references were found."
            echo "::error::The current build must use repository source directly."
            exit 1
          fi

          echo "No V-45 source / SOURCE_ZIP / 2.9.45 reference found."

      # ==========================================================
      # 7. CLEAN
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      # ==========================================================
      # 8. BUILD CURRENT SOURCE
      # ==========================================================
      - name: Build current APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ==========================================================
      # 9. VERIFY APK VERSION + PACKAGE + FILE
      # ==========================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk -type f -name "*.apk" | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          echo "APK: $APK"

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -1)"
          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found."
            exit 1
          fi

          echo "===== APK VERSION ====="
          "$APKANALYZER" manifest version "$APK"

          echo "===== APK PACKAGE ====="
          "$APKANALYZER" manifest application-id "$APK"

          PACKAGE="$("$APKANALYZER" manifest application-id "$APK" | tail -1 | tr -d '\\r')"
          VERSION="$("$APKANALYZER" manifest version "$APK" | tr '\\n' ' ')"

          echo "APK_PACKAGE=$PACKAGE"
          echo "APK_VERSION=$VERSION"

          if [ "$PACKAGE" != "com.myshop.app" ]; then
            echo "::error::Unexpected applicationId: $PACKAGE"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Fq "$BUILD_VERSION_NAME"; then
            echo "::error::APK version does not match this build's generated version."
            echo "::error::Expected: $BUILD_VERSION_NAME"
            exit 1
          fi

          if echo "$VERSION" | grep -Fq "2.9.45"; then
            echo "::error::OLD 2.9.45 APK DETECTED. BUILD REJECTED."
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/MY-SHOP-${BUILD_VERSION_NAME}.apk"

          sha256sum "release/MY-SHOP-${BUILD_VERSION_NAME}.apk" | tee "release/MY-SHOP-${BUILD_VERSION_NAME}.sha256"

      # ==========================================================
      # 10. UPLOAD EXACTLY ONE APK + CHECKSUM
      # ==========================================================
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-${{ env.BUILD_VERSION_NAME }}-APK
          path: |
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.apk
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
