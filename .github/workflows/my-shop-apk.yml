name: MY SHOP V-58 VERIFIED APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_DIR: v57_source
  SOURCE_ZIP: V-57_MY_SHOP_CORRECTED_SOURCE_FIXED.zip

jobs:
  build:
    name: MY SHOP V-58 VERIFIED APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. SELECT EXACT FIXED V57 SOURCE
      #
      # IMPORTANT:
      # Other V57 ZIP files are ignored.
      # Only SOURCE_ZIP is allowed.
      # ============================================================
      - name: Locate exact V57 fixed source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MY SHOP V-58 SOURCE SELECTION"
          echo "=========================================="

          ZIP="./${SOURCE_ZIP}"

          echo "Required source:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: Required V57 FIXED source ZIP was not found."
            echo "Expected:"
            echo "$ZIP"
            echo ""
            echo "ZIP files currently found in repository root:"
            find . -maxdepth 1 -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo ""
          echo "===== ZIP INTEGRITY TEST ====="

          unzip -t "$ZIP" >/dev/null

          echo "ZIP integrity: PASSED"

          echo ""
          echo "===== ANDROID SOURCE CHECK ====="

          HAS_GRADLEW=0
          HAS_SETTINGS=0
          HAS_BUILD=0

          if unzip -Z1 "$ZIP" | grep -Eq '(^|/)gradlew$'; then
            HAS_GRADLEW=1
          fi

          if unzip -Z1 "$ZIP" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
            HAS_SETTINGS=1
          fi

          if unzip -Z1 "$ZIP" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
            HAS_BUILD=1
          fi

          echo "gradlew  : $HAS_GRADLEW"
          echo "settings : $HAS_SETTINGS"
          echo "build    : $HAS_BUILD"

          if [ "$HAS_GRADLEW" -ne 1 ]; then
            echo "ERROR: gradlew not found in selected ZIP."
            exit 1
          fi

          if [ "$HAS_SETTINGS" -ne 1 ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ "$HAS_BUILD" -ne 1 ]; then
            echo "ERROR: build.gradle/build.gradle.kts not found."
            exit 1
          fi

          echo ""
          echo "V57 FIXED SOURCE VALIDATION: PASSED"

          echo "chosen=$ZIP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================
      - name: Extract selected V57 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "${{ steps.source.outputs.chosen }}" \
            -d "$SOURCE_DIR"

          echo "Source extracted."

          echo ""
          echo "Top-level extracted directories:"
          find "$SOURCE_DIR" -maxdepth 2 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print


      # ============================================================
      # 4. LOCATE ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r GRADLEW; do

            CANDIDATE="$(dirname "$GRADLEW")"

            if [ -f "$CANDIDATE/settings.gradle" ] ||
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then

              if [ -f "$CANDIDATE/build.gradle" ] ||
                 [ -f "$CANDIDATE/build.gradle.kts" ]; then

                PROJECT_ROOT="$CANDIDATE"
                break

              fi
            fi

          done < <(
            find "$SOURCE_DIR" \
              -type f \
              -name "gradlew" \
              -print
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project root not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT ROOT"
          echo "$PROJECT_ROOT"
          echo "=========================================="

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. VERIFY ANDROID PROJECT STRUCTURE
      # ============================================================
      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          cd "$ROOT"

          echo "===== PROJECT STRUCTURE ====="

          test -f gradlew

          if [ -f settings.gradle ]; then
            echo "settings.gradle: FOUND"
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts: FOUND"
          else
            echo "ERROR: settings file missing."
            exit 1
          fi

          if [ -f build.gradle ]; then
            echo "build.gradle: FOUND"
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts: FOUND"
          else
            echo "ERROR: root build file missing."
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            echo "app/build.gradle: FOUND"
          elif [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts: FOUND"
          else
            echo "ERROR: app/build.gradle/app/build.gradle.kts missing."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "===== GRADLE VERSION ====="
          ./gradlew --version


      # ============================================================
      # 6. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 8. GENERATE UNIQUE V58 VERSION
      # ============================================================
      - name: Generate V58 application version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$((58000 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="2.9.58"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "MY SHOP V-58 VERSION"
          echo "=========================================="
          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"
          echo "=========================================="


      # ============================================================
      # 9. APPLY VERSION ONLY TO APP MODULE
      #
      # Existing V57 source:
      # versionCode 57
      # versionName '2.9.57'
      #
      # This changes ONLY the app version.
      # Dashboard/Login/features are not rewritten here.
      # ============================================================
      - name: Apply V58 app version
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          if [ -f "$ROOT/app/build.gradle" ]; then
            BUILD_FILE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            BUILD_FILE="$ROOT/app/build.gradle.kts"
          else
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Version file:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import re
          import sys
          from pathlib import Path

          build_file = Path(sys.argv[1])
          version_code = sys.argv[2]
          version_name = sys.argv[3]

          text = build_file.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Groovy build.gradle
          # --------------------------------------------------------
          if build_file.name == "build.gradle":

              code_pattern = re.compile(
                  r'(?m)^(\s*versionCode\s+)\d+\s*$'
              )

              name_pattern = re.compile(
                  r'(?m)^(\s*versionName\s+)[\'"][^\'"]*[\'"]\s*$'
              )

              new_text, code_count = code_pattern.subn(
                  lambda m: m.group(1) + version_code,
                  text,
                  count=1
              )

              new_text, name_count = name_pattern.subn(
                  lambda m: m.group(1) + "'" + version_name + "'",
                  new_text,
                  count=1
              )

          # --------------------------------------------------------
          # Kotlin build.gradle.kts
          # --------------------------------------------------------
          else:

              code_pattern = re.compile(
                  r'(?m)^(\s*versionCode\s*=\s*)\d+\s*$'
              )

              name_pattern = re.compile(
                  r'(?m)^(\s*versionName\s*=\s*)[\'"][^\'"]*[\'"]\s*$'
              )

              new_text, code_count = code_pattern.subn(
                  lambda m: m.group(1) + version_code,
                  text,
                  count=1
              )

              new_text, name_count = name_pattern.subn(
                  lambda m: m.group(1) + '"' + version_name + '"',
                  new_text,
                  count=1
              )

          if code_count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionCode. "
                  f"Found {code_count}."
              )

          if name_count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionName. "
                  f"Found {name_count}."
              )

          build_file.write_text(
              new_text,
              encoding="utf-8"
          )

          print("Version successfully updated.")
          print("versionCode =", version_code)
          print("versionName =", version_name)
          PY

          echo ""
          echo "===== FINAL VERSION ====="

          grep -nE \
            "versionCode|versionName" \
            "$BUILD_FILE"


      # ============================================================
      # 10. VERIFY SOURCE CONTENT
      # ============================================================
      - name: Verify V57 fixed source and AccountStore
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          ACCOUNT_STORE="$ROOT/app/src/main/java/com/myshop/app/AccountStore.java"

          if [ ! -f "$ACCOUNT_STORE" ]; then
            echo "ERROR: AccountStore.java not found."
            exit 1
          fi

          echo "AccountStore:"
          echo "$ACCOUNT_STORE"

          echo ""
          echo "===== SHA-256 SECTION ====="

          grep -n -A18 -B5 \
            "private static String sha256" \
            "$ACCOUNT_STORE"

          echo ""

          if ! grep -q \
            "catch (NoSuchAlgorithmException e)" \
            "$ACCOUNT_STORE"; then

            echo "ERROR: Expected NoSuchAlgorithmException handling not found."
            exit 1
          fi

          if ! grep -q \
            'MessageDigest.getInstance("SHA-256")' \
            "$ACCOUNT_STORE"; then

            echo "ERROR: SHA-256 implementation not found."
            exit 1
          fi

          echo ""
          echo "AccountStore exception handling: PASSED."


      # ============================================================
      # 11. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build MY SHOP V58 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. LOCATE EXACTLY ONE RELEASE APK
      # ============================================================
      - name: Locate exactly one release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          mapfile -t APKS < <(
            find "$ROOT" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -name "*.apk" \
              -print | sort
          )

          echo "===== RELEASE APK FILES ====="

          if [ "${#APKS[@]}" -gt 0 ]; then
            printf '%s\n' "${APKS[@]}"
          else
            echo "<none>"
          fi

          echo ""

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE release APK."
            echo "Found: ${#APKS[@]}"
            exit 1
          fi

          APK="${APKS[0]}"

          echo "Selected APK:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 14. VERIFY APK FILE
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          test -s "$APK"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo ""
          echo "===== APK TYPE ====="
          file "$APK"

          echo ""
          echo "===== APK ZIP TEST ====="

          unzip -t "$APK" >/dev/null

          echo ""
          echo "APK ZIP integrity: PASSED"


      # ============================================================
      # 15. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.path }}"

          APKANALYZER="$(
            find "$ANDROID_HOME" \
              -type f \
              -name "apkanalyzer" \
              -print | head -1
          )"

          if [ -z "$APKANALYZER" ]; then
            echo "ERROR: apkanalyzer not found."
            exit 1
          fi

          echo "===== APPLICATION ID ====="

          PACKAGE="$(
            "$APKANALYZER" \
              manifest application-id \
              "$APK" | tail -1 | tr -d '\r'
          )"

          echo "Application ID:"
          echo "$PACKAGE"

          if [ "$PACKAGE" != "com.myshop.app" ]; then
            echo "ERROR: Unexpected applicationId."
            exit 1
          fi

          echo ""
          echo "===== VERSION ====="

          VERSION_OUTPUT="$(
            "$APKANALYZER" \
              manifest version \
              "$APK"
          )"

          echo "$VERSION_OUTPUT"

          if ! echo "$VERSION_OUTPUT" | grep -Fq "$VERSION_NAME"; then
            echo "ERROR: APK versionName does not match V58."
            echo "Expected:"
            echo "$VERSION_NAME"
            exit 1
          fi

          if echo "$VERSION_OUTPUT" | grep -Fq "2.9.57"; then
            echo "ERROR: OLD V57 APK DETECTED."
            exit 1
          fi

          echo ""
          echo "APK package verification: PASSED"
          echo "APK V58 version verification: PASSED"


      # ============================================================
      # 16. PREPARE VERIFIED RELEASE
      # ============================================================
      - name: Prepare verified release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          APK="${{ steps.apk.outputs.path }}"

          FINAL_APK="release/MY_SHOP_V58_${VERSION_NAME}.apk"

          cp "$APK" "$FINAL_APK"

          sha256sum "$FINAL_APK" \
            > "${FINAL_APK}.sha256"

          cp "${{ steps.source.outputs.chosen }}" \
            "release/MY_SHOP_V57_FIXED_SOURCE_USED_FOR_V58.zip"

          echo ""
          echo "===== VERIFIED RELEASE ====="

          ls -lh release/


      # ============================================================
      # 17. UPLOAD VERIFIED RELEASE
      # ============================================================
      - name: Upload verified V58 release
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V58-VERIFIED
          path: release/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. COMPLETE
      # ============================================================
      - name: Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "MY SHOP V-58 BUILD COMPLETED"
          echo "=========================================="
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "Source       : ${SOURCE_ZIP}"
          echo "=========================================="
