name: MY SHOP AUTO VERSION APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_ID: com.myshop.app
  BASE_VERSION_NAME: "2.9"

jobs:
  build:
    name: MY SHOP AUTO VERSION APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. AUTOMATIC VERSION
      # ============================================================
      - name: Generate automatic version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="${BASE_VERSION_NAME}.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "============================================"
          echo "MY SHOP AUTOMATIC VERSION"
          echo "============================================"
          echo "Version Code : $VERSION_CODE"
          echo "Version Name : $VERSION_NAME"
          echo "Run Number   : $GITHUB_RUN_NUMBER"
          echo "============================================"

      # ============================================================
      # 5. FIND LATEST MY SHOP SOURCE ZIP
      # ============================================================
      - name: Find latest MY SHOP source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for MY SHOP V-XX source ZIP..."

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -iname "V-*.zip" \
                -o \
                -iname "V_*.zip" \
                -o \
                -iname "V*.zip" \
              \) \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              -printf '%p\n' |
            sort -V
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No MY SHOP source ZIP found."
            echo
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              -print | sort
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[${#ZIP_FILES[@]}-1]}"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Selected source ZIP does not exist:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo
          echo "Detected source ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          echo
          echo "============================================"
          echo "SELECTED SOURCE ZIP"
          echo "============================================"
          echo "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract MY SHOP source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Source extracted successfully."

      # ============================================================
      # 7. LOCATE EXACTLY ONE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print |
            sort
          )

          echo "Android settings files found:"
          printf '%s\n' "${SETTINGS_FILES[@]}"

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly ONE settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "============================================"
          echo "ANDROID PROJECT"
          echo "============================================"
          echo "$PROJECT_DIR"

      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f build.gradle ]; then
            echo "Root build.gradle found."
          elif [ -f build.gradle.kts ]; then
            echo "Root build.gradle.kts found."
          else
            echo "ERROR: Root build.gradle(.kts) missing."
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          MAIN_ACTIVITY="$(
            find app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"
          echo "MAIN_ACTIVITY=$PROJECT_DIR/$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo
          echo "============================================"
          echo "ANDROID PROJECT CHECK PASSED"
          echo "============================================"
          echo "Project : $PROJECT_DIR"
          echo "Gradle  : $BUILD_FILE"
          echo "Activity: $MAIN_ACTIVITY"

      # ============================================================
      # 9. APPLY AUTOMATIC VERSION
      # ============================================================
      - name: Apply automatic version
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$BUILD_FILE" \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$APP_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          build_file = Path(sys.argv[1])
          version_code = sys.argv[2]
          version_name = sys.argv[3]
          app_id = sys.argv[4]

          text = build_file.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Remove applicationIdSuffix from extracted build copy
          # --------------------------------------------------------
          text = re.sub(
              r'(?m)^[ \t]*applicationIdSuffix\b.*(?:\r?\n|$)',
              '',
              text
          )

          # --------------------------------------------------------
          # Update versionCode
          # --------------------------------------------------------
          text, code_count = re.subn(
              r'(?m)^(\s*versionCode\s*(?:=\s*)?)\d+(\s*)$',
              rf'\g<1>{version_code}\g<2>',
              text
          )

          if code_count == 0:
              raise SystemExit(
                  "ERROR: versionCode line was not found."
              )

          # --------------------------------------------------------
          # Update versionName
          # --------------------------------------------------------
          text, name_count = re.subn(
              r'(?m)^(\s*versionName\s*(?:=\s*)?)(["\']).*?\2(\s*)$',
              rf'\g<1>"{version_name}"\g<3>',
              text
          )

          if name_count == 0:
              raise SystemExit(
                  "ERROR: versionName line was not found."
              )

          # --------------------------------------------------------
          # Verify applicationId
          # --------------------------------------------------------
          app_id_pattern = re.compile(
              r'(?m)^(\s*applicationId\s*(?:=\s*)?)(["\'])'
              + re.escape(app_id)
              + r'\2(\s*)$'
          )

          if not app_id_pattern.search(text):
              raise SystemExit(
                  f"ERROR: applicationId {app_id} was not found."
              )

          build_file.write_text(text, encoding="utf-8")

          print("============================================")
          print("AUTOMATIC VERSION APPLIED")
          print("============================================")
          print(f"Version Code: {version_code}")
          print(f"Version Name: {version_name}")
          print(f"Application : {app_id}")
          print(f"Build File  : {build_file}")
          print("============================================")
          PY

          echo
          echo "VERSION / PACKAGE LINES:"
          grep -nE \
            'versionCode|versionName|applicationId|applicationIdSuffix' \
            "$BUILD_FILE" || true

      # ============================================================
      # 10. VERIFY PACKAGE AND VERSION CONFIGURATION
      # ============================================================
      - name: Verify package and version configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq \
            "applicationId[[:space:]]*(=)?[[:space:]]*[\"']${APP_ID}[\"']" \
            "$BUILD_FILE"

          grep -Eq \
            "versionCode[[:space:]]*(=)?[[:space:]]*${VERSION_CODE}([[:space:]]|$)" \
            "$BUILD_FILE"

          grep -Eq \
            "versionName[[:space:]]*(=)?[[:space:]]*[\"']${VERSION_NAME}[\"']" \
            "$BUILD_FILE"

          if grep -Eq \
            '^[[:space:]]*applicationIdSuffix[[:space:]]*=' \
            "$BUILD_FILE"; then
            echo "ERROR: applicationIdSuffix still exists."
            exit 1
          fi

          echo "PACKAGE AND VERSION CONFIGURATION PASSED."

      # ============================================================
      # 11. VERIFY SEARCHBOX FIX
      # ============================================================
      - name: Verify MainActivity searchBox fix
        shell: bash
        run: |
          set -euo pipefail

          test -s "$MAIN_ACTIVITY"

          if ! grep -Eq \
            'searchBox[[:space:]]*=[[:space:]]*findViewById\(R\.id\.searchBox\)' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: searchBox binding not found."
            exit 1
          fi

          if ! grep -Eq \
            'searchBox\.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Correct searchBox listener not found."
            exit 1
          fi

          if grep -Eq \
            'findViewById\(R\.id\.searchBox\)\.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Unsafe searchBox listener still exists."
            exit 1
          fi

          echo "SEARCHBOX FIX CHECK PASSED."

      # ============================================================
      # 12. OPTIONAL PROJECT VALIDATOR
      # ============================================================
      - name: Run project validator
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f tools/validate_v20.py ]; then
            echo "Running V-20 validator..."
            python3 tools/validate_v20.py
            echo "V-20 VALIDATOR PASSED."
          else
            echo "No tools/validate_v20.py found."
            echo "Skipping optional validator."
          fi

      # ============================================================
      # 13. SET UP GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      # ============================================================
      # 14. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew

            ./gradlew --version

            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            gradle --version

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 15. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf \
            .gradle \
            build \
            app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "CLEAN PASSED."

      # ============================================================
      # 16. DUPLICATE CLASS CHECK
      # ============================================================
      - name: Check duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "DUPLICATE CLASS CHECK PASSED."

      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "BUILDING MY SHOP APK"
          echo "============================================"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"
          echo "Package     : $APP_ID"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

          echo
          echo "GRADLE BUILD PASSED."

      # ============================================================
      # 18. FIND EXACTLY ONE DEBUG APK
      # ============================================================
      - name: Verify exactly one debug APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APK_FILES < <(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print |
            sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE debug APK."
            echo "Found: ${#APK_FILES[@]}"
            echo
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          APK_FILE="${APK_FILES[0]}"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo
          echo "APK FOUND:"
          ls -lh "$APK_FILE"

      # ============================================================
      # 19. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found:"
            echo "$AAPT2"
            exit 1
          fi

          BADGING="$(
            "$AAPT2" dump badging "$APK_FILE"
          )"

          echo
          echo "APK BADGING:"
          echo "$BADGING"

          echo "$BADGING" | grep -q \
            "package: name='$APP_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

          echo
          echo "APK PACKAGE/VERSION CHECK PASSED."

      # ============================================================
      # 20. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$GITHUB_WORKSPACE/release"

          FINAL_APK="$GITHUB_WORKSPACE/release/MY-SHOP-v${VERSION_NAME}.apk"

          cp "$APK_FILE" "$FINAL_APK"

          test -s "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo
          echo "============================================"
          echo "FINAL APK"
          echo "============================================"
          ls -lh "$FINAL_APK"

      # ============================================================
      # 21. APK INTEGRITY + SHA256
      # ============================================================
      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$FINAL_APK" >/dev/null

          sha256sum "$FINAL_APK" \
            > "$GITHUB_WORKSPACE/release/MY-SHOP-v${VERSION_NAME}.sha256"

          test -s \
            "$GITHUB_WORKSPACE/release/MY-SHOP-v${VERSION_NAME}.sha256"

          echo
          echo "SHA256:"
          cat \
            "$GITHUB_WORKSPACE/release/MY-SHOP-v${VERSION_NAME}.sha256"

          echo
          echo "APK INTEGRITY CHECK PASSED."

      # ============================================================
      # 22. UPLOAD VERSIONED APK
      # ============================================================
      - name: Upload MY SHOP APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-v${{ env.VERSION_NAME }}
          path: |
            release/MY-SHOP-v${{ env.VERSION_NAME }}.apk
            release/MY-SHOP-v${{ env.VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## MY SHOP APK BUILD"
            echo
            echo "- Version Code: \`$VERSION_CODE\`"
            echo "- Version Name: \`$VERSION_NAME\`"
            echo "- Package: \`$APP_ID\`"
            echo "- Source ZIP: \`$SOURCE_ZIP\`"
            echo "- APK: \`MY-SHOP-v${VERSION_NAME}.apk\`"
            echo
            echo "### BUILD STATUS"
            echo "SUCCESS"
          } >> "$GITHUB_STEP_SUMMARY"
