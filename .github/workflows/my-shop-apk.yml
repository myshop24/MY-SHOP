name: MY SHOP AUTO BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: MY SHOP BUILD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest V ZIP
        run: |
          set -e
          best=""
          ver=-1

          for f in V-*.zip V_*.zip; do
            [ -f "$f" ] || continue
            if [[ "$f" =~ ^V[-_]([0-9]+)-.*\.zip$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))
              if [ "$n" -gt "$ver" ]; then
                ver=$n
                best="$f"
              fi
            fi
          done

          [ -n "$best" ] || exit 1

          echo "SOURCE_ZIP=$best" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$ver" >> "$GITHUB_ENV"

          echo "Using: $best"

      - name: Extract source
        run: |
          set -e
          rm -rf source
          mkdir source
          unzip -q "$SOURCE_ZIP" -d source

      - name: Find Android project
        run: |
          set -e

          PROJECT=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1 | xargs -r dirname)

          [ -n "$PROJECT" ] || exit 1

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix BuildConfig
        run: |
          set -e

          FILE="$PROJECT/app/build.gradle"

          python3 - "$FILE" <<'PY'
          import sys
          import re

          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          field = re.compile(
              r'^\s*buildConfigField\s+.*MYSHOP_BACKEND_URL.*$\n?',
              re.MULTILINE
          )

          match = field.search(s)

          if match:
              line = match.group(0).strip()
              s = s[:match.start()] + s[match.end():]
          else:
              line = """buildConfigField 'String', 'MYSHOP_BACKEND_URL', '"' + backendUrl.replace('\\\\','\\\\\\\\').replace('\\"','\\\\\\"') + '"'"""

          if "buildFeatures { buildConfig true }" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    buildFeatures { buildConfig true }",
                  1
              )

          marker = "        versionName"
          pos = s.find(marker)

          if pos == -1:
              raise SystemExit("versionName not found")

          end = s.find("\n", pos)

          s = s[:end + 1] + "        " + line + "\n" + s[end + 1:]

          open(p, "w", encoding="utf-8").write(s)

          print("BuildConfig fixed.")
          PY

          echo "----- build.gradle -----"
          sed -n '1,30p' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          gradle clean :app:assembleRelease --no-daemon --no-build-cache --rerun-tasks

          mapfile -t APKs < <(
            find app/build/outputs/apk \
            -type f -name "*.apk"
          )

          [ "${#APKs[@]}" -eq 1 ] || {
            echo "ERROR: APK count is not 1"
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK="V-${SOURCE_VERSION}-MY-SHOP.apk"

          cp "${APKs[0]}" \
            "$GITHUB_WORKSPACE/release/$APK"

          sha256sum \
            "$GITHUB_WORKSPACE/release/$APK" \
            > "$GITHUB_WORKSPACE/release/$APK.sha256"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V-${{ env.SOURCE_VERSION }}
          path: |
            release/${{ env.APK }}
            release/${{ env.APK }}.sha256
