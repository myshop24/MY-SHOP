name: V-91 MY SHOP FINAL RELEASE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-v91-final
  cancel-in-progress: true

env:
  VERSION_NUMBER: "91"
  VERSION_NAME: "2.9.91"
  PACKAGE_NAME: "com.myshop.app"
  SOURCE_DIR: "v91_source"
  RELEASE_DIR: "release"

jobs:
  build:
    name: V-91 - SINGLE VERIFIED APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lock repository to EXACT V-91 source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SOURCES < <(
            find . -maxdepth 1 -type f \
              -name 'V-91_MY_SHOP_FULL_PROJECT_SOURCE.zip' | sort
          )

          if [ "${#SOURCES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE V-91 master source ZIP."
            echo "Found: ${#SOURCES[@]}"
            printf '%s\n' "${SOURCES[@]:-<none>}"
            exit 1
          fi

          SOURCE_ZIP="${SOURCES[0]}"

          test -s "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "V-91 source lock passed."
          sha256sum "$SOURCE_ZIP"

      - name: Extract V-91 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR" "$RELEASE_DIR"

          mkdir -p "$SOURCE_DIR" "$RELEASE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

      - name: Locate exactly one Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS < <(
            find "$SOURCE_DIR" -type f \
              -name settings.gradle -o -name settings.gradle.kts \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' | sort
          )

          [ "${#SETTINGS[@]}" -eq 1 ] || {
            echo "::error::Expected exactly ONE Android project."
            printf '%s\n' "${SETTINGS[@]:-<none>}"
            exit 1
          }

          ROOT="$(dirname "${SETTINGS[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
