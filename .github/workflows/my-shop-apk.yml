name: MY SHOP PERMANENT RELEASE PIPELINE

on:
  push:
    branches:
      - main
    paths:
      - 'V-*.zip'
      - 'my-shop-release.sh'
      - '.github/workflows/my-shop-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-shop-main-release
  cancel-in-progress: false

env:
  MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    name: WORKER VERIFY -> APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK ready."

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: my-shop-release-signing-v1

      - name: Deploy verified Worker then build signed APK
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MYSHOP_KEYSTORE_PASSWORD: ${{ secrets.MYSHOP_KEYSTORE_PASSWORD }}
          MYSHOP_KEY_ALIAS: ${{ secrets.MYSHOP_KEY_ALIAS }}
          MYSHOP_KEY_PASSWORD: ${{ secrets.MYSHOP_KEY_PASSWORD }}
          MYSHOP_FIREBASE_API_KEY: ${{ secrets.MYSHOP_FIREBASE_API_KEY }}
          MYSHOP_FIREBASE_APP_ID: ${{ secrets.MYSHOP_FIREBASE_APP_ID }}
          MYSHOP_FIREBASE_PROJECT_ID: ${{ secrets.MYSHOP_FIREBASE_PROJECT_ID }}
          MYSHOP_FIREBASE_SENDER_ID: ${{ secrets.MYSHOP_FIREBASE_SENDER_ID }}
        run: bash my-shop-release.sh

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-FINAL-V-${{ env.SOURCE_VERSION }}
          path: release/MY_SHOP_FINAL_RELEASE.apk
          if-no-files-found: error
          retention-days: 30
