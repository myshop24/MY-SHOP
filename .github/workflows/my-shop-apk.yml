name: MY SHOP V-45 APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_ZIP: V-45_MY_SHOP_OPEN_DASHBOARD_SEARCHBOX_FIXED_SOURCE.zip

jobs:
  build:
    name: MY SHOP V-45 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify exact V-45 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract V-45 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

      - name: Locate exactly one Android project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SETTINGS_FILES < <(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print | sort)
          test "${#SETTINGS_FILES[@]}" -eq 1
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Static V-45 source audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Fq "versionCode 45" app/build.gradle
          grep -Fq "versionName '2.9.45'" app/build.gradle
          grep -Fq "applicationId 'com.myshop.app'" app/build.gradle
          grep -Fq "import android.widget.Button;" app/src/main/java/com/myshop/app/LoginActivity.java
          grep -Fq "private EditText searchBox;" app/src/main/java/com/myshop/app/MainActivity.java
          grep -Fq "searchBox = new EditText(this);" app/src/main/java/com/myshop/app/MainActivity.java
          grep -Fq "searchBox.setOnEditorActionListener" app/src/main/java/com/myshop/app/MainActivity.java
          ! grep -RIn "findViewById(R.id.searchBox).setOnEditorActionListener" app/src/main/java
          grep -Fq 'android:name=".LoginActivity" android:exported="true"' app/src/main/AndroidManifest.xml
          grep -Fq '<action android:name="android.intent.action.MAIN" />' app/src/main/AndroidManifest.xml
          grep -Fq '<category android:name="android.intent.category.LAUNCHER" />' app/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".MainActivity" />' app/src/main/AndroidManifest.xml
          test "$(grep -c "versionCode 45" app/build.gradle)" -eq 1

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --no-build-cache --stacktrace

      - name: Check duplicate classes
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:checkDebugDuplicateClasses --no-daemon --no-build-cache --stacktrace

      - name: Build exactly one debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Verify exactly one APK + package + version + integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print | sort)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2"
          test -x "$AAPT2"
          BADGING="$($AAPT2 dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.myshop.app' versionCode='45' versionName='2.9.45'"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/V-45-MY-SHOP-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/V-45-MY-SHOP-debug.apk" > "$GITHUB_WORKSPACE/release/V-45-MY-SHOP-debug.sha256"
          unzip -t "$GITHUB_WORKSPACE/release/V-45-MY-SHOP-debug.apk" >/dev/null

      - name: Upload final V-45 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-45-MY-SHOP-APK
          path: |
            release/V-45-MY-SHOP-debug.apk
            release/V-45-MY-SHOP-debug.sha256
          if-no-files-found: error
          retention-days: 30
