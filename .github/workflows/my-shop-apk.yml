name: MY SHOP V-19 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # This is the V-19 ZIP that is actually present in the GitHub repository.
  V19_ZIP: V-19_MY_SHOP_COMPILE_FIXED_V2.zip

jobs:
  build:
    name: MY SHOP V-19 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # No Gradle cache here because the Android project is inside
      # the ZIP and is extracted later.
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. VERIFY THE ONE V-19 SOURCE ZIP
      # ============================================================
      - name: Verify V-19 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected V-19 source:"
          echo "$V19_ZIP"
          echo

          if [ ! -f "$V19_ZIP" ]; then
            echo "ERROR: V-19 source ZIP was not found:"
            echo "$V19_ZIP"
            echo
            echo "ZIP files currently in the repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name "*.zip" \
              -print | sort
            exit 1
          fi

          echo "V-19 source ZIP FOUND:"
          ls -lh "$V19_ZIP"

      # ============================================================
      # 5. EXTRACT V-19 SOURCE
      # ============================================================
      - name: Extract V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$V19_ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "V-19 ZIP extracted."

      # ============================================================
      # 6. LOCATE THE ANDROID PROJECT
      # Require exactly one settings.gradle(.kts), so the wrong
      # nested project cannot be selected silently.
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]}"
            echo
            echo "Extracted Android project files:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 7 \
              -type f \
              -print | sort | head -400
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 7. VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          MAIN_ACTIVITY="$(
            find app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY=$PROJECT_DIR/$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo "V-19 Android project structure OK."
          echo "MainActivity: $MAIN_ACTIVITY"

      # ============================================================
      # 8. VERIFY V-19 VERSION
      # ============================================================
      - name: Verify V-19 version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
          else
            BUILD_FILE="app/build.gradle.kts"
          fi

          echo "Checking:"
          echo "$BUILD_FILE"

          if ! grep -Eq 'versionCode[[:space:]]+(=[[:space:]]*)?19([[:space:]]|$)' "$BUILD_FILE"; then
            echo "ERROR: versionCode 19 not found."
            exit 1
          fi

          if ! grep -Eq 'versionName[[:space:]]+(=[[:space:]]*)?["'\'']2\.8\.0["'\'']' "$BUILD_FILE"; then
            echo "ERROR: versionName 2.8.0 not found."
            exit 1
          fi

          echo "V-19 VERSION CHECK PASSED."

      # ============================================================
      # 9. VERIFY MAINACTIVITY SEARCHBOX FIX
      # ============================================================
      - name: Verify MainActivity searchBox fix
        shell: bash
        run: |
          set -euo pipefail

          test -s "$MAIN_ACTIVITY"

          grep -q 'searchBox[[:space:]]*=[[:space:]]*findViewById(R.id.searchBox)' \
            "$MAIN_ACTIVITY"

          grep -q 'searchBox.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"

          if grep -q 'findViewById(R.id.searchBox).setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then
            echo "ERROR: unsafe searchBox listener expression still exists."
            exit 1
          fi

          echo "SEARCHBOX / LINE-91 FIX PASSED."

      # ============================================================
      # 10. RUN PROJECT VALIDATOR WHEN PRESENT
      # ============================================================
      - name: Validate V-19 project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "tools/validate_v19.py" ]; then
            python3 tools/validate_v19.py
            echo "V-19 validator PASSED."
          else
            echo "tools/validate_v19.py not present; validator skipped."
          fi

      # ============================================================
      # 11. PREPARE GRADLE
      # If the project contains gradlew, use the project's wrapper.
      # Otherwise use the runner's Gradle 8.9.
      # ============================================================
      - name: Set up Gradle 8.9
        if: ${{ hashFiles('source/**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            gradle --version
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 12. CLEAN
      # ============================================================
      - name: Clean V-19 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf .gradle build app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      # ============================================================
      # 13. CHECK DUPLICATE CLASSES
      # ============================================================
      - name: Check Gradle duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "DUPLICATE CLASS CHECK PASSED."

      # ============================================================
      # 14. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP V-19 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "BUILDING MY SHOP V-19 APK"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

          echo "GRADLE BUILD PASSED."

      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify V-19 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V-19 APK was not generated."
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk" \
            > "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.sha256"

          unzip -t \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk" \
            >/dev/null

          test -s "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk"
          test -s "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.sha256"

          echo "V-19 APK VERIFIED SUCCESSFULLY."
          ls -lh "$GITHUB_WORKSPACE/release/"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload MY SHOP V-19 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-19-MY-SHOP-APK
          path: |
            release/V-19-MY-SHOP-debug.apk
            release/V-19-MY-SHOP-debug.sha256
          if-no-files-found: error
          retention-days: 30
