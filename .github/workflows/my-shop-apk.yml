name: MY SHOP STABLE PERMANENT D1 R2 RELEASE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev
  WORKER_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev

jobs:
  verify-deploy-build:
    name: VERIFY → WORKER → APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Permanent external-backup removal guard
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'GDRIVE_SERVICE_ACCOUNT_JSON|GDRIVE_FOLDER_ID|Google[[:space:]]+Drive|Backup[[:space:]]+Source[[:space:]]+ZIP' \
            .github/workflows >/dev/null; then
            echo 'ERROR: Removed external-backup logic detected in active workflow files. BUILD STOP.'
            exit 1
          fi

          echo 'PERMANENT EXTERNAL-BACKUP REMOVAL GUARD PASSED'

      - name: Select newest V-numbered source ZIP
        shell: bash
        run: |
          set -euo pipefail

          BEST=""
          VERSION=-1

          shopt -s nullglob

          for FILE in V-*.zip V_*.zip; do
            if [[ "$FILE" =~ ^V[-_]([0-9]+)-.*\.zip$ ]]; then
              N=$((10#${BASH_REMATCH[1]}))

              if (( N > VERSION )); then
                VERSION="$N"
                BEST="$FILE"
              fi
            fi
          done

          test -n "$BEST" || {
            echo 'ERROR: No V-numbered source ZIP found.'
            exit 1
          }

          echo "SOURCE_ZIP=$BEST" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$VERSION" >> "$GITHUB_ENV"

          [[ "$BEST" == V-$VERSION-* ]] || {
            echo 'ERROR: ZIP filename/version mismatch; BUILD STOP'
            exit 1
          }

          test "$VERSION" -ge 202 || {
            echo "ERROR: Refusing to build a source older than V-202. BUILD STOP"
            exit 1
          }

          echo "Selected ONLY newest source: $BEST (V-$VERSION)"

      - name: Extract exact source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source release
          mkdir -p source release

          unzip -q "$SOURCE_ZIP" -d source

          BUILD_ID_FILE="$(
            find source -type f -name SOURCE_BUILD_ID.txt -print -quit
          )"

          test -n "$BUILD_ID_FILE" || {
            echo 'ERROR: SOURCE_BUILD_ID.txt not found'
            exit 1
          }

          grep -Fqx "MY SHOP V-$SOURCE_VERSION" "$BUILD_ID_FILE"

          ROOT_SOURCE="$(dirname "$BUILD_ID_FILE")"

          test -f "$ROOT_SOURCE/app/build.gradle" || \
          test -f "$ROOT_SOURCE/app/build.gradle.kts" || {
            echo 'ERROR: Source root has no app Gradle file'
            exit 1
          }

          test -f "$ROOT_SOURCE/backend/worker/src/index.js" || {
            echo 'ERROR: Source root has no Worker source'
            exit 1
          }

          APP_GRADLE="$(
            find "$ROOT_SOURCE/app" \
              -maxdepth 1 \
              -type f \
              -name 'build.gradle*' \
              -print -quit
          )"

          python3 - "$APP_GRADLE" "$SOURCE_VERSION" <<'PY'
          import re
          import sys

          p, ver = sys.argv[1], int(sys.argv[2])
          s = open(p, encoding="utf-8").read()

          m = re.search(r'\bversionCode\s+(\d+)', s)
          assert m and int(m.group(1)) == ver, \
              'ERROR: Source versionCode mismatch; BUILD STOP'

          m = re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", s)
          assert m and m.group(1) == f'2.9.{ver}', \
              'ERROR: Source versionName mismatch; BUILD STOP'
          PY

          echo "SOURCE_ROOT=$ROOT_SOURCE" >> "$GITHUB_ENV"

      - name: Locate Android + Worker project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(
            find source -type f \
              -name settings.gradle -o -name settings.gradle.kts \
              -print -quit
          )"

          test -n "$SETTINGS" || {
            echo 'ERROR: Android settings file not found.'
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          test -f "$PROJECT/app/build.gradle" || \
          test -f "$PROJECT/app/build.gradle.kts" || {
            echo 'ERROR: app Gradle file not found.'
            exit 1
          }

          test -f "$PROJECT/backend/worker/wrangler.toml" || {
            echo 'ERROR: Worker wrangler.toml not found.'
            exit 1
          }

          test -f "$PROJECT/backend/worker/src/index.js" || {
            echo 'ERROR: Worker source not found.'
            exit 1
          }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Lock app version, backend version, URL and permanent bindings
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            "$PROJECT/app/build.gradle" \
            "$SOURCE_VERSION" \
            "$MYSHOP_BACKEND_URL" <<'PY'
          import re
          import sys

          path, ver, url = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          s = open(path, encoding="utf-8").read()

          s = re.sub(
              r'\bversionCode\s+\d+',
              f'versionCode {ver}',
              s,
              count=1
          )

          s = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f"versionName '2.9.{ver}'",
              s,
              count=1
          )

          s = re.sub(
              r'^[ \t]*buildConfigField\s+.*MYSHOP_BACKEND_URL.*\n?',
              '',
              s,
              flags=re.M
          )

          m = re.search(r'\bdefaultConfig\s*\{', s)
          assert m, 'defaultConfig not found'

          field = (
              f"        buildConfigField 'String', "
              f"'MYSHOP_BACKEND_URL', '\"{url}\"'\n"
          )

          s = s[:m.end()] + '\n' + field + s[m.end():]

          open(path, 'w', encoding='utf-8').write(s)
          PY

          python3 \
            "$PROJECT/backend/worker/src/index.js" \
            "$SOURCE_VERSION" <<'PY'
          import re
          import sys

          path, ver = sys.argv[1], int(sys.argv[2])
          s = open(path, encoding="utf-8").read()

          s, n = re.subn(
              r"version:'2\.9\.\d+',build:'V-\d+'",
              f"version:'2.9.{ver}',build:'V-{ver}'",
              s,
              count=1
          )

          assert n == 1, \
              'Worker /health version marker not found'

          open(path, 'w', encoding='utf-8').write(s)
          PY

          TOML="$PROJECT/backend/worker/wrangler.toml"

          grep -Fq 'name = "rapid-bush-62ea"' "$TOML"
          grep -Fq 'database_name = "my-shop-db"' "$TOML"
          grep -Fq \
            'database_id = "15b6acd2-0e82-4bd8-95fb-bee6fc08936c"' \
            "$TOML"

          grep -Fq 'binding = "MEDIA"' "$TOML"
          grep -Fq 'bucket_name = "my-shop-media"' "$TOML"

          grep -Fq '"/v1/feed"' \
            "$PROJECT/backend/worker/src/index.js" || \
          grep -Fq "'/v1/feed'" \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'avatar_object_key' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'PROFILE_UPDATE_FAILED' \
            "$PROJECT/backend/worker/src/index.js"

          node --check \
            "$PROJECT/backend/worker/src/index.js"

          BUILD_ID_FILE="$(
            find "$PROJECT" \
              -type f \
              -name SOURCE_BUILD_ID.txt \
              -print -quit
          )"

          test -n "$BUILD_ID_FILE" || {
            echo 'ERROR: SOURCE_BUILD_ID.txt not found after source extraction'
            exit 1
          }

          grep -Fqx \
            "MY SHOP V-$SOURCE_VERSION" \
            "$BUILD_ID_FILE"

          echo "SOURCE_VERSION=$SOURCE_VERSION locked"
          echo "SOURCE BUILD LOCK PASSED"

      - name: Verify MY SHOP instruction safety before deploy
        shell: bash
        run: |
          set -euo pipefail

          ! grep -Fq 'AdminSectionActivity' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq \
            'getBooleanExtra("admin_context",false)' \
            "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"

          grep -Fq \
            'putExtra("admin_context",true)' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq \
            'putExtra("admin_context",true)' \
            "$PROJECT/app/src/main/java/com/myshop/app/AdminHubActivity.java"

          grep -Fq 'SOCIAL MEDIA' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq 'SHARE APP' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq 'CUSTOMER SUPPORT' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq 'HELP & SUPPORT' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq 'Search' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq '🌎' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          ! grep -Fq \
            'globe.setBackground(round(RED' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'openSupport' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'threeLineMenu' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'SAVE / EDIT' \
            "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"

          grep -Fq 'extTitle' \
            "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"

          grep -Fq 'normalizePlatformTarget' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'menu_language' \
            "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"

          grep -Fq 'R.drawable.nav_home' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'R.drawable.nav_store' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'R.drawable.nav_live' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'R.drawable.nav_support' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'R.drawable.nav_more' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'ACTION_GET_CONTENT' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'ensureSchemasOnce(env)' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'normalizeWhatsApp' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'renderMore' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'R2_VERIFY_FAILED' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'adminBannerUpload' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'notificationsList' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'notificationsReadAll' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'ensureNotificationSchema' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'createUserNotification' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'NOTIFICATION_DB_WRITE_FAILED' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'assertContentSchema' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'D1_SCHEMA_REPAIR_FAILED' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'myshop_schema_meta' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'V-192 permanent legacy-banner repair' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'd1WriteProbe' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'r2WriteProbe' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'contentWriteSuite' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'D1_WRITE_READY_FAILED' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'onResume' \
            "$PROJECT/app/src/main/java/com/myshop/app/NotificationActivity.java"

          grep -Fq 'Facebook' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'YouTube' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'Instagram' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'Telegram' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'Customer Support' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'Share MY SHOP' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          grep -Fq 'commentCount' \
            "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"

          grep -Fq 'comment_count' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'INSERT INTO notification_reads' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq \
            'SELECT id FROM banner_media WHERE folder=? AND slot=?' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'section' \
            "$PROJECT/backend/worker/src/index.js"

          grep -Fq 'position' \
            "$PROJECT/backend/worker/src/index.js"

          ! grep -RniE \
            'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE|DELETE[[:space:]]+FROM[[:space:]]+myshop_auth_users_v108' \
            "$PROJECT/backend/worker/src" >/dev/null

          echo 'INSTRUCTION + DATA SAFETY GUARDS PASSED'

      - name: Preflight Java context-safety guard
        shell: bash
        run: |
          set -euo pipefail

          if grep -RFn --include='*.java' \
            'new Intent(this,FeatureActivity.class)' \
            "$PROJECT/app/src/main/java"; then

            echo 'ERROR: Unsafe FeatureActivity Intent context found.'
            echo 'Use FeatureActivity.this.'
            exit 1
          fi

          if grep -RFn --include='*.java' \
            'new Intent(this, FeatureActivity.class)' \
            "$PROJECT/app/src/main/java"; then

            echo 'ERROR: Unsafe FeatureActivity Intent context found.'
            echo 'Use FeatureActivity.this.'
            exit 1
          fi

          grep -Fq \
            'new Intent(FeatureActivity.this,FeatureActivity.class)' \
            "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"

          echo 'JAVA CONTEXT-SAFETY GUARD PASSED'

          ! grep -Fq \
            'INSERT INTO banner_media(folder,slot,object_key,updated_at) VALUES(?,?,?,CURRENT_TIMESTAMP) ON CONFLICT(folder,slot)' \
            "$PROJECT/backend/worker/src/index.js"

          ! grep -Fq \
            'INSERT INTO social_links(platform,url,icon_key,active) VALUES(?,?,?,?) ON CONFLICT(platform)' \
            "$PROJECT/backend/worker/src/index.js"

          echo 'LEGACY-D1 WRITE COMPATIBILITY GUARD PASSED'

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'ERROR: Missing CLOUDFLARE_API_TOKEN'
            exit 1
          }

          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo 'ERROR: Missing CLOUDFLARE_ACCOUNT_ID'
            exit 1
          }

          test -n "${MYSHOP_HEALTH_PROBE_KEY:-}" || {
            echo 'ERROR: Missing MYSHOP_HEALTH_PROBE_KEY'
            exit 1
          }

      - name: Deploy the SAME verified Worker source
        working-directory: ${{ env.PROJECT }}/backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$MYSHOP_HEALTH_PROBE_KEY" |
            npx --yes wrangler@4.128.0 \
            secret put MYSHOP_HEALTH_PROBE_KEY \
            --config wrangler.toml

          WORKER_VERSION_TAG="my-shop-v-${SOURCE_VERSION}-run-${GITHUB_RUN_ID}"

          npx --yes wrangler@4.128.0 \
            versions upload \
            --config wrangler.toml \
            --tag "$WORKER_VERSION_TAG" \
            --message "MY SHOP V-$SOURCE_VERSION run $GITHUB_RUN_ID"

          npx --yes wrangler@4.128.0 \
            versions deploy \
            --config wrangler.toml \
            --version-tag "$WORKER_VERSION_TAG" \
            -y

          echo "EXACT WORKER VERSION PROMOTED: $WORKER_VERSION_TAG"

          npx --yes wrangler@4.128.0 \
            deployments status \
            --config wrangler.toml \
            --json |
            tee /tmp/worker-deployment-status.json

      - name: Write immutable build source manifest
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$SOURCE_ZIP" \
            > release/source-zip.sha256

          printf 'V-%s\n%s\n%s\n' \
            "$SOURCE_VERSION" \
            "$SOURCE_ZIP" \
            "$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')" \
            > release/BUILD_SOURCE_ID.txt

      - name: Verify ACTIVE production Worker before APK build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/cloudflare

          probe() {
            local url="$1"
            local out="$2"
            local i
            local status

            for i in $(seq 1 20); do
              status="$(
                curl \
                  --silent \
                  --show-error \
                  --output "$out.tmp" \
                  --write-out '%{http_code}' \
                  "$url" || true
              )"

              cp "$out.tmp" "$out"

              if [ "$status" = "200" ]; then
                return 0
              fi

              sleep 3
            done

            echo "ERROR: Worker probe did not return HTTP 200: $url"
            cat "$out" || true
            return 1
          }

          probe "$WORKER_URL/health" \
            /tmp/health.json

          cp /tmp/health.json \
            release/cloudflare/health.json

          probe "$WORKER_URL/health/deep" \
            /tmp/deep.json

          cp /tmp/deep.json \
            release/cloudflare/deep-health.json

          probe "$WORKER_URL/v1/dashboard/config" \
            /tmp/dashboard.json

          cp /tmp/dashboard.json \
            release/cloudflare/dashboard.json

          python3 - "$SOURCE_VERSION" <<'PY'
          import json
          import sys

          v = int(sys.argv[1])

          h = json.load(open('/tmp/health.json'))
          d = json.load(open('/tmp/deep.json'))
          c = json.load(open('/tmp/dashboard.json'))

          assert h.get('ok') is True, \
              'Worker /health failed'

          assert (
              h.get('version') == f'2.9.{v}' and
              h.get('build') == f'V-{v}'
          ), f'WRONG ACTIVE WORKER: {h}'

          assert (
              d.get('ok') is True and
              d.get('database') == 'ok' and
              d.get('d1Write') == 'ok' and
              d.get('schema') == 'ok' and
              d.get('r2') == 'ok' and
              d.get('r2Write') == 'ok'
          ), f'D1/R2 READ+WRITE deep health failed: {d}'

          assert not c.get('error'), \
              f'Dashboard config failed: {c}'

          print('ACTIVE WORKER VERIFIED:', f'V-{v}')
          PY

      - name: Run ACTIVE Worker content write diagnostics
        env:
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MYSHOP_HEALTH_PROBE_KEY:-}" ]; then
            echo 'CONTENT WRITE DIAGNOSTIC SKIPPED'
            exit 0
          fi

          curl \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --output /tmp/content-suite.json \
            --write-out "%{http_code}" \
            -H "X-MYSHOP-HEALTH-KEY: $MYSHOP_HEALTH_PROBE_KEY" \
            "$WORKER_URL/health/content-write-suite" |
            tee /tmp/content-suite.status

          cp /tmp/content-suite.json \
            release/cloudflare/content-write-suite.json

          if [ "$(cat /tmp/content-suite.status)" != "200" ]; then
            echo "CONTENT WRITE DIAGNOSTIC FAILED"
            cat /tmp/content-suite.json
            exit 0
          fi

          python3 - <<'PY'
          import json

          d = json.load(open('/tmp/content-suite.json'))

          if d.get('ok') is not True:
              print(f'CONTENT WRITE DIAGNOSTIC FAILED: {d}')
              raise SystemExit(0)

          required = [
              'schema',
              'dashboard_config',
              'banners',
              'banner_media',
              'gallery_items',
              'gallery_media',
              'social_links',
              'feature_buttons',
              'managed_links',
              'dashboard_ads',
              'notifications',
              'notification_reads',
              'r2'
          ]

          bad = [
              k for k in required
              if d.get('checks', {}).get
