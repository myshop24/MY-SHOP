name: MY SHOP V-19 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # IMPORTANT:
  # This is the exact V-19 ZIP filename currently present
  # in the GitHub repository.
  V19_ZIP: MY-SHOP-V19-FULL-FIXED-V3.zip

jobs:
  build:
    name: MY SHOP V-19 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      # ============================================================
      # 5. FIND V-19 ZIP
      # ============================================================
      - name: Find V-19 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "$V19_ZIP"
          echo

          if [ ! -f "$V19_ZIP" ]; then
            echo "ERROR: $V19_ZIP was not found."
            echo
            echo "V-19 ZIP files currently in repository:"
            find . -maxdepth 2 -type f -iname '*V19*.zip' -print || true
            echo
            echo "All repository root files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo
          echo "V-19 ZIP found successfully:"
          ls -lh "$V19_ZIP"

      # ============================================================
      # 6. EXTRACT V-19
      # ============================================================
      - name: Extract V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$V19_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "V-19 source extracted."

      # ============================================================
      # 7. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 8 \
              -type f \
              -print | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project located at:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify V-19 Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] &&
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] &&
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          if [ ! -f "app/src/main/java/com/myshop/app/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java missing."
            exit 1
          fi

          echo
          echo "============================================"
          echo "ANDROID PROJECT STRUCTURE OK"
          echo "============================================"

      # ============================================================
      # 9. VERIFY V-19 VERSION
      # ============================================================
      - name: Verify V-19 version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUILD_FILE=""

          if [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
          elif [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "Checking V-19 version in:"
          echo "$BUILD_FILE"
          echo

          if ! grep -Eq \
            'versionCode[[:space:]]*([=][[:space:]]*)?19([[:space:]]|$)' \
            "$BUILD_FILE"; then
            echo "ERROR: versionCode 19 not found."
            echo "Please make sure this is the V-19 source ZIP."
            exit 1
          fi

          if ! grep -Eq \
            'versionName[[:space:]]*([=][[:space:]]*)?["'\'']2\.8\.0["'\'']' \
            "$BUILD_FILE"; then
            echo "ERROR: versionName 2.8.0 not found."
            echo "Please make sure this is the V-19 source ZIP."
            exit 1
          fi

          echo "V-19 version check PASSED."

      # ============================================================
      # 10. VERIFY MAINACTIVITY SEARCHBOX FIX
      # ============================================================
      - name: Verify MainActivity searchBox fix
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN_ACTIVITY="app/src/main/java/com/myshop/app/MainActivity.java"

          test -s "$MAIN_ACTIVITY"

          grep -q '^package com.myshop.app;' "$MAIN_ACTIVITY"

          grep -q \
            'public class MainActivity extends AppCompatActivity' \
            "$MAIN_ACTIVITY"

          # The EditText field must be bound first.
          grep -q \
            'searchBox = findViewById(R.id.searchBox);' \
            "$MAIN_ACTIVITY"

          # The listener must be attached to the typed EditText field.
          grep -q \
            'searchBox.setOnEditorActionListener' \
            "$MAIN_ACTIVITY"

          # The old unsafe expression must NOT exist.
          if grep -q \
            'findViewById(R.id.searchBox).setOnEditorActionListener' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: old unsafe searchBox listener expression found."
            exit 1
          fi

          echo "MainActivity.java searchBox fix PASSED."

      # ============================================================
      # 11. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            gradle --version
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
            echo
            echo "NOTE: Gradle wrapper not found."
            echo "Using GitHub Actions Gradle 8.9."
          fi

      # ============================================================
      # 12. CLEAN PROJECT
      # ============================================================
      - name: Clean V-19 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          "$GRADLE_COMMAND" \
            clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      # ============================================================
      # 13. CHECK DUPLICATE CLASSES
      # ============================================================
      - name: Check Gradle duplicate classes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking duplicate classes..."

          "$GRADLE_COMMAND" \
            :app:checkDebugDuplicateClasses \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo
          echo "============================================"
          echo "DUPLICATE CLASS CHECK PASSED"
          echo "============================================"

      # ============================================================
      # 14. BUILD DEBUG APK
      # ============================================================
      - name: Build MY SHOP V-19 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo
          echo "============================================"
          echo "BUILDING MY SHOP V-19 APK"
          echo "============================================"

          "$GRADLE_COMMAND" \
            :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify V-19 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V-19 APK was not generated."

            echo
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk" \
            > "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.sha256"

          unzip -t \
            "$GITHUB_WORKSPACE/release/V-19-MY-SHOP-debug.apk" \
            >/dev/null

          echo
          echo "============================================"
          echo "V-19 APK SUCCESSFULLY CREATED"
          echo "============================================"

          ls -lh "$GITHUB_WORKSPACE/release/"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload MY SHOP V-19 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-19-MY-SHOP-APK
          path: |
            release/V-19-MY-SHOP-debug.apk
            release/V-19-MY-SHOP-debug.sha256
          if-no-files-found: error
          retention-days: 30
