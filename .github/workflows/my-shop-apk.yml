name: V-83 MY SHOP - SINGLE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: V-83 - SINGLE APK
    runs-on: ubuntu-latest

    env:
      APP_VERSION_NAME: "8.3.0"
      APP_VERSION_CODE: "83"
      SOURCE_ZIP: "V-77_MY_SHOP_FULL_SOURCE.zip"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require exactly one official source ZIP
        shell: bash
        run: |
          set -e

          echo "Looking for official source:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          COUNT=$(find . -maxdepth 1 -type f -name "*.zip" | wc -l)

          echo "ZIP files found in repository root: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Using exactly:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

          echo "Extracted source:"
          find build_source -maxdepth 3 -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \
            -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find build_source -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          ROOT=$(dirname "$PROJECT")

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"

          curl -L \
            -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Apply V-83 version
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -e

          echo "Applying V-83 version..."

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version_name = os.environ["APP_VERSION_NAME"]
          version_code = os.environ["APP_VERSION_CODE"]

          roots = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
              Path("build.gradle"),
              Path("build.gradle.kts")
          ]

          for p in roots:
              if not p.exists():
                  continue

              text = p.read_text(errors="ignore")

              text = re.sub(
                  r'versionCode\s+\d+',
                  f'versionCode {version_code}',
                  text
              )

              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text
              )

              p.write_text(text)

          print("Version applied:")
          print("versionCode =", version_code)
          print("versionName =", version_name)
          PY

      - name: Repair AccountStore NoSuchAlgorithmException
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -e

          FILE=$(find . -type f \
            -path "*/src/main/java/*" \
            -name "AccountStore.java" \
            -print -quit || true)

          if [ -z "$FILE" ]; then
            echo "AccountStore.java not found. Continuing."
            exit 0
          fi

          echo "Checking:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(errors="ignore")

          if "NoSuchAlgorithmException" in text:
              if "import java.security.NoSuchAlgorithmException;" not in text:
                  text = text.replace(
                      "package com.myshop.app;",
                      "package com.myshop.app;\n\nimport java.security.NoSuchAlgorithmException;"
                  )

          old = 'return "sha256:" + sha256(canonicalAnswer(answer));'

          if old in text:
              new = '''try {
              return "sha256:" + sha256(canonicalAnswer(answer));
          } catch (NoSuchAlgorithmException e) {
              throw new IllegalStateException("SHA-256 is unavailable", e);
          }'''

              text = text.replace(old, new)

          path.write_text(text)

          print("AccountStore repair applied.")
          PY

      - name: Find Gradle launcher
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=
