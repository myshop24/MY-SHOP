name: MY SHOP - PERMANENT FINAL RELEASE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MY SHOP FINAL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select highest V source ZIP
        shell: bash
        run: |
          set -e

          BEST_FILE=""
          BEST_VERSION=0

          for FILE in V-*.zip; do
            [ -f "$FILE" ] || continue

            NAME="$(basename "$FILE")"

            if [[ "$NAME" =~ ^V-([0-9]+)-.*\.zip$ ]]; then
              VERSION=$((10#${BASH_REMATCH[1]}))

              if [ "$VERSION" -gt "$BEST_VERSION" ]; then
                BEST_VERSION="$VERSION"
                BEST_FILE="$NAME"
              fi
            fi
          done

          if [ -z "$BEST_FILE" ]; then
            echo "ERROR: No V-numbered source ZIP found."
            exit 1
          fi

          echo "SOURCE_ZIP=$BEST_FILE" >> "$GITHUB_ENV"
          echo "SOURCE_V=$BEST_VERSION" >> "$GITHUB_ENV"

          echo "================================"
          echo "SELECTED SOURCE"
          echo "ZIP: $BEST_FILE"
          echo "VERSION: V-$BEST_VERSION"
          echo "================================"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Source extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if find "$CANDIDATE" \
              -maxdepth 5 \
              -type f \
              \( \
                -path '*/app/build.gradle' \
                -o \
                -path '*/app/build.gradle.kts' \
              \) \
              -print -quit | grep -q .; then

              PROJECT_DIR="$CANDIDATE"
              break
            fi

          done < <(
            find source \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print | sort
          )

          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW_FILE="$(
              find source \
                -type f \
                -name gradlew \
                -print -quit
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              CANDIDATE="$(dirname "$GRADLEW_FILE")"

              if find "$CANDIDATE" \
                -maxdepth 5 \
                -type f \
                \( \
                  -path '*/app/build.gradle' \
                  -o \
                  -path '*/app/build.gradle.kts' \
                \) \
                -print -quit | grep -q .; then

                PROJECT_DIR="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Available Gradle/project files:"

            find source \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
                -o \
                -name build.gradle \
                -o \
                -name build.gradle.kts \
                -o \
                -name gradlew \
              \) \
              -print | head -200 || true

            exit 1
          fi

          APP_GRADLE=""

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          else
            APP_GRADLE="$(
              find "$PROJECT_DIR" \
                -maxdepth 5 \
                -type f \
                \( \
                  -path '*/app/build.gradle' \
                  -o \
                  -path '*/app/build.gradle.kts' \
                \) \
                -print -quit
            )"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID PROJECT"
          echo "$PROJECT_DIR"
          echo "APP GRADLE"
          echo "$APP_GRADLE"
          echo "================================"

      - name: Create permanent source build ID
        shell: bash
        run: |
          set -e

          printf 'V-%s\n' "$SOURCE_V" \
            > "$PROJECT_DIR/SOURCE_BUILD_ID.txt"

          printf '2.9.%s\n' "$SOURCE_V" \
            > "$PROJECT_DIR/SOURCE_VERSION_NAME.txt"

          echo "SOURCE_BUILD_ID:"
          cat "$PROJECT_DIR/SOURCE_BUILD_ID.txt"

          echo "SOURCE_VERSION_NAME:"
          cat "$PROJECT_DIR/SOURCE_VERSION_NAME.txt"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Apply permanent app version
        shell: bash
        run: |
          set -e

          if [ "$SOURCE_V" -le 0 ]; then
            echo "ERROR: Invalid V-number."
            exit 1
          fi

          if grep -Eq \
            'versionCode[[:space:]]+[0-9]+' \
            "$APP_GRADLE"; then

            sed -i -E \
              "s/versionCode[[:space:]]+[0-9]+/versionCode $SOURCE_V/g" \
              "$APP_GRADLE"

          elif grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*[0-9]+' \
            "$APP_GRADLE"; then

            sed -i -E \
              "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $SOURCE_V/g" \
              "$APP_GRADLE"

          else
            echo "WARNING: Literal versionCode was not found."
          fi

          if grep -Eq \
            'versionName[[:space:]]+['"'"'][^'"'"']+['"'"']' \
            "$APP_GRADLE"; then

            sed -i -E \
              "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName \"2.9.$SOURCE_V\"/g" \
              "$APP_GRADLE"

          elif grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*['"'"'][^'"'"']+['"'"']' \
            "$APP_GRADLE"; then

            sed -i -E \
              "s/versionName[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]/versionName = \"2.9.$SOURCE_V\"/g" \
              "$APP_GRADLE"

          else
            echo "WARNING: Literal versionName was not found."
          fi

          echo "================================"
          echo "VERSION CHECK"
          echo "Expected V: $SOURCE_V"
          echo "Expected Version Name: 2.9.$SOURCE_V"
          echo "================================"

          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE" \
            | head -20 || true

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

            echo "GRADLE_CMD=$PROJECT_DIR/gradlew" \
              >> "$GITHUB_ENV"

            ./gradlew --version

          else

            echo "================================"
            echo "No gradlew found in source ZIP."
            echo "Bootstrapping Gradle 8.13."
            echo "================================"

            GRADLE_HOME="$RUNNER_TEMP/gradle-8.13"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then

              curl -fsSL \
                -o "$RUNNER_TEMP/gradle.zip" \
                https://services.gradle.org/distributions/gradle-8.13-bin.zip

              rm -rf \
                "$GRADLE_HOME" \
                "$RUNNER_TEMP/gradle-8.13-extract"

              mkdir -p \
                "$RUNNER_TEMP/gradle-8.13-extract"

              unzip -q \
                "$RUNNER_TEMP/gradle.zip" \
                -d "$RUNNER_TEMP/gradle-8.13-extract"

              mv \
                "$RUNNER_TEMP/gradle-8.13-extract/gradle-8.13" \
                "$GRADLE_HOME"
            fi

            echo "GRADLE_CMD=$GRADLE_HOME/bin/gradle" \
              >> "$GITHUB_ENV"

            "$GRADLE_HOME/bin/gradle" --version
          fi

      - name: Clean previous APK output
        shell: bash
        run: |
          set -e

          rm -rf \
            "$PROJECT_DIR/app/build/outputs/apk"

          mkdir -p \
            "$PROJECT_DIR/app/build/outputs/apk"

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$GRADLE_CMD" \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          APK_LIST="$RUNNER_TEMP/apk-list.txt"

          find \
            "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            ! -name '*-unsigned.apk' \
            -print \
            > "$APK_LIST"

          APK_COUNT="$(wc -l < "$APK_LIST")"

          echo "Release APK count: $APK_COUNT"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one signed release APK."

            cat "$APK_LIST" || true

            echo "All APK/output files:"

            find \
              "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          APK_FILE="$(cat "$APK_LIST")"

          echo "Final source APK:"
          echo "$APK_FILE"

          mkdir -p release

          cp \
            "$APK_FILE" \
            release/MY_SHOP_FINAL_RELEASE.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          FINAL_APK="release/MY_SHOP_FINAL_RELEASE.apk"

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Final APK does not exist."
            exit 1
          fi

          if [ ! -s "$FINAL_APK" ]; then
            echo "ERROR: Final APK is empty."
            exit 1
          fi

          SIZE="$(stat -c%s "$FINAL_APK")"

          if [ "$SIZE" -le 10000 ]; then
            echo "ERROR: APK is too small."
            exit 1
          fi

          echo "================================"
          echo "FINAL APK VERIFIED"
          echo "File: $FINAL_APK"
          echo "Size: $SIZE bytes"
          echo "V: $SOURCE_V"
          echo "Version Name: 2.9.$SOURCE_V"
          echo "================================"

      - name: Upload exactly one final APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-FINAL-V-${{ env.SOURCE_V }}
          path: release/MY_SHOP_FINAL_RELEASE.apk
          if-no-files-found: error
          retention-days: 14
