name: MY SHOP - V57 Verified APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: my-shop-v57-build
  cancel-in-progress: true

jobs:
  build:
    name: MY SHOP APK - V57 VERIFIED SOURCE
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. FIND EXACT V57 SOURCE ZIP
      # ==========================================================
      - name: Locate V57 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ZIP FILES IN REPOSITORY ====="
          find . -maxdepth 1 -type f -iname "*.zip" -print | sort

          mapfile -t V57_ZIPS < <(
            find . -maxdepth 1 -type f -iname "*V-57*MY_SHOP*.zip" | sort
          )

          if [ "${#V57_ZIPS[@]}" -eq 0 ]; then
            echo "::error::No V57 MY SHOP source ZIP was found."
            exit 1
          fi

          if [ "${#V57_ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one V57 MY SHOP ZIP."
            echo "Found:"
            printf '%s\n' "${V57_ZIPS[@]}"
            exit 1
          fi

          SOURCE_ZIP="${V57_ZIPS[0]}"

          echo "Selected source:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      # ==========================================================
      # 3. EXTRACT V57 SOURCE
      # ==========================================================
      - name: Extract V57 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/my-shop-source"
          mkdir -p "$RUNNER_TEMP/my-shop-source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/my-shop-source"

          echo "===== EXTRACTED FILES ====="
          find "$RUNNER_TEMP/my-shop-source" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # ==========================================================
      # 4. FIND REAL ANDROID PROJECT ROOT
      # ==========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$RUNNER_TEMP/my-shop-source"

          mapfile -t PROJECT_DIRS < <(
            find "$SOURCE_ROOT" \
              -type f \
              -name "gradlew" \
              -printf '%h\n' \
              | sort -u
          )

          if [ "${#PROJECT_DIRS[@]}" -eq 0 ]; then
            echo "::error::No gradlew was found inside V57 source ZIP."
            echo "::error::The selected ZIP does not contain a complete Android project."
            exit 1
          fi

          VALID_PROJECTS=()

          for DIR in "${PROJECT_DIRS[@]}"; do
            if {
              [ -f "$DIR/settings.gradle" ] ||
              [ -f "$DIR/settings.gradle.kts" ]
            } && [ -d "$DIR/app" ]; then
              VALID_PROJECTS+=("$DIR")
            fi
          done

          if [ "${#VALID_PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one valid Android project."
            echo "Valid project directories:"
            printf '%s\n' "${VALID_PROJECTS[@]:-NONE}"
            exit 1
          fi

          PROJECT_DIR="${VALID_PROJECTS[0]}"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== ANDROID PROJECT ====="
          echo "$PROJECT_DIR"

          echo "===== PROJECT CONTENT ====="
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -200

      # ==========================================================
      # 5. VERIFY REQUIRED FILES
      # ==========================================================
      - name: Verify Android source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] &&
             [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::settings.gradle/settings.gradle.kts is missing."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "::error::app directory is missing."
            exit 1
          fi

          if [ ! -f "./app/build.gradle" ] &&
             [ ! -f "./app/build.gradle.kts" ]; then
            echo "::error::app Gradle build file is missing."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Android source structure VERIFIED."

      # ==========================================================
      # 6. JAVA 17
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 7. ANDROID SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================================
      # 8. GENERATE UNIQUE VERSION
      # ==========================================================
      - name: Generate unique application version
        shell: bash
        run: |
          set -euo pipefail

          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"

          VERSION_CODE=$((57000000 + RUN_NUMBER * 100 + RUN_ATTEMPT))
          VERSION_NAME="5.7.${RUN_NUMBER}.${RUN_ATTEMPT}"

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated versionCode is too large."
            exit 1
          fi

          echo "BUILD_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "versionCode = $VERSION_CODE"
          echo "versionName = $VERSION_NAME"

      # ==========================================================
      # 9. APPLY VERSION
      # ==========================================================
      - name: Apply generated version
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
            FILE_TYPE="groovy"
          elif [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
            FILE_TYPE="kotlin"
          else
            echo "::error::Application Gradle file not found."
            exit 1
          fi

          export BUILD_FILE FILE_TYPE

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["BUILD_FILE"])
          file_type = os.environ["FILE_TYPE"]

          code = os.environ["BUILD_VERSION_CODE"]
          name = os.environ["BUILD_VERSION_NAME"]

          text = path.read_text(encoding="utf-8")

          if file_type == "groovy":
              code_pattern = (
                  r'(?m)^(\s*versionCode\s+)\d+(\s*)$'
              )

              name_pattern = (
                  r'(?m)^(\s*versionName\s+)[\'"][^\'"]*[\'"](\s*)$'
              )
          else:
              code_pattern = (
                  r'(?m)^(\s*versionCode\s*=\s*)\d+(\s*)$'
              )

              name_pattern = (
                  r'(?m)^(\s*versionName\s*=\s*)[\'"][^\'"]*[\'"](\s*)$'
              )

          new_text, code_count = re.subn(
              code_pattern,
              lambda m: f"{m.group(1)}{code}{m.group(2)}",
              text
          )

          new_text, name_count = re.subn(
              name_pattern,
              lambda m: f'{m.group(1)}"{name}"{m.group(2)}',
              new_text
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "ERROR: Could not safely update exactly one "
                  f"versionCode/versionName. "
                  f"versionCode={code_count}, "
                  f"versionName={name_count}, "
                  f"file={path}"
              )

          path.write_text(new_text, encoding="utf-8")

          print(f"Updated: {path}")
          print(f"versionCode: {code}")
          print(f"versionName: {name}")
          PY

          echo "===== FINAL VERSION ====="
          grep -nE "versionCode|versionName" "$BUILD_FILE"

      # ==========================================================
      # 10. CLEAN
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 11. BUILD APK
      # ==========================================================
      - name: Build current V57 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 12. LOCATE EXACTLY ONE APK
      # ==========================================================
      - name: Locate exactly one APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          mapfile -t APKS < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK."
            echo "Found ${#APKS[@]} APK files:"
            printf '%s\n' "${APKS[@]:-NONE}"
            exit 1
          fi

          APK_PATH="${APKS[0]}"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "Generated APK:"
          echo "$APK_PATH"

      # ==========================================================
      # 13. VERIFY APK
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_PROJECT_DIR/$APK_PATH"

          APKANALYZER="$(
            find "$ANDROID_HOME" \
              -type f \
              -name apkanalyzer \
              | head -1
          )"

          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found."
            exit 1
          fi

          echo "===== APK PACKAGE ====="

          PACKAGE="$(
            "$APKANALYZER" \
              manifest application-id "$APK" |
              tail -1 |
              tr -d '\r'
          )"

          echo "Package: $PACKAGE"

          echo "===== APK VERSION ====="

          VERSION="$(
            "$APKANALYZER" \
              manifest version "$APK" |
              tr '\n' ' '
          )"

          echo "Version: $VERSION"

          if ! echo "$VERSION" |
            grep -Fq "$BUILD_VERSION_CODE"; then
            echo "::error::versionCode verification failed."
            exit 1
          fi

          if ! echo "$VERSION" |
            grep -Fq "$BUILD_VERSION_NAME"; then
            echo "::error::versionName verification failed."
            exit 1
          fi

          echo "APK VERSION VERIFICATION PASSED."

      # ==========================================================
      # 14. CREATE RELEASE
      # ==========================================================
      - name: Prepare verified release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "$ANDROID_PROJECT_DIR/$APK_PATH" \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.apk"

          sha256sum \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.apk" \
            > "release/MY-SHOP-${BUILD_VERSION_NAME}.sha256"

          echo "===== RELEASE ====="
          ls -lh release

          echo "===== SHA256 ====="
          cat \
            "release/MY-SHOP-${BUILD_VERSION_NAME}.sha256"

      # ==========================================================
      # 15. UPLOAD ONLY VERIFIED APK + CHECKSUM
      # ==========================================================
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-${{ env.BUILD_VERSION_NAME }}-APK
          path: |
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.apk
            release/MY-SHOP-${{ env.BUILD_VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
