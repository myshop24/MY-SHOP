name: V-90 MY SHOP FINAL RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: my-shop-v90-build
  cancel-in-progress: true

env:
  PRIMARY_SOURCE_ZIP: "V-90_MY_SHOP_FULL_PROJECT_SOURCE.zip"
  VERSION_NUMBER: "90"
  VERSION_NAME: "2.9.90"
  PACKAGE_NAME: "com.myshop.app"
  SOURCE_DIR: "v90_source"

jobs:
  build:
    name: V-90 - SINGLE VERIFIED APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lock repository to EXACT V-90 source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SOURCE_ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'V-*_MY_SHOP_FULL_PROJECT_SOURCE.zip' \
              | sort
          )

          if [ "${#SOURCE_ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE MY SHOP master source ZIP."
            echo "Found:"
            printf '%s\n' "${SOURCE_ZIPS[@]:-<none>}"
            exit 1
          fi

          ACTUAL_SOURCE="$(basename "${SOURCE_ZIPS[0]}")"

          if [ "$ACTUAL_SOURCE" != "$PRIMARY_SOURCE_ZIP" ]; then
            echo "::error::Wrong source ZIP detected."
            echo "Expected: $PRIMARY_SOURCE_ZIP"
            echo "Found:    $ACTUAL_SOURCE"
            exit 1
          fi

          test -s "$PRIMARY_SOURCE_ZIP"

          echo "======================================"
          echo "V-90 SOURCE LOCK PASSED"
          echo "Source: $PRIMARY_SOURCE_ZIP"
          echo "SHA256:"
          sha256sum "$PRIMARY_SOURCE_ZIP"
          echo "======================================"

      - name: Extract clean V-90 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR" release

          mkdir -p "$SOURCE_DIR"
          mkdir -p release

          unzip -q "$PRIMARY_SOURCE_ZIP" -d "$SOURCE_DIR"

      - name: Locate exactly ONE Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$SOURCE_DIR" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path '*/build/*' \
              | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE Android project."
            echo "Found: ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]:-<none>}"
            exit 1
          fi

          ROOT="$(dirname "${SETTINGS_FILES[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::App Gradle file not found."
            exit 1
          fi

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

          echo "Android root: $ROOT"
          echo "App Gradle: $APP_GRADLE"
          echo "Manifest: $MANIFEST"

      - name: Verify V-90 source identity
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"
          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"
          MANIFEST="${{ steps.project.outputs.manifest }}"

          grep -Eq \
            "applicationId[[:space:]]*['\"]com\.myshop\.app['\"]" \
            "$APP_GRADLE"

          grep -Eq \
            "versionCode[[:space:]]+90" \
            "$APP_GRADLE"

          grep -Eq \
            "versionName[[:space:]]+['\"]2\.9\.90['\"]" \
            "$APP_GRADLE"

          grep -Fq \
            'android:name=".LoginActivity"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.intent.action.MAIN"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.intent.category.LAUNCHER"' \
            "$MANIFEST"

          grep -Fq \
            'android:exported="true"' \
            "$MANIFEST"

          LOGIN="$ROOT/app/src/main/java/com/myshop/app/LoginActivity.java"

          test -s "$LOGIN"

          echo "V-90 SOURCE IDENTITY VERIFIED"

      - name: Verify dashboard source exists
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project.outputs.root }}"

          MAIN="$ROOT/app/src/main/java/com/myshop/app/MainActivity.java"

          test -s "$MAIN"

          grep -Fq "fitDashboardToScreen" "$MAIN"
          grep -Fq "buildDashboard" "$MAIN"

          test -s \
            "$ROOT/app/src/main/res/drawable/myshop_dashboard_reference.png"

          test -s \
            "$ROOT/app/src/main/res/drawable/myshop_dashboard_header.png"

          echo "V-90 DASHBOARD BASELINE VERIFIED"

      - name: Verify permanent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MY_SHOP_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || {
            echo "::error::Permanent keystore secret missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::Keystore password missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::Key alias missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::Key password missing."
            exit 1
          }

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/myshop-release.jks"

          test -s "$RUNNER_TEMP/myshop-release.jks"

          echo "PERMANENT SIGNING KEY VERIFIED"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply and verify V-90 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s, n1 = re.subn(
              r'(\bversionCode\s+)\d+',
              r'\g<1>90',
              s,
              count=1
          )

          s, n2 = re.subn(
              r'(\bversionName\s+)[\'"][^\'"]*[\'"]',
              r"\g<1>'2.9.90'",
              s,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"V-90 version replacement failed: "
                  f"versionCode={n1}, versionName={n2}"
              )

          p.write_text(s, encoding="utf-8")
          PY

          grep -Eq \
            'versionCode[[:space:]]+90' \
            "$APP_GRADLE"

          grep -Eq \
            "versionName[[:space:]]+['\"]2\.9\.90['\"]" \
            "$APP_GRADLE"

          echo "VERSION CODE = 90"
          echo "VERSION NAME = 2.9.90"

      - name: Build release APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app/build/outputs/apk/release

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew

            ./gradlew clean assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          else
            gradle clean assembleRelease \
              --no-daemon \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          fi

          mapfile -t APKS < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected EXACTLY ONE release APK."
            echo "Found: ${#APKS[@]}"
            printf '%s\n' "${APKS[@]:-<none>}"
            exit 1
          fi

          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign V-90 APK with permanent key
        id: signed
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_SHOP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_SHOP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          UNSIGNED="${{ steps.apk.outputs.path }}"
          ALIGNED="$RUNNER_TEMP/MY_SHOP_V90_ALIGNED.apk"
          SIGNED="$RUNNER_TEMP/MY_SHOP_V90_FINAL.apk"

          "$BT/zipalign" \
            -f -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/myshop-release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose "$SIGNED"

          BADGING="$("$BT/aapt2" dump badging "$SIGNED")"

          echo "$BADGING"

          echo "$BADGING" | grep -Fq \
            "package: name='com.myshop.app'"

          echo "$BADGING" | grep -Fq \
            "versionName='2.9.90'"

          echo "$BADGING" | grep -Fq \
            "versionCode='90'"

          echo "$BADGING" | grep -Fq \
            "launchable-activity: name='com.myshop.app.LoginActivity'"

          echo "signed_path=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Prepare exactly ONE V-90 APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          FINAL="release/V-90 MY SHOP FINAL RELEASE.apk"
          SHA="release/V-90 MY SHOP FINAL RELEASE.sha256"

          cp \
            "${{ steps.signed.outputs.signed_path }}" \
            "$FINAL"

          sha256sum "$FINAL" > "$SHA"

          COUNT="$(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d " "
          )"

          test "$COUNT" -eq 1
          test -s "$FINAL"
          test -s "$SHA"

          echo "FINAL APK:"
          ls -lh "$FINAL"

          echo "CHECKSUM:"
          cat "$SHA"

      - name: Runtime launch and dashboard smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true

          script: |
            set -euo pipefail

            APK="release/V-90 MY SHOP FINAL RELEASE.apk"

            adb uninstall "$PACKAGE_NAME" \
              >/dev/null 2>&1 || true

            adb install "$APK"

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "$PACKAGE_NAME/.LoginActivity"

            sleep 5

            PID="$(adb shell pidof "$PACKAGE_NAME" || true)"

            if [ -z "$PID" ]; then
              echo "::error::MY SHOP failed to remain running after launch."

              adb logcat -d -t 2000 \
                | grep -E \
                "AndroidRuntime|FATAL EXCEPTION|com.myshop.app" \
                || true

              exit 1
            fi

            echo "LOGIN LAUNCH PASSED"

            adb shell am start -W \
              -n "$PACKAGE_NAME/.MainActivity" \
              || {
                echo "::error::Dashboard activity failed to launch."

                adb logcat -d -t 2000 \
                  | grep -E \
                  "AndroidRuntime|FATAL EXCEPTION|com.myshop.app" \
                  || true

                exit 1
              }

            sleep 5

            PID="$(adb shell pidof "$PACKAGE_NAME" || true)"

            if [ -z "$PID" ]; then
              echo "::error::MY SHOP dashboard did not remain running."

              adb logcat -d -t 2500 \
                | grep -E \
                "AndroidRuntime|FATAL EXCEPTION|com.myshop.app" \
                || true

              exit 1
            fi

            echo "DASHBOARD LAUNCH PASSED"
            echo "V-90 RUNTIME SMOKE TEST PASSED"

      - name: Upload ONLY V-90 APK
        uses: actions/upload-artifact@v4
        with:
          name: V-90-MY-SHOP-FINAL-RELEASE
          path: release/V-90 MY SHOP FINAL RELEASE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload V-90 checksum
        uses: actions/upload-artifact@v4
        with:
          name: V-90-MY-SHOP-CHECKSUM
          path: release/V-90 MY SHOP FINAL RELEASE.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Final V-90 guard
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l \
              | tr -d " "
          )"

          test "$COUNT" -eq 1

          test -s \
            "release/V-90 MY SHOP FINAL RELEASE.apk"

          test -s \
            "release/V-90 MY SHOP FINAL RELEASE.sha256"

          echo "======================================"
          echo "V-90 FINAL CHECK PASSED"
          echo "Exactly ONE signed APK exists."
          echo "Version: 2.9.90"
          echo "Version Code: 90"
          echo "Package: com.myshop.app"
          echo "Source: V-90_MY_SHOP_FULL_PROJECT_SOURCE.zip"
          echo "======================================"
