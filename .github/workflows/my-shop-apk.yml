name: MY SHOP AUTO VERSION APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_ID: com.myshop.app
  BASE_VERSION_NAME: "2.9"

jobs:
  build:
    name: MY SHOP AUTO VERSION APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. AUTOMATIC VERSION
      # ============================================================
      - name: Generate automatic version
        shell: bash
        run: |
          set -euo pipefail

          # GitHub run number increases automatically on every workflow run.
          VERSION_CODE="$GITHUB_RUN_NUMBER"

          VERSION_NAME="${BASE_VERSION_NAME}.${GITHUB_RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "============================================"
          echo "AUTOMATIC VERSION"
          echo "============================================"
          echo "Version Code : $VERSION_CODE"
          echo "Version Name : $VERSION_NAME"
          echo "============================================"

      # ============================================================
      # 5. FIND LATEST SOURCE ZIP AUTOMATICALLY
      # ============================================================
      - name: Find latest MY SHOP source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for MY SHOP V-XX source ZIP files..."

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -printf '%f\n' |
            grep -Ei '^V-[0-9]+.*\.zip$|^V_[0-9]+.*\.zip$|^V[0-9]+.*\.zip$' |
            sort -V
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No MY SHOP V-XX ZIP file found."
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[-1]}"

          if [ ! -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]; then
            echo "ERROR: Selected ZIP does not exist:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo
          echo "All detected ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          echo
          echo "============================================"
          echo "SELECTED SOURCE ZIP"
          echo "============================================"
          echo "$SOURCE_ZIP"
          ls -lh "$GITHUB_WORKSPACE/$SOURCE_ZIP"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract MY SHOP source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$GITHUB_WORKSPACE/$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Source extracted successfully."

      # ============================================================
      # 7. LOCATE EXACTLY ONE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -print | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE settings.gradle(.kts)."
            echo "Found: ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          SETTINGS_FILE="${SETTINGS_FILES[0]}"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 8. PROJECT STRUCTURE
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f settings.gradle ]; then
            echo "settings.gradle found."
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts found."
          else
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ -f build.gradle ]; then
            echo "build.gradle found."
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts found."
          else
            echo "ERROR: Root build.gradle(.kts) missing."
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            BUILD_FILE="app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            BUILD_FILE="app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          echo "BUILD_FILE=$PROJECT_DIR/$BUILD_FILE
