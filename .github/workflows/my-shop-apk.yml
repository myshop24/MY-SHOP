name: V-82 MY SHOP FINAL RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PRIMARY_SOURCE_ZIP: V-77_MY_SHOP_FULL_SOURCE.zip
  VERSION_CODE: "82"
  VERSION_NAME: "2.9.82"
  SOURCE_DIR: v82_source
  APK_NAME: V-82-MY-SHOP-FINAL.apk

jobs:
  build:
    name: V-82 - SINGLE VERIFIED APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select one official source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PRIMARY_SOURCE_ZIP" ]; then
            echo "::error::Required source ZIP not found:"
            echo "$PRIMARY_SOURCE_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using ONLY:"
          echo "$PRIMARY_SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR" release
          mkdir -p "$SOURCE_DIR" release

          unzip -q "$PRIMARY_SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "Source extracted successfully."

      - name: Locate exactly one Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find "$SOURCE_DIR" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE Android project."
            echo "Found: ${#SETTINGS_FILES[@]}"
            printf '%s\n' "${SETTINGS_FILES[@]:-<none>}"
            exit 1
          fi

          ROOT="$(dirname "${SETTINGS_FILES[0]}")"

          if [ -f "$ROOT/app/build.gradle" ]; then
            APP_GRADLE="$ROOT/app/build.gradle"
          elif [ -f "$ROOT/app/build.gradle.kts" ]; then
            APP_GRADLE="$ROOT/app/build.gradle.kts"
          else
            echo "::error::app Gradle file not found."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "app_gradle=$APP_GRADLE" >> "$GITHUB_OUTPUT"

          echo "Android project:"
          echo "$ROOT"

          echo "App Gradle:"
          echo "$APP_GRADLE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply V-82 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if path.suffix == ".kts":
              text = re.sub(
                  r'versionCode\s*=\s*\d+',
                  'versionCode = 82',
                  text
              )

              text = re.sub(
                  r'versionName\s*=\s*["\'][^"\']*["\']',
                  'versionName = "2.9.82"',
                  text
              )

          else:
              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 82',
                  text
              )

              text = re.sub(
                  r'versionName\s+["\'][^"\']*["\']',
                  'versionName "2.9.82"',
                  text
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "V-82 version applied."

      - name: Verify V-82 version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="${{ steps.project.outputs.app_gradle }}"

          grep -Eq \
            'versionCode[[:space:]]*(=)?[[:space:]]*82' \
            "$APP_GRADLE" || {
              echo "::error::versionCode 82 not found."
              exit 1
            }

          grep -Eq \
            'versionName[[:space:]]*(=)?[[:space:]]*"2\.9\.82"' \
            "$APP_GRADLE" || {
              echo "::error::versionName 2.9.82 not found."
              exit 1
            }

          echo "V-82 VERSION CHECK PASSED"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean project
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build DEBUG APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find exactly one APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APK_FILES < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE APK."
            echo "Found: ${#APK_FILES[@]}"
            printf '%s\n' "${APK_FILES[@]:-<none>}"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "${APK_FILES[0]}" \
            "$GITHUB_WORKSPACE/release/$APK_NAME"

          echo "APK=$GITHUB_WORKSPACE/release/$APK_NAME" >> "$GITHUB_OUTPUT"

          echo "ONE APK FOUND:"
          echo "${APK_FILES[0]}"

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="release/$APK_NAME"

          test -s "$APK"

          echo "APK created:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="release/$APK_NAME"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK SIGNATURE VERIFIED"

      - name: Verify package name
        shell: bash
        run: |
          set -euo pipefail

          APK="release/$APK_NAME"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          PACKAGE="$(
            "$AAPT" dump badging "$APK" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          echo "Detected package:"
          echo "$PACKAGE"

          if [ "$PACKAGE" != "com.myshop.app" ]; then
            echo "::error::Wrong package name: $PACKAGE"
            exit 1
          fi

          echo "PACKAGE CHECK PASSED"

      - name: Verify launcher activity
        shell: bash
        run: |
          set -euo pipefail

          APK="release/$APK_NAME"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep -q "launchable-activity" || {
            echo "::error::No launchable activity found."
            exit 1
          }

          echo "LAUNCHER ACTIVITY FOUND"

      - name: Verify exactly one final APK
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Final APK count is $COUNT."
            echo "Expected exactly ONE APK."
            exit 1
          fi

          test -s "release/$APK_NAME"

          echo "FINAL V-82 CHECK PASSED"
          echo "Exactly ONE APK exists."

      - name: Upload V-82 final APK
        uses: actions/upload-artifact@v4
        with:
          name: V-82-MY-SHOP-FINAL-APK
          path: release/V-82-MY-SHOP-FINAL.apk
          if-no-files-found: error
          retention-days: 30
