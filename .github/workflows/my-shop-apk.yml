name: MY SHOP STABLE PERMANENT MASTER V-225

on:
  push:
    branches: [main]
    paths:
      - 'V-*.zip'
      - '.github/workflows/my-shop-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MYSHOP_BACKEND_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev
  WORKER_URL: https://rapid-bush-62ea.myshopsatkania.workers.dev

jobs:
  verify-deploy-build:
    name: VERIFY → WORKER → APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Master workflow safety guard
        shell: bash
        run: |
          set -euo pipefail

          F1="$(printf '%b' '\x67\x6f\x6f\x67\x6c\x65[[:space:]]*\x64\x72\x69\x76\x65')"
          F2="$(printf '%b' '\x62\x61\x63\x6b\x75\x70[[:space:]]+\x73\x6f\x75\x72\x63\x65[[:space:]]+\x7a\x69\x70')"
          F3="$(printf '%b' '\x65\x78\x74\x65\x72\x6e\x61\x6c-\x62\x61\x63\x6b\x75\x70')"
          F4="$(printf '%b' '\x47\x44\x52\x49\x56\x45_')"

          if grep -RniE "$F1|$F2|$F3|$F4" \
            .github/workflows \
            --include='*.yml' \
            --include='*.yaml'; then
            echo 'ERROR: Forbidden external backup logic exists in the repository. BUILD STOP.'
            exit 1
          fi

          test -f .github/workflows/my-shop-apk.yml
          ! grep -nE '^[[:space:]]*printf .*MYSHOP_HEALTH_PROBE_KEY.*wrangler.*secret[[:space:]]+put|^[[:space:]]*npx .*wrangler[^\n]*[[:space:]]+secret[[:space:]]+put' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow still contains deprecated wrangler secret put deployment logic. BUILD STOP'; exit 1; }
          grep -Fq 'versions upload' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing versions upload. BUILD STOP'; exit 1; }
          grep -Fq -- '--secrets-file' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing same-version secret deployment. BUILD STOP'; exit 1; }
          grep -Fq 'versions deploy' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing versions deploy. BUILD STOP'; exit 1; }
          grep -Fq 'WORKER_VERSION_ID' .github/workflows/my-shop-apk.yml || { echo 'ERROR: Master workflow missing immutable Version-ID promotion. BUILD STOP'; exit 1; }
          echo 'MASTER WORKFLOW SAFETY GUARD PASSED'

      - name: Select newest V-numbered source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name 'V-*.zip' -printf '%f\n' | sort)
          test "${#ZIPS[@]}" -gt 0 || {
            echo 'ERROR: No root V-*.zip source package found.'
            exit 1
          }

          # Old V files are allowed to remain. Only the highest V is eligible.
          # If the highest V exists more than once, choose the most recently
          # committed/uploaded file; never fail merely because an older copy remains.
          BEST_VERSION=-1
          BEST_NAME=''
          BEST_TIME=-1

          for FILE in "${ZIPS[@]}"; do
            [[ "$FILE" =~ ^V-([0-9]+)-.+\.zip$ ]] || continue
            N=$((10#${BASH_REMATCH[1]}))
            T="$(git log -1 --format=%ct -- "$FILE" 2>/dev/null || true)"
            [[ "$T" =~ ^[0-9]+$ ]] || T=0

            if (( N > BEST_VERSION )) || \
               (( N == BEST_VERSION && T > BEST_TIME )) || \
               { (( N == BEST_VERSION && T == BEST_TIME )) && [[ "$FILE" > "$BEST_NAME" ]]; }; then
              BEST_VERSION="$N"
              BEST_NAME="$FILE"
              BEST_TIME="$T"
            fi
          done

          test "$BEST_VERSION" -ge 207 || {
            echo "ERROR: Highest source is V-$BEST_VERSION; V-207 or newer is required."
            exit 1
          }

          test -n "$BEST_NAME" || {
            echo 'ERROR: Could not select a V-numbered source ZIP.'
            exit 1
          }

          SOURCE_ZIP="$BEST_NAME"
          SOURCE_VERSION="$BEST_VERSION"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"
          echo "Selected current source: $SOURCE_ZIP (V-$SOURCE_VERSION, commit=$BEST_TIME)"

      - name: Extract exact source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source release
          mkdir -p source release
          unzip -q "$SOURCE_ZIP" -d source
          BUILD_ID_FILE="$(find source -type f -name SOURCE_BUILD_ID.txt -print -quit)"
          test -n "$BUILD_ID_FILE" || { echo 'ERROR: SOURCE_BUILD_ID.txt not found'; exit 1; }
          grep -Fqx "MY SHOP V-$SOURCE_VERSION" "$BUILD_ID_FILE"
          ROOT_SOURCE="$(dirname "$BUILD_ID_FILE")"
          test -f "$ROOT_SOURCE/app/build.gradle" || test -f "$ROOT_SOURCE/app/build.gradle.kts" || { echo 'ERROR: Source root has no app Gradle file'; exit 1; }
          test -f "$ROOT_SOURCE/backend/worker/src/index.js" || { echo 'ERROR: Source root has no Worker source'; exit 1; }
          APP_GRADLE="$(find "$ROOT_SOURCE/app" -maxdepth 1 -type f -name 'build.gradle*' -print -quit)"
          python3 - "$APP_GRADLE" "$SOURCE_VERSION" <<'PY'
          import re,sys
          p,ver=sys.argv[1],int(sys.argv[2]); s=open(p,encoding='utf-8').read()
          m=re.search(r'\bversionCode\s+(\d+)',s); assert m and int(m.group(1))==ver, 'ERROR: Source versionCode mismatch; BUILD STOP'
          m=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]",s); assert m and m.group(1)==f'2.9.{ver}', 'ERROR: Source versionName mismatch; BUILD STOP'
          PY
          echo "SOURCE_ROOT=$ROOT_SOURCE" >> "$GITHUB_ENV"

      - name: Validate selected source package (MASTER WORKFLOW IS ROOT-ONLY)
        shell: bash
        run: |
          set -euo pipefail
          # The repository-root workflow is the only workflow executed by GitHub Actions.
          # A source ZIP may contain an older workflow; it is never copied over the root
          # workflow and is never allowed to change the build logic. This makes the master
          # workflow permanent across future V-numbered source packages.
          ! grep -RniE '^[[:space:]]*git[[:space:]]+(push|commit)[[:space:]].*workflow|^[[:space:]]*git[[:space:]]+push[[:space:]]+origin[[:space:]]+HEAD:main' source --include='*.yml' --include='*.yaml' || {
            echo 'ERROR: Source package attempts to self-push workflow files. BUILD STOP'
            exit 1
          }
          echo 'SOURCE PACKAGE VALIDATED. ROOT MASTER WORKFLOW REMAINS AUTHORITATIVE.'

      - name: Locate Android + Worker project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find source -type f -name 'settings.gradle' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find source -type f -name 'settings.gradle.kts' -print -quit)"
          fi
          test -n "$SETTINGS" || { echo 'ERROR: Android settings file not found.'; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || test -f "$PROJECT/app/build.gradle.kts" || { echo 'ERROR: app Gradle file not found.'; exit 1; }
          test -f "$PROJECT/backend/worker/wrangler.toml" || { echo 'ERROR: Worker wrangler.toml not found.'; exit 1; }
          test -f "$PROJECT/backend/worker/src/index.js" || { echo 'ERROR: Worker source not found.'; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Lock app version, backend version, URL and permanent bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT/app/build.gradle" "$SOURCE_VERSION" "$MYSHOP_BACKEND_URL" <<'PY'
          import re,sys
          path,ver,url=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=open(path,encoding='utf-8').read()
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {ver}',s,count=1)
          s=re.sub(r'\bversionName\s+["\'][^"\']+["\']',f"versionName '2.9.{ver}'",s,count=1)
          s=re.sub(r'^[ \t]*buildConfigField\s+.*MYSHOP_BACKEND_URL.*\n?','',s,flags=re.M)
          m=re.search(r'\bdefaultConfig\s*\{',s); assert m,'defaultConfig not found'
          field=f"        buildConfigField 'String', 'MYSHOP_BACKEND_URL', '\"{url}\"'\n"
          s=s[:m.end()]+'\n'+field+s[m.end():]
          open(path,'w',encoding='utf-8').write(s)
          PY
          python3 - "$PROJECT/backend/worker/src/index.js" "$SOURCE_VERSION" <<'PY'
          import re,sys
          path,ver=sys.argv[1],int(sys.argv[2])
          s=open(path,encoding='utf-8').read()
          s,n=re.subn(r"version:'2\.9\.\d+',build:'V-\d+'",f"version:'2.9.{ver}',build:'V-{ver}'",s,count=1)
          assert n==1,'Worker /health version marker not found'
          open(path,'w',encoding='utf-8').write(s)
          PY
          TOML="$PROJECT/backend/worker/wrangler.toml"
          grep -Fq 'name = "rapid-bush-62ea"' "$TOML"
          grep -Fq 'database_name = "my-shop-db"' "$TOML"
          grep -Fq 'database_id = "15b6acd2-0e82-4bd8-95fb-bee6fc08936c"' "$TOML"
          grep -Fq 'binding = "MEDIA"' "$TOML"
          grep -Fq 'bucket_name = "my-shop-media"' "$TOML"
          grep -Fq '"/v1/feed"' "$PROJECT/backend/worker/src/index.js" || grep -Fq "'/v1/feed'" "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'avatar_object_key' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'PROFILE_UPDATE_FAILED' "$PROJECT/backend/worker/src/index.js"
          node --check "$PROJECT/backend/worker/src/index.js"
          BUILD_ID_FILE="$(find "$PROJECT" -type f -name SOURCE_BUILD_ID.txt -print -quit)"
          test -n "$BUILD_ID_FILE" || { echo 'ERROR: SOURCE_BUILD_ID.txt not found after source extraction'; exit 1; }
          grep -Fqx "MY SHOP V-$SOURCE_VERSION" "$BUILD_ID_FILE"
          echo "SOURCE_VERSION=$SOURCE_VERSION locked"
          echo "SOURCE BUILD LOCK PASSED: ZIP=$SOURCE_ZIP | SOURCE_BUILD_ID=V-$SOURCE_VERSION | Android=2.9.$SOURCE_VERSION | Worker=V-$SOURCE_VERSION"

      - name: Verify MY SHOP instruction safety before deploy
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'AdminSectionActivity' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'getBooleanExtra("admin_context",false)' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'putExtra("admin_context",true)' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'putExtra("admin_context",true)' "$PROJECT/app/src/main/java/com/myshop/app/AdminHubActivity.java"
          grep -Fq 'SOCIAL MEDIA' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SHARE APP' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'CUSTOMER SUPPORT' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SHARE APP' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'HELP & SUPPORT' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'SOCIAL MEDIA' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'Search' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq '🌎' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          ! grep -Fq 'globe.setBackground(round(RED' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'openSupport' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'threeLineMenu' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'SAVE / EDIT' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'extTitle' "$PROJECT/app/src/main/java/com/myshop/app/AdminSectionActivity.java"
          grep -Fq 'normalizePlatformTarget' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'menu_language' "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java"
          grep -Fq 'R.drawable.nav_home' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_store' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_live' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_support' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'R.drawable.nav_more' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'ACTION_GET_CONTENT' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'ensureSchemasOnce(env)' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'normalizeWhatsApp' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'renderMore' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'R2_VERIFY_FAILED' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'adminBannerUpload' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'notificationsList' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'notificationsReadAll' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'ensureNotificationSchema' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'createUserNotification' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'NOTIFICATION_DB_WRITE_FAILED' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'assertContentSchema' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'D1_SCHEMA_REPAIR_FAILED' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'myshop_schema_meta' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'V-192 permanent legacy-banner repair' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'd1WriteProbe' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'r2WriteProbe' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'contentWriteSuite' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'D1_WRITE_READY_FAILED' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'onResume' "$PROJECT/app/src/main/java/com/myshop/app/NotificationActivity.java"
          grep -Fq 'Facebook' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'YouTube' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'Instagram' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'Telegram' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'Customer Support' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'Share MY SHOP' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          grep -Fq 'commentCount' "$PROJECT/app/src/main/java/com/myshop/app/MainActivity.java"
          grep -Fq 'comment_count' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'INSERT INTO notification_reads' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'SELECT id FROM banner_media WHERE folder=? AND slot=?' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'section' "$PROJECT/backend/worker/src/index.js"
          grep -Fq 'position' "$PROJECT/backend/worker/src/index.js"
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE|DELETE[[:space:]]+FROM[[:space:]]+myshop_auth_users_v108' "$PROJECT/backend/worker/src" >/dev/null
          echo 'INSTRUCTION + DATA SAFETY GUARDS PASSED'

      - name: Preflight Java context-safety guard
        shell: bash
        run: |
          set -euo pipefail
          # Inside anonymous Android callbacks, `this` is the callback object, not the Activity.
          # Catch the known failure pattern before Gradle compilation so future builds fail early
          # with a clear message instead of the cryptic Intent constructor error.
          if grep -RFn --include='*.java' 'new Intent(this,FeatureActivity.class)' "$PROJECT/app/src/main/java"; then
            echo 'ERROR: Unsafe FeatureActivity Intent context found. Use FeatureActivity.this.'
            exit 1
          fi
          if grep -RFn --include='*.java' 'new Intent(this, FeatureActivity.class)' "$PROJECT/app/src/main/java"; then
            echo 'ERROR: Unsafe FeatureActivity Intent context found. Use FeatureActivity.this.'
            exit 1
          fi
          grep -Fq 'new Intent(FeatureActivity.this,FeatureActivity.class)' "$PROJECT/app/src/main/java/com/myshop/app/FeatureActivity.java"
          echo 'JAVA CONTEXT-SAFETY GUARD PASSED'
          # Legacy-D1 compatibility: mutable content writes must not rely on a UNIQUE
          # constraint that may not exist in an older database created before V-171.
          ! grep -Fq 'INSERT INTO banner_media(folder,slot,object_key,updated_at) VALUES(?,?,?,CURRENT_TIMESTAMP) ON CONFLICT(folder,slot)' "$PROJECT/backend/worker/src/index.js"
          ! grep -Fq 'INSERT INTO social_links(platform,url,icon_key,active) VALUES(?,?,?,?) ON CONFLICT(platform)' "$PROJECT/backend/worker/src/index.js"
          echo 'LEGACY-D1 WRITE COMPATIBILITY GUARD PASSED'

      - name: Preflight callback-context safety guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT/app/src/main/java/com/myshop/app/UserMenuActivity.java" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          start=s.find('private void loadDynamicMenu(')
          end=s.find('private void addDynamic(', start)
          assert start>=0 and end>start, 'ERROR: loadDynamicMenu block not found'
          block=s[start:end]
          assert 'LanguageManager.showPicker(this' not in block, 'ERROR: Callback Context bug in loadDynamicMenu: use UserMenuActivity.this'
          print('CALLBACK CONTEXT SAFETY GUARD PASSED')
          PY

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'ERROR: Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'ERROR: Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${MYSHOP_HEALTH_PROBE_KEY:-}" || { echo 'ERROR: Missing MYSHOP_HEALTH_PROBE_KEY; BUILD STOP'; exit 1; }

      - name: Deploy the SAME verified Worker source
        working-directory: ${{ env.PROJECT }}/backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Permanent deployment rule: upload the exact verified source and its
          # secret together, capture the Version ID directly from Wrangler's
          # structured ND-JSON output, then promote that immutable ID to 100%.
          # We deliberately do NOT call `versions list` to discover the new version:
          # Cloudflare documents that Version tags in `versions list` are optional.
          WORKER_VERSION_TAG="my-shop-v-${SOURCE_VERSION}-run-${GITHUB_RUN_ID}"
          WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-upload.ndjson
          export WRANGLER_OUTPUT_FILE_PATH
          rm -f "$WRANGLER_OUTPUT_FILE_PATH" /tmp/worker-version-id.txt /tmp/worker-deployment-status.raw

          python3 - <<'PY'
          import json,os
          with open('/tmp/myshop-secrets.json','w',encoding='utf-8') as f:
              json.dump({'MYSHOP_HEALTH_PROBE_KEY': os.environ['MYSHOP_HEALTH_PROBE_KEY']}, f)
          PY

          npx --yes wrangler@4.128.0 versions upload --config wrangler.toml --tag "$WORKER_VERSION_TAG" --message "MY SHOP V-$SOURCE_VERSION run $GITHUB_RUN_ID" --secrets-file /tmp/myshop-secrets.json
          rm -f /tmp/myshop-secrets.json

          # WRANGLER_OUTPUT_FILE_PATH is documented as ND-JSON. Read every JSON
          # line recursively and accept only a unique Worker Version ID. This is
          # independent of optional tags, list ordering, warning text, or payload shape.
          python3 <<'PY'
          import json,re,sys,uuid
          path='/tmp/wrangler-upload.ndjson'
          raw=open(path,encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          records=[]
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              try:
                  records.append(json.loads(line))
              except json.JSONDecodeError:
                  continue
          if not records:
              raise SystemExit('ERROR: Wrangler structured output is empty or invalid')

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj,list):
                  for value in obj:
                      yield from walk(value)

          ids=[]
          for record in records:
              for item in walk(record):
                  for key in ('version_id','versionId'):
                      value=item.get(key) if isinstance(item,dict) else None
                      if isinstance(value,str):
                          try:
                              uuid.UUID(value)
                          except ValueError:
                              continue
                          ids.append(value)

          unique=[]
          for value in ids:
              if value not in unique:
                  unique.append(value)

          if len(unique)!=1:
              print('WRANGLER STRUCTURED OUTPUT:')
              print(raw)
              raise SystemExit(f'ERROR: Expected exactly one uploaded Worker Version ID in Wrangler structured output; found {len(unique)}: {unique}')

          vid=unique[0]
          open('/tmp/worker-version-id.txt','w',encoding='utf-8').write(vid)
          print('EXACT UPLOADED WORKER VERSION ID:',vid)
          PY

          WORKER_VERSION_ID="$(cat /tmp/worker-version-id.txt)"
          test -n "$WORKER_VERSION_ID"

          # Cloudflare's documented non-interactive form accepts VERSION-ID@100%.
          # V-224 proved that deployment metadata can report 100% while the public
          # Worker endpoint is still serving the previous version. V-225 therefore
          # treats the REAL /health response as the final promotion authority.
          # It redeploys the same immutable Version ID and polls the live endpoint
          # with cache-busting headers until the exact V-number is actually served.
          promoted=false
          for attempt in 1 2 3 4 5; do
            echo "PROMOTION ATTEMPT $attempt/5: $WORKER_VERSION_ID@100%"
            WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-deploy.ndjson \
              npx --yes wrangler@4.128.0 versions deploy --config wrangler.toml "${WORKER_VERSION_ID}@100%" --message "MY SHOP V-$SOURCE_VERSION run $GITHUB_RUN_ID ACTIVE-VERIFY-PROMOTE 100%" -y

            npx --yes wrangler@4.128.0 deployments status --config wrangler.toml --json > /tmp/worker-deployment-status.raw || true

            LIVE_OK=false
            for live_try in $(seq 1 20); do
              LIVE_STATUS="$(curl --silent --show-error --output /tmp/live-health.json --write-out '%{http_code}' \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WORKER_URL/health?deploy_check=${GITHUB_RUN_ID}-${attempt}-${live_try}-$(date +%s%N)" || true)"

              if [ "$LIVE_STATUS" = "200" ]; then
                if python3 - "$SOURCE_VERSION" <<'PY'
          import json,sys
          v=int(sys.argv[1])
          try:
              h=json.load(open('/tmp/live-health.json',encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          ok=(h.get('ok') is True and h.get('version')==f'2.9.{v}' and h.get('build')==f'V-{v}')
          if ok:
              print('LIVE PRODUCTION VERSION VERIFIED:',f'V-{v}')
          raise SystemExit(0 if ok else 1)
          PY
                then
                  LIVE_OK=true
                  break
                fi
              fi
              echo "LIVE endpoint still serves an older/unverified Worker (HTTP $LIVE_STATUS); waiting 3s..."
              sleep 3
            done

            if [ "$LIVE_OK" = true ]; then
              promoted=true
              cp /tmp/live-health.json /tmp/promoted-health.json
              echo "CLOUDFLARE LIVE ENDPOINT VERIFIED: exact source V-$SOURCE_VERSION is active"
              break
            fi
            echo "PROMOTION ATTEMPT $attempt did not reach the live endpoint; redeploying the SAME immutable Version ID."
            sleep 5
          done
          test "$promoted" = true || { echo 'ERROR: Exact uploaded Worker Version ID was not observed on the live /health endpoint after 5 promotion attempts; BUILD STOP'; exit 1; }

          # Deployment metadata is supporting evidence only. The live endpoint above
          # is the release-blocking proof that production really switched versions.
          python3 - "$WORKER_VERSION_ID" <<'PY'
          import json,sys,re
          target=sys.argv[1]
          raw=open('/tmp/worker-deployment-status.raw',encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          if not raw.strip():
              print('WARNING: Deployment status output was empty; live endpoint already verified exact version.')
              raise SystemExit(0)
          decoder=json.JSONDecoder()
          data=None
          for i,ch in enumerate(raw):
              if ch not in '[{':
                  continue
              try:
                  data,_=decoder.raw_decode(raw[i:])
                  break
              except json.JSONDecodeError:
                  continue
          if data is None:
              print('WARNING: Deployment status JSON could not be parsed; live endpoint already verified exact version.')
              raise SystemExit(0)
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj,list):
                  for value in obj:
                      yield from walk(value)
          found=False
          for item in walk(data):
              vid=item.get('version_id') or item.get('id') or item.get('versionId')
              if vid==target:
                  found=True
                  break
          print('DEPLOYMENT STATUS CONTAINS TARGET VERSION:',found)
          raise SystemExit(0)
          PY
          echo "EXACT WORKER VERSION LIVE: $WORKER_VERSION_TAG ($WORKER_VERSION_ID)"

      - name: Write immutable build source manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$SOURCE_ZIP" > release/source-zip.sha256
          printf 'V-%s\n%s\n%s\n' "$SOURCE_VERSION" "$SOURCE_ZIP" "$(cat "$SOURCE_ZIP" | sha256sum | awk '{print $1}')" > release/BUILD_SOURCE_ID.txt

      - name: Verify ACTIVE production Worker before APK build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/cloudflare
          # Preserve non-200 response bodies for diagnostics and tolerate only short
          # propagation windows. The JSON version check below still rejects older V-numbers.
          probe() {
            local url="$1" out="$2"
            local i status
            for i in $(seq 1 20); do
              status="$(curl --silent --show-error --output "$out.tmp" --write-out '%{http_code}' "$url" || true)"
              cp "$out.tmp" "$out"
              if [ "$status" = "200" ]; then return 0; fi
              sleep 3
            done
            echo "ERROR: Worker probe did not return HTTP 200: $url"
            cat "$out" || true
            return 1
          }
          LIVE_HEALTH_URL="$WORKER_URL/health?release_check=${GITHUB_RUN_ID}-$(date +%s%N)"
          status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            "$LIVE_HEALTH_URL" || true)"
          test "$status" = "200" || { echo "ERROR: Active Worker /health returned HTTP $status"; cat /tmp/health.json || true; exit 1; }
          cp /tmp/health.json release/cloudflare/health.json
          probe "$WORKER_URL/health/deep" /tmp/deep.json
          cp /tmp/deep.json release/cloudflare/deep-health.json
          probe "$WORKER_URL/v1/dashboard/config" /tmp/dashboard.json
          cp /tmp/dashboard.json release/cloudflare/dashboard.json
          python3 - "$SOURCE_VERSION" <<'PY'
          import json,sys
          v=int(sys.argv[1])
          h=json.load(open('/tmp/health.json'))
          d=json.load(open('/tmp/deep.json'))
          c=json.load(open('/tmp/dashboard.json'))
          assert h.get('ok') is True, 'Worker /health failed'
          assert h.get('version')==f'2.9.{v}' and h.get('build')==f'V-{v}', f'WRONG ACTIVE WORKER: {h}'
          assert d.get('ok') is True and d.get('database')=='ok' and d.get('d1Write')=='ok' and d.get('schema')=='ok' and d.get('r2')=='ok' and d.get('r2Write')=='ok', f'D1/R2 READ+WRITE deep health failed: {d}'
          assert not c.get('error'), f'Dashboard config failed: {c}'
          print('ACTIVE WORKER VERIFIED:',f'V-{v}')
          PY

      - name: Run ACTIVE Worker content write suite (RELEASE BLOCKING)
        env:
          MYSHOP_HEALTH_PROBE_KEY: ${{ secrets.MYSHOP_HEALTH_PROBE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MYSHOP_HEALTH_PROBE_KEY:-}" || { echo 'ERROR: MYSHOP_HEALTH_PROBE_KEY is not configured. BUILD STOP'; exit 1; }
          curl --silent --show-error --retry 5 --retry-delay 2 --output /tmp/content-suite.json --write-out "%{http_code}" -H "X-MYSHOP-HEALTH-KEY: $MYSHOP_HEALTH_PROBE_KEY" "$WORKER_URL/health/content-write-suite" | tee /tmp/content-suite.status
          cp /tmp/content-suite.json release/cloudflare/content-write-suite.json
          if [ "$(cat /tmp/content-suite.status)" != "200" ]; then echo "ERROR: CONTENT WRITE SUITE FAILED: HTTP $(cat /tmp/content-suite.status)"; cat /tmp/content-suite.json; exit 1; fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/content-suite.json'))
          if d.get('ok') is not True: raise SystemExit(f'ERROR: CONTENT WRITE SUITE FAILED: {d}')
          required=['schema','dashboard_config','banners','banner_media','gallery_items','gallery_media','social_links','feature_buttons','managed_links','dashboard_ads','notifications','notification_reads','r2']
          bad=[k for k in required if d.get('checks',{}).get(k)!='ok']
          if bad: raise SystemExit(f'ERROR: CONTENT WRITE SUITE FAILED: {bad} {d}')
          print('LIVE CONTENT WRITE SUITE PASSED')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore EXISTING permanent signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: my-shop-release-signing-v1

      - name: Refuse accidental signing-key replacement
        shell: bash
        run: |
          set -euo pipefail
          test -f .signing/myshop-release.jks || { echo 'ERROR: Permanent signing key is unavailable. STOPPED to prevent an incompatible APK update.'; exit 1; }
          keytool -list -keystore .signing/myshop-release.jks -storepass 'myshop-release-2026' -alias myshop >/dev/null

      - name: Build exactly ONE release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build
          gradle clean :app:assembleRelease --no-daemon --no-build-cache --rerun-tasks
          mapfile -t APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1 || { echo "ERROR: Expected exactly one APK; found ${#APKS[@]}"; printf '%s\n' "${APKS[@]}"; exit 1; }
          echo "UNSIGNED_APK=${APKS[0]}" >> "$GITHUB_ENV"

      - name: Verify package and exact version before signing
        shell: bash
        run: |
          set -euo pipefail
          OUT="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$PROJECT/$UNSIGNED_APK")"
          echo "$OUT"
          echo "$OUT" | grep -Fq "package: name='com.myshop.app'"
          echo "$OUT" | grep -Fq "versionName='2.9.$SOURCE_VERSION'"
          echo "$OUT" | grep -Fq "versionCode='$SOURCE_VERSION'"

      - name: Sign exactly ONE APK with existing permanent key
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release
          "$BT/zipalign" -f -p 4 "$PROJECT/$UNSIGNED_APK" release/aligned.apk
          "$BT/apksigner" sign --ks .signing/myshop-release.jks --ks-pass pass:myshop-release-2026 --key-pass pass:myshop-release-2026 --ks-key-alias myshop --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release/MY_SHOP_FINAL_RELEASE.apk release/aligned.apk
          "$BT/apksigner" verify --verbose release/MY_SHOP_FINAL_RELEASE.apk
          rm -f release/aligned.apk
          sha256sum release/MY_SHOP_FINAL_RELEASE.apk > release/MY_SHOP_FINAL_RELEASE.apk.sha256

      - name: Final safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 1
          test -f release/MY_SHOP_FINAL_RELEASE.apk.sha256
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM[[:space:]]+myshop_auth_users_v108' "$PROJECT/backend/worker/src" >/dev/null
          echo 'FINAL SAFETY GUARDS PASSED'

      - name: Upload Cloudflare verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-V-${{ env.SOURCE_VERSION }}-CLOUDFLARE-DIAGNOSTICS
          path: release/cloudflare
          if-no-files-found: ignore

      - name: Upload exactly ONE final APK plus checksum
        uses: actions/upload-artifact@v4
        with:
          name: MY-SHOP-FINAL-V-${{ env.SOURCE_VERSION }}
          path: |
            release/MY_SHOP_FINAL_RELEASE.apk
            release/MY_SHOP_FINAL_RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
